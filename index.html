c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Wie lässt sich Blutverlust abschätzen?\u003c/h3>\u003cp>Saugerinhalt, Spülflüssigkeit, Tücher, OP-Feld und klinischer Verlauf werden zusammengeführt. Jede Methode hat Fehlerquellen. Bei Saugersystemen ist die Spülmenge abzuziehen; verdeckte Blutung und unbekannte Verluste bleiben möglich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zulauf von Spüllösung separat dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was muss bei fortgesetzter Blutung eskaliert werden?\u003c/h3>\u003cp>Operative Blutungsquelle, Bedarf an Blutprodukten, Laborlaufzeiten und Kreislauftherapie frühzeitig ansprechen. Bei dynamischer Verschlechterung den lokalen Massivblutungsplan aktivieren. Materiallogistik und Blutbankkommunikation gehören zur Therapieorganisation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eskalation vor dem völligen Zusammenbruch einleiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Welche Übergabe unterstützt die Weiterbehandlung?\u003c/h3>\u003cp>Blutungsursache, geschätzte Rate und Summe, Produkte und Faktoren, letzte Labore, Temperatur, Calcium und laufende Therapie nennen. Ungeklärte Differenzialdiagnosen und ausstehende Befunde ausdrücklich markieren. Eine scheinbar normale Zahl darf relevante Verlaufstrends nicht verdecken.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Quelle stillen, Milieu sichern, Wirkung wiederholt prüfen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-bleeding\">\u003ca href=\"https://esaic.org/guideline/severe-perioperative-bleeding-management-guideline-2nd-update/\" target=\"_blank\" rel=\"noopener noreferrer\">Management of severe peri-operative bleeding – Second update 2022\u003c/a>\u003cp>ESAIC; European Journal of Anaesthesiology 2023;40:226–304 · 2023\u003c/p>\u003cp class=\"muted\">Offizielle Übersicht und zugängliche Empfehlungen geprüft; kein vollständiger systematischer Volltext-Review behauptet.\u003c/p>\u003c/li>\u003cli id=\"source-trauma\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/\" target=\"_blank\" rel=\"noopener noreferrer\">The European guideline on management of major bleeding and coagulopathy following trauma: sixth edition\u003c/a>\u003cp>Rossaint et al.; Critical Care 2023;27:80 · 2023-03-01\u003c/p>\u003cp class=\"muted\">Originalleitlinie frei zugänglich; relevante Abschnitte zu Blutung, Monitoring und Milieu geprüft. Geltungsbereich Trauma, keine pauschale Übertragung auf alle OP-Blutungen.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/04-color.png","readingMinutes":9},{"id":"05","title":"CO₂-Gasembolie","category":"Notfälle","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Ein etCO₂-Abfall kann verminderten pulmonalen Blutfluss anzeigen. Technische Probleme und andere Kreislaufursachen bleiben wichtige Differenzialdiagnosen.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Gelangt Gas in das Gefäßsystem, kann es den rechten Kreislauf und die Lungenperfusion beeinträchtigen. Bei schwerem Verlauf sinken Herzzeitvolumen und pulmonaler Blutfluss. CO₂ ist vergleichsweise gut löslich; eine große oder schnelle Gaszufuhr kann trotzdem lebensbedrohlich sein.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Ein plötzlicher etCO₂-Abfall zusammen mit Hypotonie unmittelbar bei Insufflation ist verdächtig. Der etCO₂-Verlauf kann variieren und beweist die Diagnose nicht. Blutung, Lungenembolie und technische Probleme gehören zu den Differenzialdiagnosen.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Den Verdacht sofort aussprechen. Insufflation stoppen und das Pneumoperitoneum durch das operative Team entlasten lassen. Oxygenierung mit 100 % Sauerstoff und Kreislaufunterstützung priorisieren; bei Kreislaufstillstand unverzüglich reanimieren.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Insufflationszeit und Symptome dokumentieren. Notfallmaterial, Blutgasanalyse und erweiterte Diagnostik bereitstellen. Echokardiografie kann die Diagnose unterstützen. Zusätzliche Lagerungsmaßnahmen oder Gasaspiration dürfen die grundlegende Versorgung nicht verzögern.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Insufflationsereignis, etCO₂ und Kreislauf gemeinsam beurteilen.\u003c/li>\u003cli>Bei Verdacht Gaszufuhr stoppen lassen und Oxygenierung sichern.\u003c/li>\u003cli>CO₂-Löslichkeit verhindert keinen Kollaps bei großer Gaslast.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Während einer laparoskopischen Gefäßpräparation fallen etCO₂ und Blutdruck abrupt. Die Verbindung zum Atemweg ist intakt.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Ein etCO₂-Abfall kann verminderten pulmonalen Blutfluss anzeigen. Technische Probleme und andere Kreislaufursachen bleiben wichtige Differenzialdiagnosen.\u003c/p>\u003cp>Während einer Insufflation kann Kohlendioxid unbeabsichtigt in ein Gefäßsystem gelangen. Größere Gasmengen können den Blutfluss durch das rechte Herz und die Lungengefäße behindern. Die gute Löslichkeit von CO₂ vermindert manche Risiken, verhindert aber keinen akuten Kreislaufstillstand.\u003c/p>\u003cp>Je nach Schwere sind engmaschige Überwachung, Intensivbehandlung und Kontrolle möglicher Organfolgen erforderlich. Neurologische Veränderungen, Myokardbelastung und erneute Kreislaufinstabilität werden aktiv gesucht. Das Fehlen sichtbaren Gases zu einem späteren Zeitpunkt widerlegt einen früheren Eintritt nicht.\u003c/p>\u003cp>Ein plötzlicher etCO₂-Abfall kann ein Kreislaufwarnsignal sein. In Verbindung mit Insufflation, Hypotonie und Hypoxämie muss eine Gasembolie mitgedacht werden. Zeitkritische Kommunikation und koordinierter Insufflationsstopp sind zentrale Beiträge.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was ist eine CO₂-Gasembolie?\u003c/h3>\u003cp>Während einer Insufflation kann Kohlendioxid unbeabsichtigt in ein Gefäßsystem gelangen. Größere Gasmengen können den Blutfluss durch das rechte Herz und die Lungengefäße behindern. Die gute Löslichkeit von CO₂ vermindert manche Risiken, verhindert aber keinen akuten Kreislaufstillstand.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Plötzliche Monitorveränderungen zeitlich mit chirurgischen Schritten abgleichen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Wie kann Gas in eine Vene eintreten?\u003c/h3>\u003cp>Ein eröffnetes Gefäß und ein entsprechender Druckgradient ermöglichen den Eintritt. Gefäßverletzungen oder eine intravasale Lage eines Insufflationsinstruments sind mögliche Konstellationen. Menge und Eintrittsgeschwindigkeit beeinflussen die Schwere; sichtbare Blutung muss nicht gleichzeitig ausgeprägt sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Insufflationsbeginn und Gefäßpräparation als wichtige Ereignisse dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Warum ist CO₂ trotz seiner Löslichkeit gefährlich?\u003c/h3>\u003cp>Gas kann schneller zugeführt werden, als es im Blut gelöst und über die Lunge abgeatmet wird. Dann entsteht eine mechanische Behinderung mit rascher hämodynamischer Verschlechterung. Die Löslichkeit ist kein Schutz vor einer großen akuten Gaslast.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Kollaps nicht auf spontane Auflösung vertrauen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was passiert im rechten Herzen?\u003c/h3>\u003cp>Eine große Gaslast behindert den rechtsventrikulären Auswurf und kann den pulmonalen Gefäßwiderstand erhöhen. Der linke Ventrikel erhält weniger Vorlast. Daraus können Hypotonie, reduzierte Koronarperfusion und Kreislaufversagen entstehen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Rechtsherzbelastung und vermindertes Herzzeitvolumen gemeinsam denken.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Warum fällt etCO₂ bei schwerem Ereignis oft ab?\u003c/h3>\u003cp>Sinkt der pulmonale Blutfluss, gelangt weniger CO₂ aus dem Körper zur ventilierten Alveole. Der endtidale Wert kann deshalb abrupt abfallen, obwohl die CO₂-Produktion weiterbesteht. Eine CO₂-Embolie ist somit nicht einfach eine Hyperkapnie durch Gasresorption.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei etCO₂-Abfall mit Hypotonie auch Perfusionsversagen erwägen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Kann etCO₂ auch vorübergehend ansteigen?\u003c/h3>\u003cp>Ja. Gelöstes CO₂ kann zunächst vermehrt zur Lunge transportiert werden und den Messwert erhöhen. Bei größerer Embolie kann anschließend die Perfusionsbehinderung dominieren. Kurvenverlauf und klinischer Kontext sind deshalb wichtiger als eine starre erwartete Richtung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ein initialer Anstieg schließt ein späteres embolisches Ereignis nicht aus.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Wie unterscheidet sich normale CO₂-Resorption?\u003c/h3>\u003cp>Beim Pneumoperitoneum wird CO₂ auch ohne Gefäßeintritt über Gewebe aufgenommen. Der Anstieg entwickelt sich typischerweise anders als ein akuter Kreislaufkollaps. Ausgeprägte Hypotonie oder plötzlicher Kurvenverlust verlangen zusätzliche Ursachenklärung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht jeden etCO₂-Anstieg als Gasembolie diagnostizieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Differenzialdiagnosen bestehen?\u003c/h3>\u003cp>Diskonnektion, Tubusdislokation, schwere Blutung, Spannungspneumothorax, thrombotische Embolie und Anaphylaxie können ähnliche Veränderungen verursachen. Ein rascher Atemwegs- und Kreislaufcheck ist notwendig. Die zeitliche Nähe zur Insufflation stützt einen Verdacht, beweist ihn aber nicht.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Technikprüfung und klinische Stabilisierung parallel durchführen.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was hat nach Verdacht Priorität?\u003c/h3>\u003cp>Verdacht klar aussprechen, Hilfe rufen und die chirurgische Gaszufuhr sofort stoppen lassen. Eine Entlastung des Pneumoperitoneums wird mit der Chirurgie koordiniert. Gleichzeitig Oxygenierung, Ventilation und Kreislauf sichern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Insufflatorstillstand ausdrücklich rückbestätigen lassen.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Welche Sauerstoffstrategie wird akut verwendet?\u003c/h3>\u003cp>Bei bedrohlichem Ereignis wird eine hohe inspiratorische Sauerstoffkonzentration zur Behandlung der Hypoxämie eingesetzt. Ventilation und CO₂-Elimination werden unter Berücksichtigung von Kreislauf und Atemmechanik angepasst. Eine Beatmungsänderung ersetzt nicht das Stoppen des Gaseintritts.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Sauerstoffversorgung und tatsächliche Ventilation überprüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Wie ist mit Lachgas umzugehen?\u003c/h3>\u003cp>Bei Gasembolie wird Lachgas beendet, falls es verwendet wird. Gasraum- und Kreislaufprobleme dürfen nicht durch weitere ungünstige Gaswirkungen verstärkt werden. Dies ist Teil eines anästhesiologischen Notfallplans und keine alleinige Behandlung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Frischgaszusammensetzung aktiv kontrollieren und kommunizieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Welche Rolle spielt Echokardiographie?\u003c/h3>\u003cp>Eine geeignete echokardiographische Untersuchung kann intrakardiales Gas und hämodynamische Folgen zeigen. Sensitivität, Zugang und Erfahrung beeinflussen die Aussagekraft. Der Notfall darf nicht auf eine Bildbestätigung warten, wenn klinisch bereits eine bedrohliche Situation besteht.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Verfügbare Expertise früh anfordern.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Ist eine bestimmte Lagerung immer erforderlich?\u003c/h3>\u003cp>Nein. Für spezielle Lagerungsmanöver ist die Evidenz begrenzt und die praktische Umsetzbarkeit situationsabhängig. Oxygenierung, Reanimation, Operationsbedingungen und Kreislauf dürfen nicht durch ein schematisches Manöver gefährdet werden. Eine individuelle ärztliche Entscheidung ist erforderlich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kein Lagerungsmanöver als garantiert wirksame Sofortlösung darstellen.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Soll routinemäßig ein neuer ZVK zur Gasaspiration gelegt werden?\u003c/h3>\u003cp>Ein bereits geeigneter Katheter kann in bestimmten Situationen einen Aspirationsversuch ermöglichen. Die Wirksamkeit ist begrenzt und lageabhängig. Eine neue Katheteranlage darf zentrale Notfallmaßnahmen nicht verzögern. Ein ZVK ist kein sicherer Nachweis vollständiger Gasentfernung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bestehende Zugänge und Lage kennen, keine Verzögerung durch Materialsuche.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Was bedeutet paradoxe Gasembolie?\u003c/h3>\u003cp>Gas gelangt von der venösen auf die arterielle Seite, etwa über eine Rechts-links-Verbindung. Dadurch können Gehirn oder Koronararterien betroffen sein. Auch nach Stabilisierung verdienen neurologische oder kardiale Auffälligkeiten besondere Aufmerksamkeit.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Neue fokale Defizite sofort ansprechen und dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Was ist bei Kreislaufstillstand wichtig?\u003c/h3>\u003cp>Sofortige leitliniengerechte Reanimation und Behandlung der vermuteten Ursache erfolgen parallel. Gaszufuhr stoppen und Oxygenierung sichern. Reanimationsmaßnahmen werden nicht für eine definitive bildgebende Diagnose zurückgestellt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Lokalen perioperativen Reanimationsplan aktivieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Welche Folgen hat das Ablassen des Pneumoperitoneums?\u003c/h3>\u003cp>Es kann den weiteren Gaseintritt begrenzen und mechanische Effekte verändern. Gleichzeitig kann eine zuvor durch Druck tamponierte Blutung sichtbar werden. Nach Entlastung muss deshalb die Hämodynamik und Blutungssituation erneut beurteilt werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Auch nach vermeintlicher Entlastung auf Blutverlust vorbereitet bleiben.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Welche Daten müssen gesichert werden?\u003c/h3>\u003cp>Insufflationszeitpunkt, Druckeinstellungen, chirurgischer Schritt, etCO₂-Verlauf, Kreislaufwerte, Interventionen und Reaktion dokumentieren. Soweit vorhanden bildgebende Befunde und Blutgasanalysen ergänzen. Dokumentation soll Beobachtung und Verdachtsdiagnose klar trennen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitlinien unterstützen die nachträgliche Ursachenanalyse.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was ist nach Stabilisierung relevant?\u003c/h3>\u003cp>Je nach Schwere sind engmaschige Überwachung, Intensivbehandlung und Kontrolle möglicher Organfolgen erforderlich. Neurologische Veränderungen, Myokardbelastung und erneute Kreislaufinstabilität werden aktiv gesucht. Das Fehlen sichtbaren Gases zu einem späteren Zeitpunkt widerlegt einen früheren Eintritt nicht.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ereignis und noch offene Fragen vollständig übergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale pflegerische Lernbrücke?\u003c/h3>\u003cp>Ein plötzlicher etCO₂-Abfall kann ein Kreislaufwarnsignal sein. In Verbindung mit Insufflation, Hypotonie und Hypoxämie muss eine Gasembolie mitgedacht werden. Zeitkritische Kommunikation und koordinierter Insufflationsstopp sind zentrale Beiträge.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Gaszufuhr stoppen, Oxygenierung sichern, Perfusion beurteilen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-aha-gas\">\u003ca href=\"https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/adult-and-pediatric-special-circumstances-of-resuscitation\" target=\"_blank\" rel=\"noopener noreferrer\">Adult and Pediatric Special Circumstances of Resuscitation – Gas Embolism\u003c/a>\u003cp>American Heart Association Guidelines 2025 · 2025\u003c/p>\u003cp class=\"muted\">Offizielle Empfehlungen frei lesbar; begrenzte Evidenz bei Gasembolie ausdrücklich berücksichtigt.\u003c/p>\u003c/li>\u003cli id=\"source-gas-review\">\u003ca href=\"https://www.ncbi.nlm.nih.gov/books/NBK539885/\" target=\"_blank\" rel=\"noopener noreferrer\">Carbon Dioxide Embolism\u003c/a>\u003cp>StatPearls / NCBI Bookshelf · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Frei lesbarer klinischer Übersichtsartikel; ergänzende Erklärung, keine neue Leitlinie.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/05-color.png","readingMinutes":9},{"id":"06","title":"Einlungenventilation","category":"Beatmung","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Eine frühere Lagekontrolle garantiert keine unveränderte spätere Position. Fehlposition und Sekret müssen geprüft werden, bevor Hypoxämie als unvermeidbar akzeptiert wird.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Ein Doppellumentubus oder Bronchusblocker ermöglicht die Belüftung nur einer Lunge. Die nicht ventilierte Seite kann weiter durchblutet werden und erzeugt einen Shunt. Die hypoxische pulmonale Vasokonstriktion lenkt einen Teil des Blutes zur besser belüfteten Lunge um.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Sättigungsabfall, veränderte Atemwegsdrücke oder unzureichende Lungenisolation verlangen rasche Kontrolle. Eine Dislokation nach Lagerung ist eine wichtige reversible Ursache. Sekret und Atelektasen der belüfteten Seite können den Gasaustausch zusätzlich verschlechtern.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Operateur und Anästhesie sofort informieren. Oxygenierung sichern und die Lage des Isolationssystems bronchokopisch überprüfen lassen. Beatmung individuell optimieren. Bei bedrohlicher Hypoxämie kann die Wiederaufnahme der Zweilungenventilation nötig sein; das wird mit dem operativen Team abgestimmt.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Bronchoskop, Absaugung und Anschlüsse vor Lagerungsbeginn vorbereiten. Einstellungen und Veränderungen nach jeder Umlagerung vergleichen. Sekretmanagement und Cuff-Handhabung erfolgen gezielt nach Anordnung und Gerätekenntnis; unnötige Manipulation vermeiden.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Tubus- beziehungsweise Blockerlage nach Umlagerung erneut prüfen.\u003c/li>\u003cli>Shunt und Atemmechanik bestimmen die Oxygenierung gemeinsam.\u003c/li>\u003cli>Bei schwerer Hypoxämie hat Oxygenierung Vorrang vor Operationssicht.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Nach Seitenlagerung unter Einlungenventilation fällt die Sättigung. Zuvor war die Isolation bronchoskopisch korrekt.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Eine frühere Lagekontrolle garantiert keine unveränderte spätere Position. Fehlposition und Sekret müssen geprüft werden, bevor Hypoxämie als unvermeidbar akzeptiert wird.\u003c/p>\u003cp>Sie schafft bei bestimmten thoraxchirurgischen Eingriffen Operationsraum und kann gesunde und erkrankte Lunge voneinander isolieren. Die Maßnahme verändert den Gasaustausch erheblich. Nicht jede Operation erfordert dieselbe Technik oder dieselben Beatmungseinstellungen.\u003c/p>\u003cp>Verfahren und Seite der Isolation, Hypoxämieepisoden, Lageprobleme, Beatmungsstrategie, BGA und aktuelle Unterstützung nennen. Bei Tubuswechsel oder Extubation Besonderheiten und offene Probleme dokumentieren. Auch postoperative Schmerzen können die Atemfunktion einschränken.\u003c/p>\u003cp>Einlungenventilation ist eine kontrollierte Störung von Belüftung und Perfusion. Sichere Isolation, erneute Lagekontrolle und rasche Kommunikation bei Hypoxämie sind entscheidend. Operationssicht wird nicht auf Kosten lebenswichtiger Oxygenierung aufrechterhalten.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Warum wird eine Einlungenventilation durchgeführt?\u003c/h3>\u003cp>Sie schafft bei bestimmten thoraxchirurgischen Eingriffen Operationsraum und kann gesunde und erkrankte Lunge voneinander isolieren. Die Maßnahme verändert den Gasaustausch erheblich. Nicht jede Operation erfordert dieselbe Technik oder dieselben Beatmungseinstellungen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Indikation und geplante Isolationsseite vor Beginn im Team abgleichen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Welche Techniken ermöglichen die Lungentrennung?\u003c/h3>\u003cp>Doppellumentuben und Bronchusblocker sind häufige Verfahren. Auswahl und Lage hängen von Anatomie, Operation und Erfahrung ab. Beide verlangen eine verlässliche Kontrolle; die korrekte äußere Tubustiefe allein beweist keine richtige bronchiale Position.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bronchoskop und passendes Absaugmaterial bereithalten.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Warum ist die Bronchoskopie wichtig?\u003c/h3>\u003cp>Sie erlaubt eine direkte Kontrolle von Tubus- oder Blockerlage. Umlagerung, chirurgische Manipulation und Cuffveränderungen können eine zuvor korrekte Lage verändern. Eine erneute Hypoxämie oder auffällige Ventilation erfordert deshalb die Prüfung der Position.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach Seitenlagerung eine erneute Lagekontrolle einplanen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was geschieht mit dem Ventilations-Perfusions-Verhältnis?\u003c/h3>\u003cp>Die nicht ventilierte Lunge kann weiterhin durchblutet sein. Dadurch entsteht venöse Beimischung beziehungsweise Shunt. Auch die ventilierte Lunge kann in abhängigen Bereichen minderbelüftet werden. Oxygenierung hängt deshalb von beiden Lungen und der Perfusionsverteilung ab.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Die nicht ventilierte Seite bleibt physiologisch relevant.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Was ist hypoxische pulmonale Vasokonstriktion?\u003c/h3>\u003cp>Niedriger alveolärer Sauerstoff führt lokal zu einer Gefäßverengung in der Lunge. Dadurch kann Blutfluss von schlecht belüfteten Arealen weggeleitet werden. Dieser Schutzmechanismus ist begrenzt und verhindert nicht jede Hypoxämie unter Einlungenventilation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> HPV als Umverteilung verstehen, nicht als vollständigen Shuntverschluss.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Warum begünstigt Seitenlagerung häufig die Perfusion der unteren Lunge?\u003c/h3>\u003cp>Die Schwerkraft beeinflusst den pulmonalen Blutfluss. Zugleich verändern Anästhesie, Beatmung und Operation die Belüftung der abhängigen Lunge. Der potenzielle Nutzen der Perfusionsverteilung kann durch Kompression und Atelektasen eingeschränkt werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Lagerung und Atemmechanik gemeinsam beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Warum wird Tidalvolumen nicht aus dem tatsächlichen Gewicht allein gewählt?\u003c/h3>\u003cp>Die Lungengröße folgt eher Körpergröße und biologischem Körperbau als Fettmasse. Eine Beatmung nach tatsächlichem Gewicht kann bei Adipositas zu großen Volumina führen. Bei einer ventilierten Lunge ist Überdehnung besonders zu vermeiden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bezug auf prädiziertes Körpergewicht und konkreten Beatmungsplan prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Worauf zielt eine protektive Beatmung?\u003c/h3>\u003cp>Sie soll ausreichenden Gasaustausch bei möglichst geringer mechanischer Schädigung ermöglichen. Dazu gehören angemessene Volumina, Druckbeurteilung und individuell gewählter PEEP. Ein einzelner Zahlenwert kann diesen Gesamtansatz nicht ersetzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Plateaudruck, treibenden Druck und Hämodynamik im Verlauf beobachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Warum kann PEEP sowohl helfen als auch schaden?\u003c/h3>\u003cp>PEEP kann kollabierte Bereiche der ventilierten Lunge stabilisieren. Zu hoher Druck kann andere Areale überdehnen und die Perfusion ungünstig verlagern. Zusätzlich kann der venöse Rückstrom sinken. Die Wirkung hängt von individueller Rekrutierbarkeit ab.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach Anpassung nicht nur SpO₂, sondern auch Blutdruck beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Welche erste Ursache ist bei neuer Hypoxämie auszuschließen?\u003c/h3>\u003cp>Eine Fehlposition des Doppellumentubus oder Blockers kann Ventilation und Isolation stören. Gleichzeitig müssen Sauerstoffzufuhr, Sekret, Schlauchsystem und Kreislauf geprüft werden. Eine neue Hypoxämie darf nicht ohne Untersuchung als unvermeidbarer Shunt akzeptiert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Verantwortliche Anästhesieperson informieren und Bronchoskopie vorbereiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Wie wird eine schwere Hypoxämie behandelt?\u003c/h3>\u003cp>Oxygenierung hat Vorrang vor optimaler Operationssicht. Eine Unterbrechung der Operation und gegebenenfalls erneute Zweilungenventilation werden unverzüglich koordiniert. Hohe FiO₂ und weitere Maßnahmen werden der Situation angepasst, während die Ursache gesucht wird.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Die Dringlichkeit klar benennen und chirurgische Rückmeldung einfordern.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Welche Bedeutung hat CPAP an der nicht ventilierten Lunge?\u003c/h3>\u003cp>Es kann in geeigneten Situationen die Oxygenierung verbessern, beeinflusst aber die Operationsbedingungen. Anwendung und Druckhöhe werden mit der Chirurgie und Anästhesie abgestimmt. Das Verfahren ist nicht für jede Indikation und jede operative Phase geeignet.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Veränderung des Operationsfelds vor Anwendung besprechen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Warum kann ein Recruitment-Manöver riskant sein?\u003c/h3>\u003cp>Ein kurzzeitig höherer Druck kann Areale eröffnen, aber auch Hypotonie und Überdehnung auslösen. Bei bestimmten strukturellen Lungenerkrankungen ist besondere Vorsicht erforderlich. Ein standardisiertes Hochdruckmanöver ist keine universelle Antwort auf Desaturation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Hämodynamische Reserve und ärztliche Indikation prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Warum ist Herzzeitvolumen für die Oxygenierung relevant?\u003c/h3>\u003cp>Es beeinflusst pulmonalen Blutfluss und gemischtvenösen Sauerstoffgehalt. Sowohl geringe Perfusion als auch ungünstige Flussverteilung können die Situation verschlechtern. Ein SpO₂-Problem wird deshalb nicht allein durch Beatmungsparameter erklärt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kreislaufstatus und Hb in die Beurteilung einbeziehen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Wie wird CO₂ kontrolliert?\u003c/h3>\u003cp>etCO₂ liefert einen kontinuierlichen Verlauf, kann bei verändertem Totraum und Perfusionsmuster aber vom arteriellen PaCO₂ abweichen. Eine BGA ist bei entsprechender klinischer Frage nötig. Atemfrequenzänderungen müssen mit Exspirationszeit und Atemmechanik abgestimmt werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei relevanten Abweichungen eine arterielle Messung organisieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Welche Bedeutung haben Sekret und Blut?\u003c/h3>\u003cp>Sie können das enge Lumen behindern und den Gasaustausch verschlechtern. Das Absaugen muss zum Lumen und zur Isolationssituation passen. Eine blinde Manipulation kann Verletzungen oder eine Lageveränderung verursachen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Passende Kathetergröße und korrekte Seite vor Absaugung prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Warum werden Cuffs kontrolliert?\u003c/h3>\u003cp>Undichtigkeit oder übermäßiger Cuffdruck können Isolation und Schleimhautsicherheit beeinträchtigen. Druck und Lage verändern sich unter Manipulation und Umlagerung. Eine Bronchusblockade darf nicht durch ungeprüftes weiteres Aufblasen kompensiert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Gerätespezifische Anleitung und Druckmessung berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was wird bei Rückkehr zur Zweilungenventilation beobachtet?\u003c/h3>\u003cp>Reexpansion, Atemwegsdrücke, Leckage und Oxygenierung erneut beurteilen. Die operierte Lunge kann anders reagieren als zuvor. Chirurgische Anforderungen und Risiken einer Reexpansion werden im Team abgestimmt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht ungeprüft zu früheren Einstellungen zurückspringen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was gehört in die postoperative Übergabe?\u003c/h3>\u003cp>Verfahren und Seite der Isolation, Hypoxämieepisoden, Lageprobleme, Beatmungsstrategie, BGA und aktuelle Unterstützung nennen. Bei Tubuswechsel oder Extubation Besonderheiten und offene Probleme dokumentieren. Auch postoperative Schmerzen können die Atemfunktion einschränken.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Atemwegs- und Kreislaufereignisse zeitlich nachvollziehbar weitergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Einlungenventilation ist eine kontrollierte Störung von Belüftung und Perfusion. Sichere Isolation, erneute Lagekontrolle und rasche Kommunikation bei Hypoxämie sind entscheidend. Operationssicht wird nicht auf Kosten lebenswichtiger Oxygenierung aufrechterhalten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Erst Lage prüfen, dann Strategie anpassen; Oxygenierung hat Vorrang.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-oa-olv\">\u003ca href=\"https://www.openanesthesia.org/keywords/hypoxia-during-one-lung-ventilation/\" target=\"_blank\" rel=\"noopener noreferrer\">Hypoxia During One-Lung Ventilation\u003c/a>\u003cp>OpenAnesthesia / International Anesthesia Research Society · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Frei zugänglicher Lehrartikel; relevante Physiologie und klinischer Ablauf geprüft. Keine Abbildungen kopiert.\u003c/p>\u003c/li>\u003cli id=\"source-probese\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6582260/\" target=\"_blank\" rel=\"noopener noreferrer\">Effect of Intraoperative High PEEP With Recruitment Maneuvers vs Low PEEP … A Randomized Clinical Trial\u003c/a>\u003cp>PROBESE Collaborative Group; JAMA 2019;321:2292–2305 · 2019\u003c/p>\u003cp class=\"muted\">Frei zugängliche Originalstudie; Population, Vergleichsstrategie und Ergebnis geprüft. Keine individuelle PEEP-Verordnung.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/06-color.png","readingMinutes":9},{"id":"07","title":"Perioperatives Flüssigkeitsmanagement","category":"Kreislauf","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Reaktionsfähigkeit auf Volumen und tatsächlicher Flüssigkeitsbedarf sind nicht identisch. Ein begründetes Therapieziel verhindert ungezielte Wiederholungsboli.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Flüssigkeit verteilt sich abhängig von ihrer Zusammensetzung und dem Zustand der Gefäßbarriere. Ein Blutdruckabfall kann durch Volumenmangel, Vasodilatation oder eine eingeschränkte Herzleistung entstehen. Mehr Flüssigkeit ist deshalb nicht automatisch die passende Antwort.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Anamnese, klinische Perfusion, Blutdruckverlauf, Bilanz und Laborwerte gemeinsam betrachten. Oligurie allein beweist keinen Volumenmangel. Auch Zeichen einer Überlastung wie zunehmende Atemnot oder Ödeme müssen in die Bewertung einfließen.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>NICE strukturiert Flüssigkeitstherapie in Reanimation, Erhaltung, Ersatz, Umverteilung und erneute Bewertung. Jede Gabe braucht ein Ziel und eine Wirkungskontrolle. Bei instabilen Patienten erfolgen wiederholte ABCDE-Beurteilung und engmaschige Kreislaufkontrolle.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Alle Quellen erfassen: Infusionen, Medikamententräger, Blutprodukte und enterale Zufuhr. Einfuhr und Verluste mit Zeitbezug dokumentieren. Nach Interventionen nicht nur den Blutdruck, sondern auch Atmung und Perfusion rückmelden. Bei Blutung früh den passenden Blutungsalgorithmus nutzen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Hypotonie ist nicht automatisch Volumenmangel.\u003c/li>\u003cli>Reanimation, Erhaltungsbedarf und Verlustausgleich getrennt planen.\u003c/li>\u003cli>Nach jeder relevanten Gabe Wirkung und Überlastungszeichen prüfen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Nach Narkoseeinleitung sinkt der Blutdruck. Nach einer ersten Flüssigkeitsgabe ist die Wirkung gering, der Sauerstoffbedarf steigt.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Reaktionsfähigkeit auf Volumen und tatsächlicher Flüssigkeitsbedarf sind nicht identisch. Ein begründetes Therapieziel verhindert ungezielte Wiederholungsboli.\u003c/p>\u003cp>Reanimation des Kreislaufs, Erhaltungsbedarf und Ersatz konkreter Verluste sind verschiedene Indikationen. Eine Infusionsrate kann deshalb nicht allein aus dem Körpergewicht abgeleitet werden. Jede Verordnung braucht Ziel, Menge, Zusammensetzung und geplante Kontrolle.\u003c/p>\u003cp>Kreislauf, Atemfunktion, Körpergewicht im geeigneten Verlauf, Elektrolyte, Nierenwerte und Bilanz werden indikationsabhängig kontrolliert. Eine Verordnung braucht einen Reassessment-Zeitpunkt. Bei Infusionspumpen sind tatsächliche Rate und Gesamtvolumen zu prüfen.\u003c/p>\u003cp>Volumen ist keine allgemeine Blutdrucktherapie. Erst Indikation und Ursache klären, dann passende Lösung und Menge wählen, schließlich Wirkung und Nebenwirkung überprüfen. Eine gute Therapie kann auch das rechtzeitige Stoppen weiterer Flüssigkeit sein.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Welche unterschiedlichen Aufgaben hat Infusionstherapie?\u003c/h3>\u003cp>Reanimation des Kreislaufs, Erhaltungsbedarf und Ersatz konkreter Verluste sind verschiedene Indikationen. Eine Infusionsrate kann deshalb nicht allein aus dem Körpergewicht abgeleitet werden. Jede Verordnung braucht Ziel, Menge, Zusammensetzung und geplante Kontrolle.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vor Beginn fragen, ob Resuscitation, Maintenance oder Replacement gemeint ist.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Was sind die fünf R der NICE-Leitlinie?\u003c/h3>\u003cp>Resuscitation, Routine maintenance, Replacement, Redistribution und Reassessment strukturieren die Flüssigkeitsbeurteilung. Sie verbinden Indikation und Verteilung mit wiederholter Kontrolle. Das Schema ist eine Denkhilfe, kein automatisch auszurechnender Einheitsplan.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach jeder relevanten Veränderung erneut beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Warum bedeutet Hypotonie nicht automatisch Volumenmangel?\u003c/h3>\u003cp>Vasodilatation, eingeschränkte Pumpfunktion, Rhythmusstörungen und mechanische Ursachen können den Blutdruck ebenfalls senken. Eine Flüssigkeitsgabe kann dann wirkungslos oder schädlich sein. Klinik, Verlauf und geeignete Diagnostik grenzen die Ursache ein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vor wiederholten Bolusgaben das therapeutische Ziel klären.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was unterscheidet Hypovolämie von Dehydratation?\u003c/h3>\u003cp>Hypovolämie betrifft ein vermindertes wirksames zirkulierendes Volumen. Dehydratation bezeichnet einen Wasserverlust mit unterschiedlicher Elektrolytkonstellation. Beide können zusammen auftreten, benötigen aber nicht automatisch dieselbe Lösung oder Geschwindigkeit.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kreislaufproblem und Wasser-/Elektrolytproblem getrennt beschreiben.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Was ist ein Kristalloid?\u003c/h3>\u003cp>Eine Lösung kleiner gelöster Teilchen verteilt sich je nach Zusammensetzung über die Extrazellulärräume. Nur ein Teil einer gegebenen Menge bleibt länger intravasal. Zusammensetzung und klinische Situation bestimmen Wirkung und Risiken.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Infusionsmenge nicht mit dauerhaftem Plasmavolumengewinn gleichsetzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Was unterscheidet balancierte Lösungen von NaCl 0,9 %?\u003c/h3>\u003cp>Balancierte Lösungen haben ein anderes Elektrolyt- und Puffersubstratprofil als reine Kochsalzlösung. Große Chloridlasten können eine hyperchlorämische Azidose begünstigen. Trotzdem ist die Wahl situationsabhängig und berücksichtigt Elektrolyte, neurologischen Kontext und lokale Vorgaben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Lösung nicht nur nach Beutelgröße auswählen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Warum ist Flüssigkeit wie ein Medikament zu behandeln?\u003c/h3>\u003cp>Sie hat Indikation, Dosis, Wirkungen und Nebenwirkungen. Zu wenig kann Perfusion beeinträchtigen; zu viel kann Ödeme und Organbelastung fördern. Die kumulative Bilanz ist deshalb ebenso relevant wie eine einzelne Verordnung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Infusionsziel und Stoppkriterium dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Bolusgröße nennt NICE für erwachsene Krankenhauspatienten?\u003c/h3>\u003cp>Bei erforderlicher Flüssigkeitsreanimation nennt CG174 500 ml eines geeigneten Kristalloids in weniger als 15 Minuten. Das ist ein allgemeiner Leitlinienkontext, keine Pflichtdosis für jede perioperative Hypotonie. Herzinsuffizienz und andere Risikokonstellationen verlangen Individualisierung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vor und nach dem Bolus Kreislauf und Überlastungszeichen prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was bedeutet Fluid Responsiveness?\u003c/h3>\u003cp>Es beschreibt die Fähigkeit des Herzzeitvolumens, nach einer Vorlaststeigerung zuzunehmen. Dies ist nicht gleichbedeutend mit einem klinischen Bedarf an Flüssigkeit. Eine messbare Reaktion kann auch bei fehlender Indikation für weitere Volumengaben vorliegen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Reaktionsfähigkeit und tatsächlichen Nutzen getrennt diskutieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Welche Grenzen haben dynamische Parameter?\u003c/h3>\u003cp>Atemabhängige Pulsdruck- oder Schlagvolumenvariation ist nur unter passenden Bedingungen sinnvoll. Spontanatmung, Rhythmusstörungen, niedrige Tidalvolumina und veränderte Thoraxbedingungen können die Aussagekraft begrenzen. Grenzwerte sind nicht universell übertragbar.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Messbedingungen vor Interpretation ausdrücklich prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Was kann passive Beinhebung zeigen?\u003c/h3>\u003cp>Sie verschiebt vorübergehend venöses Blut zum Herzen und kann als reversibler Vorlasttest dienen. Eine aussagekräftige Beurteilung braucht eine geeignete Messung der Herzzeitvolumenänderung. Der Blutdruck allein kann die Reaktion unzureichend abbilden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nur bei durchführbarem und korrekt gemessenem Test Schlussfolgerungen ziehen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum ist ein zentralvenöser Druck allein kein Volumenmesser?\u003c/h3>\u003cp>Der Druck hängt auch von intrathorakalem Druck, Rechtsherzfunktion und venösem Tonus ab. Er bildet keine zuverlässige direkte Füllmengenanzeige ab. Trends und klinischer Kontext können helfen, aber einen festen Flüssigkeitsbedarf nicht allein begründen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ein hoher oder niedriger Wert braucht physiologische Einordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Welche Zeichen sprechen für Überlastung?\u003c/h3>\u003cp>Zunehmende Atemarbeit, neuer Sauerstoffbedarf, Ödeme und passende klinische oder sonographische Befunde können hinweisen. Die Ursache muss differenziert werden. Ein positiver Saldo allein beweist nicht jede Form von Lungenödem, erhöht aber die Aufmerksamkeit.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Verschlechterung nicht automatisch die Infusionsrate erhöhen.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Wie wird Erhaltungsbedarf eingeordnet?\u003c/h3>\u003cp>NICE nennt für viele Erwachsene als Ausgangspunkt 25–30 ml/kg/Tag Wasser mit angepassten Elektrolyten; bei älteren oder vulnerablen Personen kann weniger nötig sein. Laufende Verluste, orale Aufnahme und andere Infusionen zählen mit. Dies ist kein universeller intraoperativer Standard.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zusatzvolumina aus Medikamententrägern mitbilanzieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Warum ist Diurese kein alleiniger Bolustrigger?\u003c/h3>\u003cp>Stress, Hormone, Nierenfunktion, Obstruktion und Medikamente beeinflussen die Urinmenge. Eine geringe Diurese bedeutet nicht automatisch Flüssigkeitsmangel. Ein verstopfter Katheter muss ebenso berücksichtigt werden wie ein echtes Perfusionsproblem.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Katheter und Gesamtkreislauf prüfen, statt reflexhaft Volumen zu geben.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Wie helfen Laktat und Base Excess?\u003c/h3>\u003cp>Sie unterstützen die Beurteilung metabolischer Belastung und möglicher Minderperfusion. Beide sind unspezifisch; Leberfunktion, Medikamente und andere Mechanismen können Werte beeinflussen. Die zeitliche Entwicklung nach Therapie ist besonders wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht jeden erhöhten Laktatwert mit beliebig viel Flüssigkeit behandeln.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Was ist bei Blutverlust anders?\u003c/h3>\u003cp>Ein Kristalloid ersetzt keine verlorenen Erythrozyten oder Gerinnungsfaktoren. Große Mengen können Verdünnung und Ödeme fördern. Bei relevanter Blutung müssen Blutstillung und geeignete Blutprodukte beziehungsweise Faktoren parallel organisiert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Flüssigkeitstherapie in den Blutungsalgorithmus einordnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Wie wird eine Bilanz berechnet?\u003c/h3>\u003cp>Alle erfassten Zu- und Abflüsse werden für einen definierten Zeitraum gegenübergestellt. Nicht messbare Verluste und Messfehler begrenzen die Genauigkeit. Beispiel: 1800 ml dokumentierter Zulauf und 900 ml dokumentierter Abfluss ergeben +900 ml Bilanz, keine exakte Verteilung im Körper.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitraum und erfasste Komponenten bei jeder Bilanz nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Welche Überwachung verhindert Fehler?\u003c/h3>\u003cp>Kreislauf, Atemfunktion, Körpergewicht im geeigneten Verlauf, Elektrolyte, Nierenwerte und Bilanz werden indikationsabhängig kontrolliert. Eine Verordnung braucht einen Reassessment-Zeitpunkt. Bei Infusionspumpen sind tatsächliche Rate und Gesamtvolumen zu prüfen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Flüssigkeitsplan bei Übergaben aktiv aktualisieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Volumen ist keine allgemeine Blutdrucktherapie. Erst Indikation und Ursache klären, dann passende Lösung und Menge wählen, schließlich Wirkung und Nebenwirkung überprüfen. Eine gute Therapie kann auch das rechtzeitige Stoppen weiterer Flüssigkeit sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Ziel nennen, Wirkung prüfen, Überlastung vermeiden.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-nice-fluid\">\u003ca href=\"https://www.nice.org.uk/guidance/cg174/resources/intravenous-fluid-therapy-in-adults-in-hospital-pdf-35109752233669\" target=\"_blank\" rel=\"noopener noreferrer\">Intravenous fluid therapy in adults in hospital – CG174\u003c/a>\u003cp>NICE · 2013; Änderungen 2016; abgerufene PDF-Fassung 2026\u003c/p>\u003cp class=\"muted\">Offizielle PDF frei lesbar; Reassessment, Bolus- und Erhaltungsbedarf geprüft. Keine spezielle Verordnung für jeden intraoperativen Kontext.\u003c/p>\u003c/li>\u003cli id=\"source-trauma\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/\" target=\"_blank\" rel=\"noopener noreferrer\">The European guideline on management of major bleeding and coagulopathy following trauma: sixth edition\u003c/a>\u003cp>Rossaint et al.; Critical Care 2023;27:80 · 2023-03-01\u003c/p>\u003cp class=\"muted\">Originalleitlinie frei zugänglich; relevante Abschnitte zu Blutung, Monitoring und Milieu geprüft. Geltungsbereich Trauma, keine pauschale Übertragung auf alle OP-Blutungen.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/07-color.png","readingMinutes":9},{"id":"08","title":"Hämorrhagischer Schock","category":"Kreislauf","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Sättigung, Hämoglobinkonzentration und Herzzeitvolumen sind verschiedene Größen. Eine normale SpO₂ kann einen verminderten Sauerstofftransport nicht ausschließen.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Blutverlust verringert venösen Rückstrom und Herzzeitvolumen. Gleichzeitig sinkt bei weiterem Verlauf die verfügbare Hämoglobinmasse. Die Sauerstoffversorgung kann den Bedarf nicht mehr decken; Gerinnungsstörungen und Hypothermie verschärfen die Situation.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Kalte Haut, veränderte Vigilanz, Tachykardie, Hypotonie und eine gestörte Perfusion sind Warnzeichen. Unter Narkose oder Betablockade können typische Zeichen verändert sein. Laktat und Basendefizit unterstützen die Verlaufsbeurteilung; keine Einzelmessung ersetzt das Gesamtbild.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Sofort Hilfe, Blutstillung und ein geeignetes Blutungsprotokoll organisieren. Atemweg und Oxygenierung sichern, Zugänge und erwärmte Versorgung vorbereiten. Transfusion und Gerinnungstherapie werden mit der Blutungskontrolle abgestimmt.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Verlauf von Blutdruck, Herzfrequenz, Temperatur und Blutgasen dokumentieren. Wiederholte Blutentnahmen und Produktgaben koordinieren, Kalziumstatus und Gerinnung nach Algorithmus kontrollieren lassen. Das Ausmaß einer verdeckten Blutung aktiv kommunizieren.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Schock ist ein Perfusionsproblem, nicht nur ein niedriger Blutdruck.\u003c/li>\u003cli>Blutstillung und Wiederherstellung des Sauerstofftransports parallel organisieren.\u003c/li>\u003cli>Temperatur, Calcium und Stoffwechsel im Verlauf kontrollieren.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Bei aktiver Blutung sind Hautperfusion und Kreislauf zunehmend auffällig. Die SpO₂ bleibt unter Sauerstoff hoch.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Sättigung, Hämoglobinkonzentration und Herzzeitvolumen sind verschiedene Größen. Eine normale SpO₂ kann einen verminderten Sauerstofftransport nicht ausschließen.\u003c/p>\u003cp>Ein Blutverlust führt zu unzureichender Organperfusion und vermindertem Sauerstoffangebot. Vermindertes zirkulierendes Volumen, Verlust von Hämoglobin und Gerinnungsstörungen können sich gegenseitig verstärken. Ein normaler Blutdruck schließt eine frühe kompensierte Phase nicht aus.\u003c/p>\u003cp>Wiederblutung, Organperfusion, Hämostase, Temperatur und Stoffwechsel können sich erneut verschlechtern. Ein vorübergehend normaler Blutdruck beweist keine abgeschlossene Behandlung. Ausstehende Laborwerte und definitive Blutungskontrolle müssen geklärt sein.\u003c/p>\u003cp>Schock ist ein Perfusionsproblem, dessen Ursache rasch behandelt werden muss. Frühes Erkennen, funktionierende Zugänge, sichere Produktlogistik, Wärmeerhalt und klare Übergabe sind zentrale Aufgaben. Einzelwerte dürfen das Gesamtbild nicht überdecken.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was bedeutet hämorrhagischer Schock?\u003c/h3>\u003cp>Ein Blutverlust führt zu unzureichender Organperfusion und vermindertem Sauerstoffangebot. Vermindertes zirkulierendes Volumen, Verlust von Hämoglobin und Gerinnungsstörungen können sich gegenseitig verstärken. Ein normaler Blutdruck schließt eine frühe kompensierte Phase nicht aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blutungsverdacht vor dem ausgeprägten Druckabfall ernst nehmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Wie unterscheiden sich kompensierter und dekompensierter Verlauf?\u003c/h3>\u003cp>Zu Beginn können Vasokonstriktion und Herzfrequenzsteigerung den Blutdruck aufrechterhalten. Bei erschöpfter Reserve sinkt die Perfusion deutlich. Alter, Medikamente und Vorerkrankungen verändern diese Reaktion; starre Schockklassentabellen sind nicht für jeden Patienten zuverlässig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Trends und klinisches Gesamtbild statt einer einzigen Tabelle nutzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Welche Bedeutung hat der venöse Rückstrom?\u003c/h3>\u003cp>Sinkendes venöses Angebot vermindert die kardiale Füllung und kann das Schlagvolumen reduzieren. Tachykardie kann dies nur begrenzt kompensieren. Mechanische Beatmung und hoher intrathorakaler Druck können die Situation zusätzlich beeinflussen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach Beatmungsänderung Kreislaufreaktionen beobachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Warum kann SpO₂ normal bleiben?\u003c/h3>\u003cp>Sie beschreibt die prozentuale Hämoglobinsättigung, nicht die absolute Menge verfügbaren Hämoglobins. Bei Blutverlust kann der Sauerstoffgehalt trotz hoher Sättigung sinken. Zusätzlich vermindert ein niedriges Herzzeitvolumen den Sauerstofftransport.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Normale SpO₂ ist kein Ausschluss einer kritischen Minderperfusion.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Warum ist Hb am Anfang manchmal wenig verändert?\u003c/h3>\u003cp>Bei Verlust von Vollblut fallen Volumen und Erythrozytenmasse zunächst gemeinsam. Die Konzentration verändert sich mit Flüssigkeitsverschiebungen und Zufuhr. Wiederholte Messungen und Blutungsdynamik sind deshalb aussagekräftiger als ein einzelner früher Hb-Wert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht auf einen Laborabfall warten, bevor eine starke Blutung eskaliert wird.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Welche klinischen Zeichen sind relevant?\u003c/h3>\u003cp>Blasse oder kalte Haut, verlängerte Rekapillarisierung, verändertes Bewusstsein, Tachykardie und geringe Urinproduktion können auf Minderperfusion hinweisen. Unter Anästhesie oder Betablockade sind Zeichen abgeschwächt. Kein Einzelbefund ist allein beweisend.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Mehrere Beobachtungen mit zeitlichem Verlauf zusammenführen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was ist der Schockindex?\u003c/h3>\u003cp>Herzfrequenz geteilt durch systolischen Blutdruck ergibt eine dimensionslose Kennzahl. Beispiel: 120/min geteilt durch 100 mmHg ergibt 1,2. Medikamente, Rhythmus und Ausgangsblutdruck begrenzen die Interpretation. Der Index ergänzt die Beurteilung, ersetzt sie nicht.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht aus einem einzelnen Index eine vollständige Therapieentscheidung ableiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Aussagekraft hat Laktat?\u003c/h3>\u003cp>Ein Anstieg kann eine gestörte Sauerstoffbereitstellung oder veränderte Stoffwechsellage anzeigen. Er ist nicht spezifisch für Blutung. Eine ausbleibende Verbesserung trotz Maßnahmen erfordert erneute Ursachenprüfung und kann auf fortgesetzte Minderperfusion hinweisen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Messzeiten und Reaktion auf Therapie dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was ist das wichtigste ursächliche Therapieziel?\u003c/h3>\u003cp>Die Blutungsquelle muss schnell kontrolliert werden. Chirurgische, interventionelle oder äußere Blutstillung sind situationsabhängig. Infusionen, Vasopressoren und Transfusionen überbrücken Folgen, beseitigen aber keine weiterhin offene Gefäßverletzung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Die Frage nach definitiver Blutstillung im Team wiederholt stellen.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Warum werden große Zugänge benötigt?\u003c/h3>\u003cp>Rasche, kontrollierte Volumen- und Produktgabe erfordert geeignete Zugänge mit ausreichendem Fluss. Katheterlänge, Innendurchmesser und angeschlossene Systeme beeinflussen die Leistung. Ein nominell vorhandener Zugang kann für die benötigte Rate ungeeignet sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zugangsdurchgängigkeit und geeignetes Transfusionssystem früh prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Was bedeutet permissive Hypotonie?\u003c/h3>\u003cp>In bestimmten traumatischen Blutungssituationen wird vor Blutstillung eine begrenzte Kreislaufstabilisierung angestrebt, statt sofort normale Werte zu erzwingen. Dies ist kein universelles OP-Ziel. Insbesondere Schädel-Hirn-Trauma und besondere Perfusionsbedürfnisse ändern das Vorgehen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Traumakonzept nicht ungeprüft auf andere Patientengruppen übertragen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Welche Rolle haben Vasopressoren?\u003c/h3>\u003cp>Sie können in ausgewählten Situationen die Perfusion unterstützen, ersetzen aber weder verlorenes Volumen noch Hämoglobin oder Blutstillung. Eine übermäßige Vasokonstriktion bei fortbestehendem Volumenmangel kann Organversorgung gefährden. Anwendung erfolgt in einem abgestimmten Gesamtkonzept.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Gleichzeitig laufende Blutungs- und Volumentherapie im Blick behalten.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Warum werden Temperatur, Calcium und pH gemeinsam betrachtet?\u003c/h3>\u003cp>Hypothermie, Hypocalcämie und Azidose verschlechtern Hämostase und Kreislauffunktion. Sie entstehen im Schock und können dessen Behandlung erschweren. Ihre Kontrolle ergänzt die ursächliche Therapie, statt sie zu ersetzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Diese Werte früh und wiederholt in der BGA beziehungsweise Kernmessung erfassen.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Wann wird ein Massivblutungsplan aktiviert?\u003c/h3>\u003cp>Die lokale Definition richtet sich nach Blutungsrate, Kreislaufzustand und erwartetem Transfusionsbedarf. Ein Plan wird vorausschauend aktiviert, nicht erst nach Erreichen einer retrospektiven Produktzahl. Er strukturiert Kommunikation, Diagnostik und Versorgung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blutbank und zusätzliche Teammitglieder rechtzeitig informieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Was unterscheidet Erythrozyten von Gerinnungstherapie?\u003c/h3>\u003cp>Erythrozyten unterstützen vor allem den Sauerstofftransport. Plasma, Plättchen und gezielte Faktoren adressieren andere Defizite. Ein verbesserter Hb löst eine Koagulopathie nicht automatisch. Umgekehrt ersetzt Gerinnungstherapie keine ausreichende Sauerstoffträgerkapazität.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Produktziel bei Bestellung und Übergabe benennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Warum ist Citrat relevant?\u003c/h3>\u003cp>Citrat in Blutprodukten bindet Calcium. Bei hoher Transfusionsrate und eingeschränkter Metabolisierung kann ionisiertes Calcium abfallen. Dies beeinträchtigt Herz-Kreislauf-Funktion und Gerinnung. Der Ersatz wird anhand geeigneter Messungen und ärztlicher Anordnung gesteuert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kein starres Ampullenschema ohne aktuelle Mess- und Konzentrationskontrolle verwenden.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Welche Bedeutung hat Tranexamsäure bei Trauma?\u003c/h3>\u003cp>Die europäische Traumaleitlinie beschreibt einen zeitabhängigen Nutzen bei blutenden beziehungsweise gefährdeten Traumapatienten. Indikation und Zeit seit Verletzung sind wichtig. Daraus folgt keine identische Therapieempfehlung für jede andere Ursache von Blutverlust.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Verletzungszeit und bereits erfolgte Gabe zuverlässig erfragen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Welche Fehler entstehen bei ungenauer Blutverlustschätzung?\u003c/h3>\u003cp>Spülvolumen kann als Blut mitgezählt, Blut in Tüchern unterschätzt und verdeckte Blutung übersehen werden. Die Kombination aus Bilanz, OP-Befund und Physiologie ist deshalb notwendig. Eine scheinbar exakte Literzahl kann falsche Sicherheit vermitteln.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blutungsrate und Unsicherheit der Schätzung ausdrücklich nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was muss nach initialer Stabilisierung weiter überwacht werden?\u003c/h3>\u003cp>Wiederblutung, Organperfusion, Hämostase, Temperatur und Stoffwechsel können sich erneut verschlechtern. Ein vorübergehend normaler Blutdruck beweist keine abgeschlossene Behandlung. Ausstehende Laborwerte und definitive Blutungskontrolle müssen geklärt sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den Verlauf nach letzter Intervention nicht aus der Überwachung verlieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale pflegerische Lernbrücke?\u003c/h3>\u003cp>Schock ist ein Perfusionsproblem, dessen Ursache rasch behandelt werden muss. Frühes Erkennen, funktionierende Zugänge, sichere Produktlogistik, Wärmeerhalt und klare Übergabe sind zentrale Aufgaben. Einzelwerte dürfen das Gesamtbild nicht überdecken.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Blutung stoppen und Sauerstofftransport wiederherstellen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-trauma\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/\" target=\"_blank\" rel=\"noopener noreferrer\">The European guideline on management of major bleeding and coagulopathy following trauma: sixth edition\u003c/a>\u003cp>Rossaint et al.; Critical Care 2023;27:80 · 2023-03-01\u003c/p>\u003cp class=\"muted\">Originalleitlinie frei zugänglich; relevante Abschnitte zu Blutung, Monitoring und Milieu geprüft. Geltungsbereich Trauma, keine pauschale Übertragung auf alle OP-Blutungen.\u003c/p>\u003c/li>\u003cli id=\"source-bleeding\">\u003ca href=\"https://esaic.org/guideline/severe-perioperative-bleeding-management-guideline-2nd-update/\" target=\"_blank\" rel=\"noopener noreferrer\">Management of severe peri-operative bleeding – Second update 2022\u003c/a>\u003cp>ESAIC; European Journal of Anaesthesiology 2023;40:226–304 · 2023\u003c/p>\u003cp class=\"muted\">Offizielle Übersicht und zugängliche Empfehlungen geprüft; kein vollständiger systematischer Volltext-Review behauptet.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/08-color.png","readingMinutes":9},{"id":"09","title":"Hyperkaliämie","category":"Elektrolyte","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Eine mögliche Probenstörung muss überprüft werden, darf aber bei gefährlichem klinischem Muster die Notfallbehandlung nicht verzögern.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Erhöhtes extrazelluläres Kalium verändert die elektrische Erregbarkeit des Herzens. Ursachen sind unter anderem reduzierte renale Ausscheidung, Zellzerfall oder Verschiebungen zwischen Zellen und Blut. Eine hämolytische Probe kann einen falsch hohen Wert erzeugen.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Kaliumwert, Verlauf, Nierenfunktion, Säure-Basen-Status und EKG zusammen betrachten. Ein normales EKG schließt eine gefährliche Hyperkaliämie nicht aus. Eine Kontrollprobe darf die Behandlung eines instabilen Patienten nicht verzögern.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Bei bedrohlicher Situation sofort ärztlich eskalieren und kontinuierlich überwachen. Intravenöses Kalzium dient bei entsprechender Indikation der kardialen Stabilisierung, senkt aber Kalium nicht. Insulin mit Glukose verschiebt Kalium in Zellen; eine Entfernung gelingt etwa durch Dialyse.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Präparat, Konzentration und Einheiten gegenprüfen. Nach Insulin sind wiederholte Glukosekontrollen wesentlich, weil Hypoglykämien auch verzögert auftreten. Kalium muss nachkontrolliert werden, da die Wirkung der Verschiebungstherapie nachlassen kann.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>UKKA: schwere Hyperkaliämie ab 6,5 mmol/l; Kontext beachten.\u003c/li>\u003cli>Calcium schützt, Insulin verschiebt, Elimination entfernt Kalium.\u003c/li>\u003cli>Nach Insulin/Glukose auch verzögerte Hypoglykämie überwachen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Bei eingeschränkter Nierenfunktion werden erhöhtes Kalium und ein verbreiterter QRS-Komplex gemessen. Eine hämolytische Probe ist zusätzlich möglich.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Eine mögliche Probenstörung muss überprüft werden, darf aber bei gefährlichem klinischem Muster die Notfallbehandlung nicht verzögern.\u003c/p>\u003cp>Die Kaliumkonzentration im Blut ist erhöht. Referenzbereiche unterscheiden sich leicht zwischen Laboren. Die UK Kidney Association ordnet 5,5–5,9 mmol/l als mild, 6,0–6,4 als moderat und mindestens 6,5 als schwer ein. Klinischer Zustand und Anstiegsgeschwindigkeit sind zusätzlich wichtig.\u003c/p>\u003cp>Kaliumverlauf, EKG, Nierenfunktion, vermutete Ursache, erhaltene Maßnahmen und exakte Zeitpunkte nennen. Besonders wichtig sind ausstehende Kalium- und Blutzuckerkontrollen. Eine bessere EKG-Kurve beweist keine dauerhafte Entfernung des überschüssigen Kaliums.\u003c/p>\u003cp>Calcium schützt, Insulin verschiebt, Elimination entfernt. Jede dieser Maßnahmen beantwortet eine andere Frage. Wirksamkeitskontrolle und Hypoglykämieprävention gehören von Beginn an zur Behandlung, nicht erst zur Nachsorge.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was bedeutet Hyperkaliämie?\u003c/h3>\u003cp>Die Kaliumkonzentration im Blut ist erhöht. Referenzbereiche unterscheiden sich leicht zwischen Laboren. Die UK Kidney Association ordnet 5,5–5,9 mmol/l als mild, 6,0–6,4 als moderat und mindestens 6,5 als schwer ein. Klinischer Zustand und Anstiegsgeschwindigkeit sind zusätzlich wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Laborgrenze, Verlauf und EKG gemeinsam beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Warum ist extrazelluläres Kalium für das Herz wichtig?\u003c/h3>\u003cp>Der Konzentrationsgradient über der Zellmembran beeinflusst das Ruhemembranpotenzial. Ausgeprägte Veränderungen können Erregungsbildung und -leitung stören. Schwere Hyperkaliämie kann zu gefährlichen Bradykardien, breiten Komplexen und Kreislaufstillstand führen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei relevantem Verdacht kontinuierliches Rhythmusmonitoring sichern.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Welche drei Mechanismen erhöhen Kalium?\u003c/h3>\u003cp>Verminderte Ausscheidung, Verschiebung aus den Zellen und erhöhte Zufuhr können zusammenwirken. Niereninsuffizienz, Azidose, Zellschädigung und Medikamente sind wichtige Kontexte. Eine Ursache schließt zusätzliche Beiträge nicht aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nierenfunktion, Medikamente, BGA und zeitlichen Verlauf prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was ist Pseudohyperkaliämie?\u003c/h3>\u003cp>Bei der Probenentnahme oder Verarbeitung kann Kalium aus Blutzellen freigesetzt werden, etwa bei Hämolyse. Das Messergebnis bildet dann die Situation im Körper nicht korrekt ab. Eine Kontrollprobe ist sinnvoll, darf aber Behandlung bei bedrohlichem klinischem Verdacht nicht verzögern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Hämolysehinweis, Abnahmetechnik und Dringlichkeit gleichzeitig bewerten.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Welche EKG-Veränderungen können auftreten?\u003c/h3>\u003cp>Spitze T-Wellen, Veränderungen der P-Welle, QRS-Verbreiterung und verschiedene Rhythmusstörungen si
