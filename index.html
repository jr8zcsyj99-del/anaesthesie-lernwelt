nd möglich. Die Abfolge ist nicht zuverlässig vorhersehbar. Ein unauffälliges EKG schließt eine gefährliche Hyperkaliämie nicht sicher aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Therapiedringlichkeit nicht allein aus einer klassischen EKG-Reihenfolge ableiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Wann empfiehlt UKKA ein Zwölfkanal-EKG?\u003c/h3>\u003cp>Ab einer Kaliumkonzentration von 6,0 mmol/l empfiehlt die Leitlinie eine dringliche EKG-Beurteilung; weitere Überwachung hängt von Schweregrad und klinischer Lage ab. Bei Instabilität erfolgt sofortiges Notfallmanagement unabhängig vom Abwarten eines formalen Ausdrucks.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ableitung und kontinuierliche Überwachung früh organisieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Welche drei Therapieziele werden unterschieden?\u003c/h3>\u003cp>Das Herz schützen, Kalium vorübergehend in Zellen verschieben und Kalium aus dem Körper entfernen. Diese Ziele sind nicht austauschbar. Gleichzeitig werden Auslöser gestoppt und erneute Anstiege beziehungsweise Hypoglykämien überwacht.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei jeder Maßnahme fragen, welches Ziel sie tatsächlich erfüllt.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Was bewirkt intravenöses Calcium?\u003c/h3>\u003cp>Es stabilisiert die kardiale Erregbarkeit bei passenden Indikationen, senkt aber die Kaliumkonzentration nicht. Die UKKA-Leitlinie richtet die Anwendung unter anderem nach EKG-Zeichen und klinischer Lage aus. Calciumgabe ersetzt deshalb keine kaliumsenkende Therapie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach Schutz des Herzens müssen die übrigen Therapieziele weiterverfolgt werden.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Warum sind Calciumchlorid und Calciumgluconat nicht volumenidentisch austauschbar?\u003c/h3>\u003cp>Sie enthalten bei gleicher Prozentangabe nicht dieselbe Menge elementaren Calciums. Zusätzlich unterscheiden sich Gewebeverträglichkeit und Anwendungskontext. Eine Ampulle des einen Präparats entspricht deshalb nicht automatisch einer Ampulle des anderen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wirkstoff, Konzentration, mmol und Zugangsweg nach SOP kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Wie verschiebt Insulin Kalium?\u003c/h3>\u003cp>Insulin fördert die Aufnahme von Kalium in Zellen, unter anderem über die Natrium-Kalium-ATPase. Der Effekt entfernt Kalium nicht aus dem Körper. Sinkt die Wirkung ab und bleibt die Ursache bestehen, kann der Wert erneut steigen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wiederholte Kaliumkontrollen und Eliminationsstrategie einplanen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Welches Insulin-Glukose-Schema nennt UKKA für schwere Hyperkaliämie bei Erwachsenen?\u003c/h3>\u003cp>Die Leitlinie nennt 10 Einheiten lösliches Insulin mit 25 g Glukose intravenös. Die konkrete Zubereitung und Durchführung folgen lokaler SOP und ärztlicher Anordnung. Insulin ist ein Hochrisikomedikament; besonders bei Nierenfunktionsstörung besteht Hypoglykämiegefahr.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Dosis in Einheiten und Glukosemenge in Gramm unabhängig kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Welche Blutzuckerkontrollen nennt UKKA?\u003c/h3>\u003cp>Nach Insulin/Glukose werden Messungen zu Beginn sowie nach 30, 60, 90, 120, 180, 240, 300 und 360 Minuten empfohlen. Zusätzliche Kontrollen richten sich nach Situation und lokaler Vorgabe. Eine erste normale Kontrolle beendet die Überwachung nicht.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den gesamten Überwachungszeitraum in der Übergabe sichern.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Warum kann die Hypoglykämie verzögert auftreten?\u003c/h3>\u003cp>Die Insulinwirkung kann länger anhalten als die ausreichende Glukoseverfügbarkeit. Verminderte Insulinclearance, niedriger Ausgangsblutzucker und fehlende Zufuhr erhöhen das Risiko. Klinische Symptome können unter Anästhesie oder Sedierung verborgen bleiben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht auf sichtbare Hypoglykämiesymptome warten.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Welche Rolle hat Salbutamol?\u003c/h3>\u003cp>Ein Beta₂-Agonist kann Kalium zusätzlich in Zellen verschieben. Wirkung und Verträglichkeit sind variabel; Tachykardie und kardiale Nebenwirkungen sind relevant. UKKA rät bei schwerer Hyperkaliämie von einer alleinigen Salbutamoltherapie ab.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Als mögliche Ergänzung, nicht als Ersatz der Gesamtbehandlung einordnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Warum wird Bicarbonat nicht routinemäßig gegeben?\u003c/h3>\u003cp>Die Wirkung auf Kalium ist situationsabhängig. Natrium- und Volumenlast sowie der Säure-Basen-Kontext müssen berücksichtigt werden. UKKA empfiehlt keine routinemäßige intravenöse Bicarbonatgabe als allgemeine Akuttherapie. Eine besondere Indikation wird individuell beurteilt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht jede Hyperkaliämie automatisch als Pufferindikation behandeln.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Wie wird Kalium aus dem Körper entfernt?\u003c/h3>\u003cp>Je nach Situation kommen renale Ausscheidung, geeignete Kaliumbinder und Dialyseverfahren infrage. Bei schwerer oder refraktärer Hyperkaliämie und eingeschränkter Nierenfunktion ist früh nephrologische beziehungsweise intensivmedizinische Expertise nötig. Verschiebungstherapie allein ist zeitlich begrenzt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Definitive Eliminationsmöglichkeit früh klären.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Warum muss die Medikamentenliste überprüft werden?\u003c/h3>\u003cp>Kaliumsparende Medikamente, Hemmung des Renin-Angiotensin-Aldosteron-Systems und andere Substanzen können Kalium erhöhen oder die Ausscheidung vermindern. Zusätzlich kann unbeabsichtigte Kaliumzufuhr aus Infusionen relevant sein. Absetzen und weitere Verordnung werden ärztlich entschieden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wirkstoffnamen und bereits verabreichte Mengen vollständig nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was zeigt das Rechenbeispiel mit Glukose?\u003c/h3>\u003cp>Eine 20-%-Glukoselösung enthält 20 g in 100 ml. Für 25 g werden rechnerisch 125 ml benötigt. Dies ist eine Mengenrechnung, keine Freigabe dieser Konzentration für jeden Zugang. Lokale Zubereitung, Osmolarität und sichere Gabe bleiben erforderlich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Prozentangabe in g pro 100 ml übersetzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was gehört in die Notfallübergabe?\u003c/h3>\u003cp>Kaliumverlauf, EKG, Nierenfunktion, vermutete Ursache, erhaltene Maßnahmen und exakte Zeitpunkte nennen. Besonders wichtig sind ausstehende Kalium- und Blutzuckerkontrollen. Eine bessere EKG-Kurve beweist keine dauerhafte Entfernung des überschüssigen Kaliums.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitplan für Nachkontrollen ausdrücklich an die übernehmende Person übergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Calcium schützt, Insulin verschiebt, Elimination entfernt. Jede dieser Maßnahmen beantwortet eine andere Frage. Wirksamkeitskontrolle und Hypoglykämieprävention gehören von Beginn an zur Behandlung, nicht erst zur Nachsorge.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Schützen, verschieben, entfernen und kontrollieren.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-ukka\">\u003ca href=\"https://www.ukkidney.org/sites/renal.org/files/FINAL%20VERSION%20-%20UKKA%20CLINICAL%20PRACTICE%20GUIDELINE%20-%20MANAGEMENT%20OF%20HYPERKALAEMIA%20IN%20ADULTS%20-%20191223_0.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Management of Hyperkalaemia in Adults – Clinical Practice Guideline\u003c/a>\u003cp>UK Kidney Association · 2023-10; finale PDF Dezember 2023\u003c/p>\u003cp class=\"muted\">Offizielle Leitlinie und Akutalgorithmus zugänglich; Insulin/Glukose, Schwellen und Kontrollen geprüft.\u003c/p>\u003c/li>\u003cli id=\"source-ukka-summary\">\u003ca href=\"https://guidelines.ukkidney.org/hyperkalaemia/6-summary-of-clinical-practice-guideline-for-hyperkalaemia/6-2-section-ii-hospital/\" target=\"_blank\" rel=\"noopener noreferrer\">Hyperkalaemia – Section II: Hospital\u003c/a>\u003cp>UK Kidney Association · 2023-Leitlinie\u003c/p>\u003cp class=\"muted\">Offizielle Empfehlungstexte über Suchabruf lesbar; Direktabruf zeitweise Timeout. Keine Vollzugänglichkeit vorgetäuscht.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/09-color.png","readingMinutes":9},{"id":"10","title":"Perioperative Hypothermie","category":"Temperatur","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Wärmeumverteilung und äußerer Wärmeverlust sind unterschiedliche Prozesse. Eine Decke allein verhindert nicht jede Umverteilung nach Einleitung.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Allgemein- und Regionalanästhesie verändern die Thermoregulation. Wärme wird aus dem Körperkern umverteilt; exponierte Haut, kalte Umgebung und Flüssigkeiten begünstigen weitere Verluste. Eine passive Decke begrenzt Verlust, führt aber nicht dieselbe Wärme zu wie aktive Wärmung.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>NICE definiert perioperative Hypothermie bei Erwachsenen als Kerntemperatur unter 36 °C. Der Messort beeinflusst die Aussagekraft. Periphere Messwerte sind nicht ohne Weiteres mit der Kerntemperatur gleichzusetzen.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Wärmerisiko und Temperatur präoperativ erheben, aktive Vorwärmung und fortgesetzte intraoperative Wärmung nach lokalem Konzept einsetzen. Notwendige Notfallversorgung darf durch Wärmemaßnahmen nicht verzögert werden.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Wärmesystem sicher anwenden und Herstellerhinweise beachten. Temperatur und Messort dokumentieren. Bei großen Infusions- oder Transfusionsmengen die vorgesehene Flüssigkeitswärmung vorbereiten. Bei Übergabe aktuellen Wert und weitere Maßnahmen nennen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>NICE: perioperative Hypothermie bei Erwachsenen unter 36,0 °C Kerntemperatur.\u003c/li>\u003cli>Wärmeumverteilung nach Einleitung beginnt früh.\u003c/li>\u003cli>Vorwärmen, geeignet messen und Wärmesysteme sicher anwenden.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Nach Einleitung fällt die gemessene Kerntemperatur trotz Abdeckung. Die Extremitäten waren präoperativ kühl.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Wärmeumverteilung und äußerer Wärmeverlust sind unterschiedliche Prozesse. Eine Decke allein verhindert nicht jede Umverteilung nach Einleitung.\u003c/p>\u003cp>Im Kontext der Leitlinie für erwachsene chirurgische Patienten gilt eine Körperkerntemperatur unter 36,0 °C als Hypothermie. Das ist keine universelle Definition jeder Temperaturstörung und kein Zielwert für therapeutische Hypothermie.\u003c/p>\u003cp>Messposition, Gerät und Plausibilität kontrollieren, gegebenenfalls mit geeigneter Methode bestätigen. Ein technischer Fehler darf nicht ignoriert werden; umgekehrt wird eine bedrohliche klinische Situation nicht erst nach langer Geräteprüfung behandelt.\u003c/p>\u003cp>Wärmeerhalt beginnt vor der Einleitung und wird durch Messung gesteuert. Frühzeitige Prävention ist meist einfacher als das spätere Aufwärmen. Temperatur ist ein physiologischer Sicherheitsparameter und kein bloßer Komfortwert.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Wie definiert NICE perioperative Hypothermie?\u003c/h3>\u003cp>Im Kontext der Leitlinie für erwachsene chirurgische Patienten gilt eine Körperkerntemperatur unter 36,0 °C als Hypothermie. Das ist keine universelle Definition jeder Temperaturstörung und kein Zielwert für therapeutische Hypothermie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Messort und Patientengruppe zusammen mit der Zahl dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Warum fällt die Temperatur nach Narkoseeinleitung oft rasch?\u003c/h3>\u003cp>Anästhetika verändern Gefäßtonus und Thermoregulation. Wärme verlagert sich vom Körperkern in kühlere periphere Gewebe. Diese Umverteilung kann auch ohne großen äußeren Wärmeverlust zunächst die Kerntemperatur senken.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Präoperative Wärmung wirkt vor dem Einleitungsabfall.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Was unterscheidet Wärmeumverteilung von Netto-Wärmeverlust?\u003c/h3>\u003cp>Bei Umverteilung ändert sich vor allem die Verteilung vorhandener Wärme zwischen Kompartimenten. Bei Nettoverlust gibt der Körper mehr Wärme ab, als er produziert. Beide Prozesse können nacheinander oder gleichzeitig auftreten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ein Temperaturabfall ist nicht allein durch einen kalten OP zu erklären.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Welche Wege führen zu Wärmeverlust?\u003c/h3>\u003cp>Strahlung, Konvektion, Verdunstung und Wärmeleitung können beitragen. Offene Körperflächen, feuchte Tücher, kalte Flüssigkeiten und lange Eingriffe verstärken je nach Situation den Verlust. Das relative Gewicht der Mechanismen variiert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Exponierte Flächen begrenzen und feuchte Abdeckungen beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Warum hilft Prewarming?\u003c/h3>\u003cp>Aktive präoperative Wärmung erhöht den Wärmeinhalt der Peripherie und verringert den Temperaturgradienten zum Kern. Dadurch kann die nach Einleitung auftretende Umverteilung reduziert werden. Wärmung muss rechtzeitig und sicher erfolgen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht erst nach deutlicher Hypothermie mit Wärmeerhalt beginnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Welche Dauer nennt NICE bei geeigneten Erwachsenen?\u003c/h3>\u003cp>Bei einer Temperatur von mindestens 36,0 °C empfiehlt NICE vor Einleitung mindestens 30 Minuten aktive Wärmung, sofern dadurch keine Notfalloperation verzögert wird. Die konkrete Technik und Kontraindikationen werden berücksichtigt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitplanung und Dringlichkeit zusammen abstimmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Wann ist ein elektiver Beginn bei niedriger Temperatur kritisch?\u003c/h3>\u003cp>NICE empfiehlt bei unter 36,0 °C eine aktive Wärmung vor Einleitung, sofern die Dringlichkeit keine sofortige Operation verlangt. Dies ist eine Nutzen-Risiko-Abwägung, kein pauschaler Aufschub lebensrettender Eingriffe.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Temperaturbefund vor Einleitung aktiv mitteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Messung ist sinnvoll?\u003c/h3>\u003cp>Eine geeignete Messmethode soll die Körperkerntemperatur ausreichend zuverlässig abbilden. Hauttemperatur allein ist dafür häufig ungeeignet. Messort, Gerät, Perfusionszustand und Anwendung beeinflussen den Wert; Wechsel der Methode können scheinbare Sprünge erzeugen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Messmethode bei der Übergabe nennen und korrekt positionieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Warum genügt das subjektive Wärmegefühl nicht?\u003c/h3>\u003cp>Anästhesie, Sedierung und Erkrankung verändern Wahrnehmung und Kommunikation. Ein Patient kann keine Kälte äußern und dennoch hypotherm sein. Objektive Temperaturmessung ist deshalb besonders bei längeren oder risikoreichen Eingriffen wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Komfortbeurteilung und Kernmessung ergänzen sich.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Wie verändert Hypothermie die Gerinnung?\u003c/h3>\u003cp>Plättchenfunktion und enzymatische Gerinnungsprozesse können beeinträchtigt werden. Dies kann Blutungsprobleme verstärken. Routinegerinnungswerte unter standardisierten Laborbedingungen bilden den Temperatureffekt nicht vollständig ab.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Blutung Temperatur als behandelbaren Faktor prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Warum kann die Medikamentenwirkung länger anhalten?\u003c/h3>\u003cp>Temperatur beeinflusst Stoffwechsel, Organfunktion und neuromuskuläre Prozesse. Bei Hypothermie können Anästhetika- und Relaxanswirkungen verändert oder verlängert sein. Das Ausmaß hängt von Substanz und Patientensituation ab.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Verzögertes Erwachen nicht nur als zu hohe letzte Dosis erklären.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Was ist postoperatives Shivering?\u003c/h3>\u003cp>Unwillkürliche Muskelaktivität erzeugt Wärme und erhöht Stoffwechsel- sowie Sauerstoffbedarf. Es kann stark belasten und Messungen stören. Nicht jedes Zittern hat allein Hypothermie als Ursache; Temperatur und klinische Situation müssen beurteilt werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Oxygenierung, Wärmebedarf und Differenzialdiagnosen zusammen betrachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Warum sind vulnerable Patienten besonders betroffen?\u003c/h3>\u003cp>Geringe Reserven, hohes Alter, lange Eingriffe und größere Wärmeverluste können das Risiko erhöhen. Die individuelle Kombination ist wichtiger als ein einzelnes Merkmal. Auch kurze Eingriffe können bei entsprechendem Risiko relevante Abkühlung verursachen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Risikobeurteilung bereits vor Verlegung in den OP durchführen.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Welche Rolle spielen gewärmte Infusionen?\u003c/h3>\u003cp>Sie vermindern zusätzliche Abkühlung durch größere Mengen kalter Flüssigkeit. Sie ersetzen nicht zwangsläufig eine aktive Oberflächenwärmung. Geräte müssen für Infusion oder Blutprodukt zugelassen und korrekt betrieben werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Geeigneten Wärmer nach Herstelleranleitung vorbereiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Was ist bei Warmluftsystemen wichtig?\u003c/h3>\u003cp>Wärmedecke, Gerät, Anschluss und Temperatursteuerung müssen bestimmungsgemäß verwendet werden. Eine direkte heiße Luftzufuhr ohne passende Decke kann Verletzungen verursachen. Hautzustand, Lagerung und Druckstellen werden weiter kontrolliert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keine improvisierte Anwendung des Wärmeschlauchs.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Kann auch Überwärmung schaden?\u003c/h3>\u003cp>Ja. Ziel ist eine angemessene Temperatur, nicht maximale Wärmezufuhr ohne Kontrolle. Unpassende Einstellungen oder Kontakt mit heißen Flächen können Hautschäden verursachen. Bei Temperaturanstieg müssen Wärmung und mögliche andere Ursachen neu bewertet werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Temperaturverlauf an die Wärmestrategie rückkoppeln.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Wie häufig empfiehlt NICE intraoperative Kontrollen?\u003c/h3>\u003cp>Die Leitlinie empfiehlt eine dokumentierte Temperaturmessung vor Einleitung und anschließend mindestens alle 30 Minuten bis zum Operationsende. In kritischen Situationen kann kontinuierliche oder häufigere Kontrolle erforderlich sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Messintervalle nicht mit einer Garantie stabiler Temperatur verwechseln.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was muss im Aufwachraum erfolgen?\u003c/h3>\u003cp>Temperatur messen, Komfort und Atem-Kreislauf-Situation beurteilen und notwendige Wärmung fortsetzen. Hypothermie, Shivering und verzögerte Erholung können miteinander verbunden sein. Vor Weiterverlegung muss ein geeigneter stabiler Zustand erreicht sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Letzte Temperatur, Messort und Wärmemaßnahmen übergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Wie wird eine unerwartete Temperaturmessung geprüft?\u003c/h3>\u003cp>Messposition, Gerät und Plausibilität kontrollieren, gegebenenfalls mit geeigneter Methode bestätigen. Ein technischer Fehler darf nicht ignoriert werden; umgekehrt wird eine bedrohliche klinische Situation nicht erst nach langer Geräteprüfung behandelt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wert und klinischen Zustand parallel verifizieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Wärmeerhalt beginnt vor der Einleitung und wird durch Messung gesteuert. Frühzeitige Prävention ist meist einfacher als das spätere Aufwärmen. Temperatur ist ein physiologischer Sicherheitsparameter und kein bloßer Komfortwert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Vorwärmen, messen, Wärme sicher erhalten.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-nice-temperature\">\u003ca href=\"https://www.nice.org.uk/guidance/cg65/resources/hypothermia-prevention-and-management-in-adults-having-surgery-975569636293\" target=\"_blank\" rel=\"noopener noreferrer\">Hypothermia: prevention and management in adults having surgery – CG65\u003c/a>\u003cp>NICE · 2008; Änderungen 2016; abgerufene PDF-Fassung 2025\u003c/p>\u003cp class=\"muted\">Offizielle PDF frei lesbar; Definition, Vorwärmung und Messintervalle geprüft.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/10-color.png","readingMinutes":8},{"id":"11","title":"Maligne Hyperthermie · Agilus","category":"Notfälle","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Ein hypermetaboles Muster ist wichtiger als das Warten auf hohes Fieber. Präparatspezifische Konzentration und Endvolumen müssen bei Dantrolenberechnungen stimmen.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Bei entsprechender Veranlagung können volatile Anästhetika und Succinylcholin einen überschießenden Muskelstoffwechsel auslösen. Unkontrollierte Kalziumfreisetzung steigert den Energie- und Sauerstoffverbrauch sowie die CO₂-Produktion. Dantrolen wirkt an der gestörten Kalziumfreisetzung.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Unangemessen steigendes etCO₂ trotz ausreichender Ventilation, Tachykardie, Muskelrigidität und Azidose sind Warnzeichen. Ein schneller Temperaturanstieg kann später auftreten. Auf hohes Fieber zu warten, verzögert die Behandlung.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Hilfe rufen, Trigger beenden und mit 100 % Sauerstoff bei erhöhtem Minutenvolumen ventilieren. Triggerfreie Anästhesie organisieren und Dantrolen unverzüglich nach MH-Algorithmus geben lassen. Verfügbare Aktivkohlefilter können eingesetzt werden; der Gerätewechsel darf die Behandlung nicht verzögern.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>MH-Notfallset, Dantrolen und ausreichend Personal bereitstellen. Agilus besitzt eine andere Stärke und Zubereitung als ältere Dantrolenpräparate. Rekonstitution ausschließlich anhand der aktuellen Fachinformation des tatsächlich verwendeten Präparats. Temperatur, Blutgase, Kalium, CK und weitere Verlaufskontrollen koordinieren.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Unerklärlicher CO₂-Anstieg und Rigidität können vor Fieber auftreten.\u003c/li>\u003cli>Trigger stoppen, Hilfe rufen, Dantrolen nach Fachinformation bereitstellen.\u003c/li>\u003cli>Agilus: 20 ml Wasser zur Rekonstitution; Endkonzentration 5,3 mg/ml.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Unter volatiler Anästhesie steigt etCO₂ trotz erhöhter Ventilation; Tachykardie und Muskelrigidität kommen hinzu.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Ein hypermetaboles Muster ist wichtiger als das Warten auf hohes Fieber. Präparatspezifische Konzentration und Endvolumen müssen bei Dantrolenberechnungen stimmen.\u003c/p>\u003cp>Bei empfänglichen Menschen können bestimmte Anästhesietrigger eine unkontrollierte Calciumfreisetzung im Skelettmuskel auslösen. Der Muskelstoffwechsel steigt massiv an. CO₂-Produktion, Sauerstoffverbrauch, Azidose und Wärmebildung können sich lebensbedrohlich entwickeln.\u003c/p>\u003cp>Ein begründeter MH-Verdacht muss dokumentiert und an ein spezialisiertes Zentrum zur weiteren Bewertung vermittelt werden. Patient und Familie benötigen geeignete Informationen. Ein Verdacht wird nicht durch einen einzigen später normalen Laborwert ausgeschlossen.\u003c/p>\u003cp>Die Krise beginnt als Muskelstoffwechselentgleisung; Temperatur ist nur ein Teil des Bilds. Triggerstopp, frühes Dantrolen und Behandlung der Folgen müssen parallel erfolgen. Präparatspezifische Zubereitung verhindert vermeidbare Dosisfehler.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was ist maligne Hyperthermie?\u003c/h3>\u003cp>Bei empfänglichen Menschen können bestimmte Anästhesietrigger eine unkontrollierte Calciumfreisetzung im Skelettmuskel auslösen. Der Muskelstoffwechsel steigt massiv an. CO₂-Produktion, Sauerstoffverbrauch, Azidose und Wärmebildung können sich lebensbedrohlich entwickeln.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht erst auf hohes Fieber warten.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Welche Trigger nennt die EMHG?\u003c/h3>\u003cp>Volatile Anästhetika und Succinylcholin sind wesentliche Trigger. Eine frühere komplikationslose Narkose schließt eine Empfänglichkeit nicht sicher aus. Die Beurteilung familiärer oder persönlicher Hinweise erfolgt strukturiert und gegebenenfalls mit einem MH-Zentrum.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Verdachtsanamnese vor Einleitung ausdrücklich weitergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Welche frühen Zeichen sind wichtig?\u003c/h3>\u003cp>Unerklärlich steigendes etCO₂ trotz ausreichender Ventilation, Tachykardie und Muskelrigidität können früh auftreten. Zeichen sind nicht spezifisch und müssen im Muster beurteilt werden. Ein schneller Temperaturanstieg kann später hinzukommen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Trend und Reaktion auf Beatmung beobachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Warum steigt CO₂ an?\u003c/h3>\u003cp>Der hypermetabole Muskelstoffwechsel produziert mehr CO₂. Dieses wird zur Lunge transportiert und muss abgeatmet werden. Ein unangemessener Anstieg trotz gesteigerter Ventilation ist verdächtig. Andere Ursachen wie Hypoventilation oder laparoskopische Gasaufnahme bleiben differenzialdiagnostisch wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ventilations- und Stoffwechselproblem voneinander unterscheiden.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Warum ist die Körpertemperatur kein frühes Ausschlusskriterium?\u003c/h3>\u003cp>Die Stoffwechselkrise kann beginnen, bevor eine deutliche Hyperthermie messbar ist. Ein normaler Temperaturwert zu Beginn schließt MH deshalb nicht aus. Die Behandlung eines begründeten Verdachts soll nicht bis zum Fieberanstieg verzögert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kernmessung vorbereiten, aber auf den Gesamtverdacht reagieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Welche Differenzialdiagnosen nennt die EMHG?\u003c/h3>\u003cp>Unzureichende Anästhesie, Infektion, Hypoventilation, Geräteprobleme, Anaphylaxie und weitere Stoffwechselkrisen können ähnliche Zeichen erzeugen. Die Prüfung erfolgt parallel. Bei passendem gefährlichem Muster wird die MH-Therapie nicht durch eine langwierige Ausschlussdiagnostik verzögert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den Verdacht und die konkurrierenden Ursachen klar im Team kommunizieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was sind die unmittelbaren ersten Schritte?\u003c/h3>\u003cp>Trigger stoppen, Notfall ausrufen, Hilfe holen und auf triggerfreie Anästhesie umstellen. Die EMHG empfiehlt 100 % Sauerstoff und deutlich erhöhte Ventilation. Die Chirurgie wird informiert und das weitere operative Vorgehen abgestimmt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Aufgaben für Dantrolen, Beatmung, Zugänge und Dokumentation verteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Muss zuerst das gesamte Narkosegerät gewechselt werden?\u003c/h3>\u003cp>Nein. Die EMHG warnt vor Zeitverlust durch einen Geräte- oder Kreissystemwechsel während der akuten Behandlung. Vapor entfernen beziehungsweise Triggerzufuhr sicher beenden; Aktivkohlefilter verwenden, wenn verfügbar und passend. Dantrolen und Stabilisierung haben Priorität.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Triggerfreiheit nach lokalem Notfallplan herstellen, nicht improvisiert verzögern.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Wie wirkt Dantrolen?\u003c/h3>\u003cp>Es vermindert die pathologisch gesteigerte Calciumfreisetzung aus dem sarkoplasmatischen Retikulum des Skelettmuskels. Es behandelt damit einen zentralen Mechanismus der Krise. Parallel sind Oxygenierung, Kreislauf und metabolische Folgen zu behandeln.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine bessere Temperatur ersetzt die Kontrolle der gesamten Stoffwechsellage nicht.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Welche Anfangsdosis nennt die Agilus-Fachinformation?\u003c/h3>\u003cp>Sie nennt für Erwachsene und Kinder 2,5 mg/kg Körpergewicht als zügigen intravenösen Bolus. Die EMHG formuliert 2–2,5 mg/kg und begrenzt die einzelne Dosis auf 300 mg. Die konkrete Anwendung folgt dem präparatspezifischen und lokalen Notfallplan.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Unterschiedliche Quellenformulierungen nicht zu einem neuen eigenen Schema vermischen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Wann werden Dantrolengaben wiederholt?\u003c/h3>\u003cp>Die Agilus-Fachinformation nennt wiederholte 2,5-mg/kg-Boli im Abstand von zehn Minuten bei fortbestehenden Leitsymptomen. Klinischer Verlauf und Stoffwechselparameter steuern die Behandlung. Bei kumulativen Mengen um oder über 10 mg/kg soll die Verdachtsdiagnose erneut geprüft werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Dosis, Gewicht, Uhrzeit und Gesamtsumme fortlaufend dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Wie wird Agilus rekonstituiert?\u003c/h3>\u003cp>Die EMA-Fachinformation nennt 20 ml Wasser für Injektionszwecke je 120-mg-Durchstechflasche. Nach Rekonstitution beträgt die angegebene Konzentration 5,3 mg/ml. Andere Dantrolenpräparate haben andere Zubereitungen; deren Anleitung ist nicht austauschbar.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Präparat und Konzentration vor Berechnung eindeutig abgleichen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Warum ergibt 120 mg geteilt durch 20 ml nicht die richtige Endkonzentration?\u003c/h3>\u003cp>Die Produktinformation nennt wegen des endgültigen Lösungsvolumens nach Rekonstitution 5,3 mg/ml. Das reine Volumen des zugesetzten Wassers ist nicht automatisch das Endvolumen. Eine scheinbar einfache Division durch 20 kann deshalb zu einem falschen Applikationsvolumen führen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Mit der Fachinformationskonzentration rechnen, nicht mit einer eigenen Annahme.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Wie lautet ein überprüfbares Rechenbeispiel?\u003c/h3>\u003cp>Für einen fiktiven Erwachsenen mit 70 kg ergeben 2,5 mg/kg rechnerisch 175 mg. Bei 5,3 mg/ml entspricht dies ungefähr 33,0 ml rekonstituierter Lösung. Dies ist eine Lernrechnung; echte Gabe und Rundung werden ärztlich und nach Fachinformation festgelegt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Einheit mg und ml getrennt kontrollieren und ausreichende Flaschenzahl bereitstellen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Welche Laborwerte sind wichtig?\u003c/h3>\u003cp>BGA mit pH, CO₂ und Kalium sowie Verlauf von CK, Myoglobin, Glukose, Nierenfunktion und Gerinnung unterstützen die Beurteilung. Die Auswahl und Frequenz richten sich nach Schwere und Verlauf. Rhabdomyolyse kann zu verzögerten Organproblemen führen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Proben und Verlaufskontrollen mit Zeitstempeln organisieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Warum kann Hyperkaliämie auftreten?\u003c/h3>\u003cp>Muskelschädigung und metabolische Veränderungen können Kalium freisetzen beziehungsweise verschieben. Daraus entstehen zusätzliche Rhythmusrisiken. Kaliumbehandlung und Dantrolentherapie erfüllen unterschiedliche Ziele und müssen koordiniert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> EKG und Kalium wiederholt überwachen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Welche Rolle hat Kühlung?\u003c/h3>\u003cp>Bei Hyperthermie wird eine kontrollierte Kühlung eingesetzt. Die EMHG empfiehlt, aktive Kühlung bei einer Temperatur unter 38,5 °C zu stoppen, um Überkühlung zu vermeiden. Methode und zusätzliche Flüssigkeitslast müssen zur Kreislaufsituation passen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Temperatur engmaschig rückkoppeln, kein unkontrolliertes Dauerkühlen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Wie lange ist eine Nachüberwachung relevant?\u003c/h3>\u003cp>Die EMHG empfiehlt mindestens 24 Stunden Überwachung in einem geeigneten Bereich, weil Zeichen wieder auftreten können. Nach scheinbarer Besserung bleiben Stoffwechsel-, Nieren- und Gerinnungsprobleme möglich. Übergabe und Intensivplanung gehören zur Akuttherapie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht allein nach Normalisierung des etCO₂ Entwarnung geben.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was ist für die spätere Abklärung erforderlich?\u003c/h3>\u003cp>Ein begründeter MH-Verdacht muss dokumentiert und an ein spezialisiertes Zentrum zur weiteren Bewertung vermittelt werden. Patient und Familie benötigen geeignete Informationen. Ein Verdacht wird nicht durch einen einzigen später normalen Laborwert ausgeschlossen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Trigger und klinischen Verlauf für die Fachabklärung vollständig sichern.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Die Krise beginnt als Muskelstoffwechselentgleisung; Temperatur ist nur ein Teil des Bilds. Triggerstopp, frühes Dantrolen und Behandlung der Folgen müssen parallel erfolgen. Präparatspezifische Zubereitung verhindert vermeidbare Dosisfehler.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: CO₂ und Muskelstoffwechsel erkennen, Trigger stoppen, Dantrolen sicher geben.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-emhg\">\u003ca href=\"https://www.emhg.org/recommendations-1/2024/11/4/recognising-and-managing-a-malignant-hyperthermia-crisis-v2024\" target=\"_blank\" rel=\"noopener noreferrer\">Recognising and managing a malignant hyperthermia crisis (v2024)\u003c/a>\u003cp>European Malignant Hyperthermia Group · 2024\u003c/p>\u003cp class=\"muted\">Originalempfehlungen frei lesbar; Trigger, Dantrolen und Nachüberwachung geprüft.\u003c/p>\u003c/li>\u003cli id=\"source-agilus\">\u003ca href=\"https://www.fachinfo.de/fi/detail/024409/agilus\" target=\"_blank\" rel=\"noopener noreferrer\">Agilus 120 mg – Fachinformation\u003c/a>\u003cp>Herstellerinformation über Fachinfo.de; ergänzend EMA-Produktinformation · Abruf 22.11.2026; aktuellen Stand vor Anwendung erneut prüfen\u003c/p>\u003cp class=\"muted\">Fachinformation lesbar; 20 ml Rekonstitution, 5,3 mg/ml Endkonzentration und 2,5 mg/kg geprüft. EMA-Direkt-PDF zeitweise HTTP 429.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/11-color.png","readingMinutes":9},{"id":"12","title":"Massiver Blutverlust · Team und Logistik","category":"Blutung","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Ein gemeinsamer Algorithmus und klare Zuständigkeiten verhindern Doppelgaben und Verzögerungen. Retrospektive Produktdefinitionen dürfen die frühe Eskalation nicht blockieren.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Bei großer Blutung treffen Volumen- und Erythrozytenverlust auf Gerinnungsstörungen. Hypothermie, Azidose und ein erniedrigtes ionisiertes Kalzium können den Verlauf verschlechtern. Die Versorgung muss deshalb mehrere Probleme gleichzeitig bearbeiten.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Nicht erst eine starre Volumendefinition abwarten: Geschwindigkeit des Verlustes, Kreislaufinstabilität und erwarteter Produktbedarf bestimmen die Dringlichkeit. Blutung kann sichtbar sein oder in Körperhöhlen verborgen bleiben.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Lokales Massivblutungsprotokoll aktivieren. Rollen festlegen: Blutstillung, Kreislauf, Produktlogistik, Proben und Dokumentation. Früh die Blutbank informieren und wiederholt die weitere Versorgung abstimmen. Sobald Befunde vorliegen, die hämostatische Behandlung gezielt steuern.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Großlumige Zugänge, zugelassene Schnellinfusions- und Wärmesysteme vorbereiten. Zuordnung und Kontrollen trotz Zeitdruck vollständig einhalten. Blutgas, Gerinnung, Temperatur und ionisiertes Kalzium im Verlauf verfügbar machen. Produktgaben, Zeiten und bereits verabreichte Mengen rückmelden.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Den lokalen Massivblutungsplan früh aktivieren.\u003c/li>\u003cli>Identitätssicherung, Produktlogistik und Blutstillung parallel organisieren.\u003c/li>\u003cli>Wirkung mit Blutungsrate, Perfusion und wiederholter Diagnostik prüfen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Eine anhaltende starke Blutung erzeugt rasch steigenden Produktbedarf. Mehrere Personen beginnen gleichzeitig zu bestellen.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Ein gemeinsamer Algorithmus und klare Zuständigkeiten verhindern Doppelgaben und Verzögerungen. Retrospektive Produktdefinitionen dürfen die frühe Eskalation nicht blockieren.\u003c/p>\u003cp>Entscheidend sind eine hohe Blutungsdynamik und ein erheblicher Bedarf an rascher hämostatischer und kreislaufstützender Therapie. Retrospektive Definitionen über Produktzahlen beschreiben nicht immer den aktuellen Notfall. Lokale Aktivierungskriterien sind deshalb vorausschauend anzuwenden.\u003c/p>\u003cp>Wenn Blutungsquelle und Kreislauf ausreichend kontrolliert sind, wird die Therapie gezielt neu bewertet. Gerinnung, Perfusion und Organfunktion können weiterhin instabil sein. Unnötige Weitergabe bereits bestellter Produkte wird durch klare Kommunikation verhindert.\u003c/p>\u003cp>Quelle und Dynamik, Blutstillungsstatus, Produkte und Faktoren, Calcium, Temperatur, pH, Laktat, Zugänge und laufende Raten nennen. Ausstehende Befunde und nächste Kontrollen ausdrücklich zuordnen. Die Übergabe ist ein sicherheitsrelevanter Teil der Behandlung.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was kennzeichnet massiven Blutverlust?\u003c/h3>\u003cp>Entscheidend sind eine hohe Blutungsdynamik und ein erheblicher Bedarf an rascher hämostatischer und kreislaufstützender Therapie. Retrospektive Definitionen über Produktzahlen beschreiben nicht immer den aktuellen Notfall. Lokale Aktivierungskriterien sind deshalb vorausschauend anzuwenden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht auf eine definierte Liter- oder Konservenzahl warten.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Wie unterscheidet sich dieses Modul vom Blutungsmanagement?\u003c/h3>\u003cp>Hier steht die zeitkritische Organisation bei großer laufender Blutung im Mittelpunkt. Das allgemeine Blutungsmanagement umfasst zusätzlich Prävention und elektive Planung. Eine klare Rollenverteilung verhindert, dass alle gleichzeitig dieselbe Aufgabe übernehmen und andere Aufgaben liegen bleiben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Teamführung und Verantwortlichkeiten früh benennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Was ist die erste ursächliche Maßnahme?\u003c/h3>\u003cp>Eine wirksame Kontrolle der Blutungsquelle muss so schnell wie möglich erfolgen. Operative oder interventionelle Maßnahmen können lebensrettend sein. Transfusionen und Medikamente überbrücken die physiologischen Folgen, schließen aber kein weiterhin blutendes Gefäß.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Definitive Blutstillung wiederholt im Lagebild abfragen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Warum wird ein Massivtransfusionsprotokoll aktiviert?\u003c/h3>\u003cp>Es bündelt Kommunikation mit Blutbank und Labor, Produktbereitstellung und standardisierte Sicherheitsabläufe. Es schafft eine gemeinsame Erwartung über die Dringlichkeit. Nach Stabilisierung wird es bewusst angepasst oder beendet, damit unnötige Produkte vermieden werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Aktivierung und spätere Deaktivierung klar bestätigen lassen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Welche Rollen sind für die Pflege hilfreich?\u003c/h3>\u003cp>Zugang und Infusionssystem, Blutprodukte und Identitätssicherung, Medikamente, Wärme und Labor sowie Dokumentation können getrennt zugeordnet werden. Die konkrete Besetzung hängt vom Team ab. Geschlossene Kommunikation reduziert Doppelgaben und Auslassungen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Jede wichtige Anordnung mit Dosis beziehungsweise Produkt und Rückmeldung wiederholen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Warum ist ein einzelner Hb-Wert unzureichend?\u003c/h3>\u003cp>Akuter Vollblutverlust verändert die Konzentration zunächst nicht zwingend stark. Verdünnung und Flüssigkeitsverschiebung folgen zeitabhängig. Kreislaufzustand, Blutungsrate und wiederholte Messungen sind daher wesentlich. Eine Transfusionsentscheidung im aktiven Notfall ist anders als bei stabiler Anämie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den Zeitpunkt der Probe im Verhältnis zu Produkten und Infusionen dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Welche unterschiedlichen Aufgaben haben Blutkomponenten?\u003c/h3>\u003cp>Erythrozyten unterstützen den Sauerstofftransport, Plättchen die primäre Hämostase und Plasma liefert mehrere Gerinnungsproteine. Gezielte Faktoren können definierte Defizite behandeln. Ein Produkt kann nicht pauschal alle Verluste ersetzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Produktziel im Team eindeutig formulieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Sind feste Produktverhältnisse immer richtig?\u003c/h3>\u003cp>Initiale standardisierte Pakete können die Notfalllogistik unterstützen. Sie werden anschließend an Blutung, Diagnostik und lokalen Algorithmus angepasst. Ein Verhältnis ist kein Beweis, dass für den individuellen Patienten alle Defizite korrigiert sind.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach jeder Phase Labor- und klinische Wirkung neu beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was ist mit Verdünnungskoagulopathie gemeint?\u003c/h3>\u003cp>Verlust von Blutbestandteilen und Ersatz ohne entsprechende Gerinnungskomponenten können Konzentrationen vermindern. Verbrauch und gesteigerte Fibrinolyse können hinzukommen. Die Störung ist dynamisch und lässt sich nicht allein aus dem Infusionsvolumen ableiten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Gerinnungsverlauf früh wiederholt messen.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Warum ist Fibrinogen besonders relevant?\u003c/h3>\u003cp>Es wird für Fibrinbildung und Gerinnselfestigkeit benötigt. Bei starker Blutung kann ein funktioneller oder quantitativer Mangel entstehen. Ersatz erfordert eine passende Indikation und ein lokales Dosierverfahren; Produktmengen werden nicht aus einer allgemeinen Lernkarte übernommen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Labor beziehungsweise viskoelastischen Befund zeitnah mit Blutungsbild verbinden.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Welche Rolle haben viskoelastische Tests?\u003c/h3>\u003cp>Sie können bestimmte hämostatische Defizite rasch sichtbar machen und eine zielgerichtete Therapie unterstützen. Reagenz und Messsystem unterscheiden sich; nicht jedes Medikament und jede Plättchenfunktionsstörung werden erfasst. Konventionelle Labore und Klinik bleiben ergänzend wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Grenzwerte nur aus dem zugehörigen validierten lokalen Algorithmus nutzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum wird ionisiertes Calcium wiederholt gemessen?\u003c/h3>\u003cp>Citrat aus Blutprodukten kann Calcium binden; die Wirkung ist bei rascher Zufuhr und eingeschränkter Metabolisierung ausgeprägter. Hypocalcämie beeinträchtigt Kreislauf und Gerinnung. Eine einmalige normale Messung schützt nicht vor einem späteren Abfall.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> BGA-Zeitplan an die Transfusionsdynamik anpassen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Wie wird Hypothermie verhindert?\u003c/h3>\u003cp>Aktiver Wärmeerhalt, begrenzte Exposition und zugelassene Blut-/Infusionswärmer vermindern zusätzliche Auskühlung. Große Mengen kalter Flüssigkeit können erheblich beitragen. Die sichere Anwendung des Geräts und geeignete Kerntemperaturmessung bleiben nötig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wärmer früh aufbauen, nicht erst nach Erreichen kritischer Temperatur.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Warum ist ein Schnellinfusionsgerät kein Selbstläufer?\u003c/h3>\u003cp>Druck, Luftdetektion, Filter, Zugangsleistung und Produkttauglichkeit müssen stimmen. Fehlbedienung kann Luft- oder Druckkomplikationen verursachen. Ein hoher eingestellter Fluss beweist nicht, dass die Rate sicher am Patienten erreicht wird.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Gerätekontrolle und Herstelleranleitung auch im Notfall beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Wie wird die Identität unter Zeitdruck gesichert?\u003c/h3>\u003cp>Lokale Notfallwege legen Identifikation, Freigabe und vorgeschriebene Kontrollen fest. Nicht gekreuzte Notfallprodukte sind eine geregelte Ausnahme, kein Verzicht auf Patientenzuordnung. Jede Einheit muss nachvollziehbar dokumentiert bleiben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine eindeutige Patientenkennung durchgängig verwenden.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Was ist bei Tranexamsäure zu beachten?\u003c/h3>\u003cp>Indikation, bereits erfolgte Gabe, Zeitfenster und lokale Dosisvorgabe prüfen. Der Nutzen ist nicht in allen Blutungskonstellationen identisch. Unbeabsichtigte Doppelgabe und Verwechslung des Applikationswegs sind vermeidbare Risiken.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wirkstoff, Konzentration und intravenösen Weg rückbestätigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Wie wird der Blutverlust bilanziert?\u003c/h3>\u003cp>Sauger, Spülflüssigkeiten, Tücher und OP-Befund werden zusammengeführt. Unbekannte und verdeckte Verluste werden als Unsicherheit benannt. Produkte und Infusionen sind mit Uhrzeit und Menge getrennt zu erfassen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keine nachträglich erfundene scheinpräzise Gesamtsumme dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Welche Transfusionskomplikationen sind mitzudenken?\u003c/h3>\u003cp>Temperatur- und Elektrolytveränderungen sowie hämolytische, allergische und pulmonale Reaktionen können zusätzlich auftreten. Neue Instabilität darf nicht automatisch nur der Blutung zugeschrieben werden. Produktbezug und zeitlicher Verlauf sind diagnostisch wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Verdacht auf Reaktion den lokalen Transfusionsnotfallplan anwenden.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Wann endet die Eskalationsphase?\u003c/h3>\u003cp>Wenn Blutungsquelle und Kreislauf ausreichend kontrolliert sind, wird die Therapie gezielt neu bewertet. Gerinnung, Perfusion und Organfunktion können weiterhin instabil sein. Unnötige Weitergabe bereits bestellter Produkte wird durch klare Kommunikation verhindert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Offene Laborwerte und Restbedarf vor Verlegung klären.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was gehört in die strukturierte Übergabe?\u003c/h3>\u003cp>Quelle und Dynamik, Blutstillungsstatus, Produkte und Faktoren, Calcium, Temperatur, pH, Laktat, Zugänge und laufende Raten nennen. Ausstehende Befunde und nächste Kontrollen ausdrücklich zuordnen. Die Übergabe ist ein sicherheitsrelevanter Teil der Behandlung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Quelle kontrollieren, Team strukturieren, Wirkung verfolgen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-bleeding\">\u003ca href=\"https://esaic.org/guideline/severe-perioperative-bleeding-management-guideline-2nd-update/\" target=\"_blank\" rel=\"noopener noreferrer\">Management of severe peri-operative bleeding – Second update 2022\u003c/a>\u003cp>ESAIC; European Journal of Anaesthesiology 2023;40:226–304 · 2023\u003c/p>\u003cp class=\"muted\">Offizielle Übersicht und zugängliche Empfehlungen geprüft; kein vollständiger systematischer Volltext-Review behauptet.\u003c/p>\u003c/li>\u003cli id=\"source-trauma\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/\" target=\"_blank\" rel=\"noopener noreferrer\">The European guideline on management of major bleeding and coagulopathy following trauma: sixth edition\u003c/a>\u003cp>Rossaint et al.; Critical Care 2023;27:80 · 2023-03-01\u003c/p>\u003cp class=\"muted\">Originalleitlinie frei zugänglich; relevante Abschnitte zu Blutung, Monitoring und Milieu geprüft. Geltungsbereich Trauma, keine pauschale Übertragung auf alle OP-Blutungen.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/12-color.png","readingMinutes":9},{"id":"13","title":"Neuromuskuläres Monitoring","category":"Narkose","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Zählen und Vergleichen beantworten unterschiedliche Fragen. Antagonisierung richtet sich nach Relaxans, Blockadetiefe und Fachinformation.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Nichtdepolarisierende Relaxanzien hemmen die neuromuskuläre Übertragung. Beim Train-of-Four werden vier Reize abgegeben. Die TOF-Zahl beschreibt die erkennbaren Antworten; die TOF-Ratio vergleicht die vierte mit der ersten Antwort. Vier Antworten sind daher nicht gleich vollständige Erholung.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Klinische Tests wie Kopfheben reichen zum sicheren Ausschluss einer Restblockade nicht aus. Quantitative Messung am Adductor pollicis unterstützt die Beurteilung. Sensorlage, Kalibrierung und freie Bewegung können das Messergebnis beeinflussen.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Die ASA empfiehlt vor Extubation eine quantitativ bestätigte TOF-Ratio von mindestens 0,9. Eine notwendige Antagonisierung richtet sich nach Relaxans, gemessener Blockadetiefe und Fachinformation. Danach wird die Erholung erneut gemessen.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Monitoring möglichst vor Relaxansgabe korrekt einrichten. Relaxans, Dosis, Zeit und Messverlauf dokumentieren. Bei der Antagonisierung Wirkstoff und Blockadetiefe rückbestätigen. Neben neuromuskulärer Erholung müssen Atmung, Vigilanz und weitere Extubationskriterien passen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>TOF-Count 4 schließt Restblockade nicht aus.\u003c/li>\u003cli>Quantitativ am Adductor pollicis beurteilen und Signalqualität prüfen.\u003c/li>\u003cli>ASA: Ratio ≥ 0,9; ESAIC: &gt; 0,9. Weitere Extubationskriterien bleiben nötig.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Ein spontan atmender Patient hat vier TOF-Antworten, aber eine quantitative Ratio von 0,62.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Zählen und Vergleichen beantworten unterschiedliche Fragen. Antagonisierung richtet sich nach Relaxans, Blockadetiefe und Fachinformation.\u003c/p>\u003cp>Sie misst die neuromuskuläre Antwort auf definierte elektrische Reize und gibt einen numerischen Wert, insbesondere die TOF-Ratio, aus. Sie beurteilt nicht direkt die Atemarbeit oder Vigilanz.\u003c/p>\u003cp>Bei Akzeleromyographie können Ausgangswerte über 1,0 auftreten. Gerätespezifische Normalisierung und Kalibrierung beachten, Artefakte ausschließen; nicht allein auf eine unplausible Zahl vertrauen.\u003c/p>\u003cp>Auch kurze Operationen und einzelne Relaxansboli können bei individueller Variabilität eine Restblockade hinterlassen. Zeit seit Gabe ist kein zuverlässiger Ersatz für Messung.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was misst die quantitative Relaxometrie?\u003c/h3>\u003cp>Sie misst die neuromuskuläre Antwort auf definierte elektrische Reize und gibt einen numerischen Wert, insbesondere die TOF-Ratio, aus. Sie beurteilt nicht direkt die Atemarbeit oder Vigilanz.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vor Extubation am Adductor pollicis messen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Was bedeutet TOF?\u003c/h3>\u003cp>Train-of-four: vier supramaximale Reize mit 2 Hz an einem peripheren Nerv. Die resultierenden Muskelantworten T1 bis T4 werden verglichen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Typischer Messort: N. ulnaris, M. adductor pollicis.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Wie berechnet sich die TOF-Ratio?\u003c/h3>\u003cp>T4 geteilt durch T1. Die ASA-Leitlinie nennt eine quantitative Ratio ≥ 0,9 vor Extubation; die ESAIC formuliert &gt; 0,9. Signalqualität, Messmethode und weitere klinische Kriterien bleiben erforderlich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> TOF-Count 4 allein genügt nicht.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was ist der TOF-Count?\u003c/h3>\u003cp>Die Zahl der sichtbaren oder messbaren Antworten auf vier Reize (0–4). Bei tiefem Block ist keine Antwort nachweisbar; ein Count von 4 schließt relevante Restblockade nicht aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei TOF 2/4 keine Extubation allein aufgrund spontaner Atmung.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Warum ist eine TOF-Ratio von 0,7 unzureichend?\u003c/h3>\u003cp>Bei einer Ratio unter 0,9 können Pharynxmuskulatur, obere Atemwege und Schutzreflexe beeinträchtigt sein, selbst bei scheinbar guter Handkraft.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Risiko für Obstruktion und Aspiration im Aufwachraum.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Wo ist der bevorzugte Messort zur Extubationsentscheidung?\u003c/h3>\u003cp>Am N. ulnaris mit Ableitung am M. adductor pollicis. Gesichtsmuskeln erholen sich oft früher und können die Erholung überschätzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Messort dokumentieren und nicht unbemerkt wechseln.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Welche Grenzen hat die Akzeleromyographie?\u003c/h3>\u003cp>Sie misst Beschleunigung und ist von freier Daumenbewegung und korrekter Fixierung abhängig. Unkalibrierte Ausgangsratios können über 1,0 liegen; Gerätevorgaben zur Normalisierung beachten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Daumen darf nicht durch Tücher fixiert sein.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Was ist Elektromyographie (EMG)?\u003c/h3>\u003cp>EMG erfasst die elektrische Summenantwort des Muskels. Sie ist weniger abhängig von freier Muskelbewegung als Beschleunigungsmessung, benötigt aber korrekte Elektrodenanlage.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Praktisch bei eingeschränktem Bewegungsraum.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Warum vor Relaxansgabe kalibrieren?\u003c/h3>\u003cp>Nach Anästhesieeinleitung und vor Relaxansgabe wird das Gerät gemäß Herstelleranleitung vorbereitet und, soweit vorgesehen, kalibriert. Eine geeignete Ausgangsmessung verbessert die Vergleichbarkeit; elektrische Stimulation kann bei wachen Patienten schmerzhaft sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Messung im geplanten anästhesiologischen Ablauf vorbereiten; keine unkritische supramaximale Stimulation am wachen Patienten.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Welche Faktoren verfälschen die Messung?\u003c/h3>\u003cp>Hypothermie, Ödeme, schlechte Elektrodenkontakte, falscher Messort, Bewegungsartefakte und mechanische Behinderung können Antworten verändern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei unplausiblen Werten zuerst Setup prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Wie wirken nichtdepolarisierende Muskelrelaxanzien?\u003c/h3>\u003cp>Sie konkurrieren mit Acetylcholin an nikotinischen Rezeptoren der motorischen Endplatte und verhindern die neuromuskuläre Übertragung. Sie bewirken weder Analgesie noch Hypnose.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Auch vollständig relaxierte Patienten brauchen ausreichende Anästhesie.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Wie wirkt Succinylcholin?\u003c/h3>\u003cp>Es depolarisiert die motorische Endplatte anhaltend; initial können Faszikulationen auftreten. Der typische Phase-I-Block zeigt keinen klassischen TOF-Fade.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kontraindikationen wie Hyperkaliämierisiko und MH-Disposition beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Was ist Fade?\u003c/h3>\u003cp>Bei nichtdepolarisierender Blockade nimmt die Antwortamplitude bei wiederholten Reizen ab: T4 ist kleiner als T1. Dies ist die Grundlage der TOF-Ratio.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Fade kann taktil bei hohen Ratios nicht zuverlässig erkannt werden.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Wie unterscheiden sich Rocuronium und Cisatracurium bei Organversagen?\u003c/h3>\u003cp>Rocuronium wird überwiegend hepatisch/biliär eliminiert, teils renal; die Wirkdauer kann verlängert sein. Cisatracurium wird wesentlich durch organunabhängige Hofmann-Elimination abgebaut, dennoch individuell monitoren.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Leber- oder Nierenfunktionsstörung Verlängerung berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Was ist Hofmann-Elimination?\u003c/h3>\u003cp>Ein temperatur- und pH-abhängiger spontaner chemischer Abbau, relevant für Cisatracurium. Hypothermie und Azidose können den Abbau verlangsamen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Unter Hypothermie längere Wirkung erwarten.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Warum verlängert Magnesium eine Blockade?\u003c/h3>\u003cp>Magnesium hemmt die präsynaptische Acetylcholinfreisetzung und verstärkt die neuromuskuläre Blockade. Auch bestimmte Antibiotika und andere Arzneimittel können potenzieren.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Präeklampsie mit Magnesiuminfusion eng monitoren.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Wie beeinflusst Hypothermie die Relaxierung?\u003c/h3>\u003cp>Sie reduziert Muskelantworten und kann Elimination und Wirkungsdauer von Relaxanzien verändern. Eine kalte Hand erschwert zudem die Interpretation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Körpertemperatur und Messorttemperatur beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Wie wirkt Sugammadex?\u003c/h3>\u003cp>Das modifizierte Cyclodextrin bindet freies Rocuronium und Vecuronium im Plasma und senkt so die freie Konzentration; es wirkt nicht gegen Cisatracurium oder Succinylcholin.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wirkstoffidentität vor Antagonisierung prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Welche Sugammadex-Dosis wird bei T2-Wiederkehr verwendet?\u003c/h3>\u003cp>Für Rocuronium/Vecuronium werden laut Fachinformation bei Wiederauftreten von T2 typischerweise 2 mg/kg tatsächliches Körpergewicht verwendet. Dosis richtet sich nach Blocktiefe und gültiger Fachinformation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei TOF-Count mindestens 2 nach Protokoll dosieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Welche Sugammadex-Dosis gilt bei tiefer Blockade mit 1–2 PTC?\u003c/h3>\u003cp>Bei 1–2 Post-Tetanic Counts ohne TOF-Antwort typischerweise 4 mg/kg tatsächliches Körpergewicht laut Fachinformation. Quantitative Erholung anschließend bestätigen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vorzeitige Extubation trotz Antagonisierung vermeiden.\u003c/p>\u003c/section>\u003csection id=\"chapter-21\">\u003ch3>21. Wann kommen 16 mg/kg Sugammadex infrage?\u003c/h3>\u003cp>Zur sofortigen Aufhebung einer Rocuronium-Blockade ungefähr 3 Minuten nach 1,2 mg/kg Rocuronium bei Erwachsenen, entsprechend der zugelassenen spezifischen Situation. Kein genereller Rettungsersatz für Atemwegsmanagement.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Im Cannot-intubate-cannot-oxygenate-Notfall ist der Atemwegsalgorithmus vorrangig.\u003c/p>\u003c/section>\u003csection id=\"chapter-22\">\u003ch3>22. Was gilt bei schwerer Niereninsuffizienz für Sugammadex?\u003c/h3>\u003cp>Bei schwerer Niereninsuffizienz (Kreatinin-Clearance &lt;30 ml/min einschließlich Dialyse) wird Sugammadex laut europäischer Produktinformation nicht empfohlen, da die Elimination deutlich verzögert ist.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Alternative Strategie und lokale Vorgaben mit Anästhesieteam abstimmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-23\">\u003ch3>23. Welche Risiken bestehen nach Sugammadex?\u003c/h3>\u003cp>Selten schwere Überempfindlichkeitsreaktionen/Anaphylaxie, ausgeprägte Bradykardie und mögliche Wiederkehr der Blockade bei unzureichender Dosierung. Überwachung bleibt erforderlich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach Gabe weiterhin EKG, Atmung und TOF verfolgen.\u003c/p>\u003c/section>\u003csection id=\"chapter-24\">\u003ch3>24. Wie wirkt Neostigmin?\u003c/h3>\u003cp>Es hemmt die Acetylcholinesterase, erhöht Acetylcholin an der Endplatte und kann eine bereits teilweise abgeklungene nichtdepolarisierende Blockade antagonisieren. Es besitzt einen Ceiling-Effekt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht zur zuverlässigen Aufhebung tiefer Blockade einsetzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-25\">\u003ch3>25. Warum wird Neostigmin mit einem Antimuskarinikum kombiniert?\u003c/h3>\u003cp>Der Acetylcholinanstieg verursacht muskarinische Effekte wie Bradykardie und Sekretion. Glycopyrronium oder Atropin kann diese begrenzen, abhängig von Präparat und Standard.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Herzfrequenz nach Gabe beobachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-26\">\u003ch3>26. Wann sollte Neostigmin nicht unkritisch gegeben werden?\u003c/h3>\u003cp>Bei tiefer Blockade ist die Wirkung unzuverlässig; bei bereits vollständiger Erholung bietet es keinen Nutzen und kann Nebenwirkungen auslösen. Dosierung nach Monitorbefund und Protokoll.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vor jeder Gabe TOF messen.\u003c/p>\u003c/section>\u003csection id=\"chapter-27\">\u003ch3>27. Was ist postoperative residuale neuromuskuläre Blockade (PRNB)?\u003c/h3>\u003cp>Eine unvollständige neuromuskuläre Erholung nach Narkose, üblicherweise definiert durch TOF-Ratio &lt;0,9 am Adductor pollicis. Sie erhöht das Risiko respiratorischer Komplikationen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Auch im Aufwachraum bei Auffälligkeiten daran denken.\u003c/p>\u003c/section>\u003csection id=\"chapter-28\">\u003ch3>28. Warum ersetzt ein Kopfhebetest keine Relaxometrie?\u003c/h3>\u003cp>Klinische Tests sind zu unempfindlich, um eine TOF-Ratio ≥0,9 sicher zu bestätigen. Patienten können Kopf oder Hand bewegen und dennoch relevante Schluck- und Atemwegsstörungen haben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht allein nach Handdruck extubieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-29\">\u003ch3>29. Was bedeutet PTC?\u003c/h3>\u003cp>Post-Tetanic Count: Nach tetanischer Stimulation werden einzelne Antworten gezählt, um sehr tiefe Blockaden ohne TOF-Antwort einzuschätzen. Messungen beeinflussen vorübergehend nachfolgende Antworten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> PTC nur mit korrektem Messintervall gemäß Gerät verwenden.\u003c/p>\u003c/section>\u003csection id=\"chapter-30\">\u003ch3>30. Wie unterscheiden sich tiefe und moderate Blockade?\u003c/h3>\u003cp>Moderate Blockade: typischerweise TOF-Count 1–3. Tiefe Blockade: keine TOF-Antwort, aber PTC nachweisbar. Sehr tiefe/intensive Blockade: auch PTC null. Begriffe können je nach Quelle variieren.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Dokumentation mit tatsächlichem Count und PTC bevorzugen.\u003c/p>\u003c/section>\u003csection id=\"chapter-31\">\u003ch3>31. Welche Kriterien gehören zur sicheren Extubation nach Relaxierung?\u003c/h3>\u003cp>Quantitativ bestätigte TOF-Ratio ≥0,9 am Adductor pollicis plus ausreichende Oxygenierung/Ventilation, Schutzreflexe, Vigilanz und individuelle Atemwegssicherheit.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei schwierigen Atemwegen zusätzlich Extubationsplan.\u003c/p>\u003c/section>\u003csection id=\"chapter-32\">\u003ch3>32. Wie handelt man bei niedrigem TOF-Wert vor Extubation?\u003c/h3>\u003cp>Beatmung und Sedierung sicherstellen, Messung prüfen, Ursache und Relaxans identifizieren, geeignete Antagonisierung nach Tiefe/Präparat erwägen und Erholung erneut quantitativ bestätigen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kein Extubationsversuch allein wegen ausreichender Spontanatmung.\u003c/p>\u003c/section>\u003csection id=\"chapter-33\">\u003ch3>33. Was tun bei Atemwegsobstruktion im Aufwachraum nach Relaxierung?\u003c/h3>\u003cp>Sofort Oxygenierung, Atemwegsmanöver und Ventilationsunterstützung nach ABC sichern; Hilfe rufen. Restblockade differenzialdiagnostisch erwägen und quantitativ messen; weitere Ursachen parallel ausschließen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Schnarchen, paradoxe Atmung oder Hypoventilation ernst nehmen.\u003c/p>\u003c/section>\u003csection id=\"ch
