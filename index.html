3c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Welche Schutzmechanismen versagen bei Anästhesie?\u003c/h3>\u003cp>Bewusstsein, Schluckkoordination, Husten- und Kehlkopfschutzreflexe können vermindert sein. Zusätzlich beeinflussen Lagerung und Magenentleerung das Risiko. Ein gesicherter Atemweg reduziert bestimmte Risiken, bietet aber keinen absoluten Schutz gegen jede Mikroaspiration.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Atemwegsplan und Aspirationsrisiko gemeinsam berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Welche Faktoren erhöhen das Risiko?\u003c/h3>\u003cp>Unklarer Nüchternstatus, Obstruktion, Gastroparese und bestimmte andere Erkrankungen oder Medikamente können relevant sein. Notfalleingriffe verlangen eine individuelle Abwägung. Eine einzelne eingehaltene Zeitangabe garantiert keinen leeren Magen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Konkrete Risikofaktoren statt nur nüchtern ja/nein erheben.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Für wen gelten die ASA-Nüchternempfehlungen primär?\u003c/h3>\u003cp>Die entsprechenden Empfehlungen beziehen sich auf definierte gesunde elektive Patienten. Erhöhte Aspirationsrisiken wie Gastroparese oder Obstruktion erfordern eine andere Beurteilung. Allgemeine Fristen werden deshalb nicht ungeprüft auf jede Erkrankung und jeden Notfall übertragen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Geltungsbereich der Leitlinie vor Anwendung prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Was kann eine Magensonographie beitragen?\u003c/h3>\u003cp>Eine qualifiziert durchgeführte Untersuchung kann Mageninhalt und Risikoeinschätzung ergänzen, besonders bei unklarer Situation. Sie hat technische und personelle Grenzen. Ein einzelner Befund ersetzt nicht die gesamte Entscheidung über Anästhesieverfahren und Atemweg.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Verfügbare Expertise und verbleibende Unsicherheit benennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was ist bei einer RSI vorzubereiten?\u003c/h3>\u003cp>Atemwegsstrategie, Medikamente, geeignete Lagerung, verlässliche Präoxygenierung und eine funktionierende großlumige Absaugung sind zentrale Bestandteile. Alternative Atemwegswege und personelle Hilfe müssen geplant sein. Konkrete Technik folgt dem klinischen Risiko und lokalem Standard.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Absaugung vor Medikamentengabe tatsächlich testen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Ist Maskenbeatmung bei Aspirationsrisiko immer verboten?\u003c/h3>\u003cp>Nein. Eine modifizierte Strategie kann bei relevantem Hypoxämierisiko sinnvoll sein. Beatmungsdruck, Technik und individuelles Risiko werden abgewogen. Ein starres Verbot kann die Oxygenierung gefährden; daraus folgt aber auch keine unkritische druckreiche Beatmung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den vereinbarten Plan einschließlich Ausweichstrategie vorher klären.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was hat bei beobachteter Regurgitation Priorität?\u003c/h3>\u003cp>Hilfe rufen, weiteren Eintritt begrenzen, sichtbares Material absaugen und Oxygenierung sowie Atemweg sichern. Lagerung und weitere Schritte werden situationsabhängig mit der verantwortlichen Anästhesieperson koordiniert. Ein Manöver darf lebenswichtige Ventilation nicht unnötig verzögern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Klare Kommunikation und funktionierende Absaugung sind entscheidend.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Warum ist Partikelmaterial besonders relevant?\u003c/h3>\u003cp>Es kann die Atemwege mechanisch verlegen und lokal anhaltende Probleme verursachen. In entsprechenden Situationen ist eine bronchoskopische Beurteilung und Entfernung durch erfahrene Anwender nötig. Flüssigkeitsaspiration und feste Partikel erfordern nicht automatisch dieselbe Vorgehensweise.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Materialart und sichtbare Menge beschreiben, ohne zu spekulieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Welche Zeichen können auf Aspiration hinweisen?\u003c/h3>\u003cp>Sichtbares Material, Husten, Bronchospasmus, Hypoxämie und veränderte Atemgeräusche sind mögliche Hinweise. Unter Anästhesie können subjektive Beschwerden fehlen. Kein einzelner Monitorwert beweist oder widerlegt das Ereignis sicher.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitpunkt und direkte Beobachtungen von späterer Interpretation trennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum kann die Verschlechterung verzögert auftreten?\u003c/h3>\u003cp>Nach chemischer Reizung kann sich eine Entzündungsreaktion weiterentwickeln. Anfangs geringe Symptome garantieren deshalb keinen harmlosen Verlauf. Beobachtungsdauer und weiterer Behandlungsort werden nach Schwere, Gasaustausch und Risiko festgelegt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach dem Ereignis einen expliziten Überwachungsplan vereinbaren.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Sind Antibiotika grundsätzlich sofort erforderlich?\u003c/h3>\u003cp>Eine reine chemische Pneumonitis ist nicht automatisch eine bakterielle Infektion. Die schweizerischen Fachgesellschaftsempfehlungen raten nicht zu routinemäßigen Antibiotika nach jedem Ereignis. Infektionsverdacht, klinischer Verlauf und besondere Risikokonstellationen steuern die ärztliche Entscheidung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keine prophylaktische Routinegabe aus dem Begriff Aspiration ableiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Sind Kortikosteroide eine allgemeine Standardtherapie?\u003c/h3>\u003cp>Eine routinemäßige Anwendung nach Aspiration wird nicht empfohlen. Andere gleichzeitig bestehende Erkrankungen können eigene Indikationen haben. Eine unspezifische Gabe darf Oxygenierung, Atemwegssicherung oder Ursachenbeurteilung nicht ersetzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Indikation eines Medikaments konkret benennen lassen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Wie wird schwere respiratorische Insuffizienz behandelt?\u003c/h3>\u003cp>Sauerstoff und geeignete Atemunterstützung richten sich nach Schutzreflexen, Gasaustausch und Schweregrad. Bei unzureichender Sicherheit kann invasive Beatmung nötig sein. Die Wahl berücksichtigt auch Kreislauf und mögliche Entwicklung einer akuten Lungenschädigung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Atemarbeit und Bewusstsein ebenso wie SpO₂ beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Was leistet eine BGA?\u003c/h3>\u003cp>Sie erfasst unter anderem arterielle Oxygenierung und Ventilation und unterstützt die Verlaufskontrolle. etCO₂ und SpO₂ können nicht jede Störung ausreichend quantifizieren. Messbedingungen und aktuelle Sauerstoffzufuhr müssen zum Befund dokumentiert sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> FiO₂ und Beatmungsunterstützung zusammen mit der BGA nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Kann ein frühes unauffälliges Röntgenbild entwarnen?\u003c/h3>\u003cp>Nicht zuverlässig. Bildgebung und klinische Symptome entwickeln sich zeitabhängig. Eine klare Ereignisbeobachtung und relevante Symptome werden durch einen frühen unauffälligen Befund nicht automatisch widerlegt. Weitere Diagnostik richtet sich nach Verlauf.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bildgebungszeitpunkt und klinische Entwicklung gemeinsam bewerten.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was ist vor Extubation nach einem Ereignis zu beachten?\u003c/h3>\u003cp>Gasaustausch, Atemwegsschutz, klinischer Verlauf und mögliche weitere Verschlechterung müssen beurteilt werden. Das bloße Ende der Operation ist kein ausreichendes Kriterium. Eine Entscheidung wird individuell durch das Anästhesieteam getroffen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Offene Risiken vor Narkoseende klar besprechen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Welche Informationen gehören in die Übergabe?\u003c/h3>\u003cp>Zeitpunkt, Material, beobachtete Regurgitation beziehungsweise Aspiration, Maßnahmen, Bronchoskopie, Gasaustausch und weitere Überwachung nennen. Verdacht und gesicherte Beobachtung getrennt dokumentieren. Auch noch ausstehende Befunde und Eskalationskriterien festlegen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine spätere Verschlechterung muss mit dem Ereignis verknüpft werden können.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Aspiration ist ein Ereignis mit verschiedenen möglichen Folgen. Sichere Vorbereitung, sofortige Atemwegs- und Oxygenierungsmaßnahmen sowie Verlaufsbeobachtung sind entscheidend. Eine Infektion ist nicht automatisch bereits im Moment des Ereignisses vorhanden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Eintritt begrenzen, Atemweg sichern, Verlauf überwachen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-swiss-aspiration\">\u003ca href=\"https://www.ssapm.ch/fileadmin/user_upload/ssapm/public/Qualitaet/Patientensicherheit/SPSA/Pulmonale_Aspiration/SPSA-Merkblatt_Pulmonale-Aspiration_engl.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Swiss recommendations for patients at risk for pulmonary aspiration\u003c/a>\u003cp>Swiss Society of Anaesthesiology and Perioperative Medicine · 2026-07\u003c/p>\u003cp class=\"muted\">Offizielle Empfehlungen frei lesbar; Vorbereitung, Ereignismanagement und Verzicht auf routinemäßige Antibiotika/Steroide geprüft.\u003c/p>\u003c/li>\u003cli id=\"source-asa-fasting\">\u003ca href=\"https://doi.org/10.1097/ALN.0000000000004381\" target=\"_blank\" rel=\"noopener noreferrer\">2023 ASA Practice Guidelines for Preoperative Fasting – Modular Update\u003c/a>\u003cp>Joshi et al.; Anesthesiology 2023;138:132–151 · 2023\u003c/p>\u003cp class=\"muted\">Zugängliche Empfehlungen und Geltungsbereich geprüft; kein Gesamtvolltext-Review.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/18-color.png","readingMinutes":9},{"id":"19","title":"Remifentanil sicher begleiten","category":"Medikamente","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Kurze Wirkdauer macht Leitungsmanagement und Übergang besonders wichtig. Ein späterer Trägerflusswechsel kann unbeabsichtigte Restmengen transportieren.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Remifentanil ist ein potentes Opioid. Es wird durch unspezifische Blut- und Gewebeesterasen abgebaut. Sein rasches Abklingen ermöglicht gute Steuerbarkeit, bedeutet aber auch, dass nach Infusionsende schnell keine ausreichende Analgesie mehr besteht.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Atemdepression, Bradykardie, Hypotonie und Muskelrigidität gehören zu relevanten Risiken. Die Wirkung hängt auch von anderen sedierenden oder kreislaufwirksamen Arzneimitteln ab. Eine ruhige Herzfrequenz allein beweist keine ausreichende Hypnose.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Kontinuierliche Überwachung und kontrollierte Infusionsgabe sicherstellen. Vor dem Absetzen eine geeignete Anschlussanalgesie rechtzeitig ärztlich planen und wirksam werden lassen. Bei Nebenwirkungen werden Zufuhr und unterstützende Maßnahmen sofort im Team beurteilt.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Konzentration und Pumpeneinheit eindeutig beschriften. Leitung bis zum Patienten verfolgen. Totraum und verbleibende Medikamentenreste bei Wechseln und Abbau beachten; kein unkontrolliertes Spülen eines restgefüllten Leitungsabschnitts. Atemwegsausrüstung muss verfügbar sein.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Analgesie ersetzt keine Hypnose.\u003c/li>\u003cli>mg, µg, Konzentration und ml/h getrennt kontrollieren.\u003c/li>\u003cli>Leitungsrest und raschen Analgesieverlust nach Stoppen berücksichtigen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Eine Remifentanilinfusion wurde beendet. Im Leitungssystem befindet sich noch Restlösung; gleichzeitig ist die Anschlussanalgesie nicht geklärt.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Kurze Wirkdauer macht Leitungsmanagement und Übergang besonders wichtig. Ein späterer Trägerflusswechsel kann unbeabsichtigte Restmengen transportieren.\u003c/p>\u003cp>Ein sehr kurz wirksamer potenter Opioidagonist, der vor allem Analgesie im Rahmen einer geeigneten Anästhesie unterstützt. Es ist kein vollständiges Allgemeinanästhetikum. Seine Anwendung verlangt erfahrenes Personal sowie die Möglichkeit zur Atemwegs- und Kreislaufunterstützung.\u003c/p>\u003cp>Die Metabolisierung des Wirkstoffs unterscheidet sich von vielen anderen Opioiden, beseitigt aber nicht alle klinischen Risiken. Metaboliten, Begleitmedikation, Empfindlichkeit und Gesamtzustand müssen weiterhin bewertet werden. Eine Organstörung ist kein Freibrief für unveränderte Anwendung ohne Prüfung.\u003c/p>\u003cp>Kurze Steuerbarkeit verlangt besonders zuverlässige kontinuierliche Zufuhr und einen geplanten Übergang. Konzentration, Einheiten, Leitung und Wirkung müssen stimmen. Remifentanil ersetzt weder Hypnose noch postoperative Schmerzplanung.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was ist Remifentanil?\u003c/h3>\u003cp>Ein sehr kurz wirksamer potenter Opioidagonist, der vor allem Analgesie im Rahmen einer geeigneten Anästhesie unterstützt. Es ist kein vollständiges Allgemeinanästhetikum. Seine Anwendung verlangt erfahrenes Personal sowie die Möglichkeit zur Atemwegs- und Kreislaufunterstützung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Analgesie und Hypnose getrennt planen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. An welchem Rezeptorsystem wirkt es?\u003c/h3>\u003cp>Die analgetische Wirkung beruht wesentlich auf µ-Opioidrezeptoren. Gleichzeitig können Atemdepression, Bradykardie und weitere opioidtypische Wirkungen auftreten. Eine fehlende Schmerzreaktion beweist keine sichere Bewusstlosigkeit.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Hypnotische Komponente und Monitoring aktiv kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Warum klingt die Wirkung rasch ab?\u003c/h3>\u003cp>Remifentanil wird durch unspezifische Esterasen in Blut und Gewebe metabolisiert. Das erklärt die kurze Steuerbarkeit auch bei längerer Infusion. Diese Eigenschaft schafft gleichzeitig das Risiko eines raschen Analgesieverlusts nach Beendigung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Weiterführende Analgesie rechtzeitig vor dem Stoppen planen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was bedeutet kontextsensitive Halbwertszeit?\u003c/h3>\u003cp>Sie beschreibt die Zeit, in der die Plasmakonzentration nach Beendigung einer Infusion um die Hälfte fällt, abhängig von deren Dauer. Sie ist nicht identisch mit jeder klinischen Wirkdauer und keine Garantie sofortiger sicherer Spontanatmung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Pharmakokinetische Zahl und klinische Erholung getrennt beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Welche Applikationswege sind ausgeschlossen?\u003c/h3>\u003cp>Die geprüfte Fachinformation sieht intravenöse Anwendung vor und nennt epidurale sowie intrathekale Gabe als kontraindiziert. Der enthaltene Hilfsstoff Glycin ist dabei relevant. Eine Spritze für Remifentanil muss eindeutig dem intravenösen System zugeordnet sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Verwechslung mit neuraxialen Medikamenten durch getrennte Abläufe verhindern.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Warum ist eine kalibrierte Infusionspumpe erforderlich?\u003c/h3>\u003cp>Die Wirkung ist stark dosis- und geschwindigkeitsabhängig. Eine verlässliche Rate und kontrollierte Zufuhr sind für Sicherheit entscheidend. Pumpenprogramm, Wirkstoffkonzentration und tatsächliche Leitung zum Patienten müssen übereinstimmen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht nur die angezeigte Rate, sondern das gesamte System prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Welche Konzentrationsprüfung ist wichtig?\u003c/h3>\u003cp>Wirkstoffmenge in mg, Endvolumen in ml und daraus resultierende Konzentration in µg/ml müssen korrekt berechnet sein. Rekonstitution und weitere Verdünnung sind präparatspezifisch. Die Fachinformation verbietet die unverdünnte Anwendung nach bloßer Rekonstitution.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Herstelleranleitung und lokales Standardschema verwenden.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Wie lautet ein Rechenbeispiel zur Konzentration?\u003c/h3>\u003cp>2 mg entsprechen 2000 µg. Bei einem exakt hergestellten Endvolumen von 40 ml ergibt sich 50 µg/ml. Dies ist eine Lernrechnung und keine allgemeine Zubereitungsvorschrift. Das Endvolumen ist nicht automatisch die Menge des zugesetzten Verdünnungsmittels.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> mg in µg umrechnen, bevor die Pumpenrate berechnet wird.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Wie wird eine gewichtsbezogene Rate in ml/h umgerechnet?\u003c/h3>\u003cp>Rate in µg/kg/min mal Gewicht in kg mal 60, geteilt durch Konzentration in µg/ml. Bei fiktiven 0,1 µg/kg/min, 70 kg und 50 µg/ml ergeben sich 8,4 ml/h. Die Beispielrate ist keine individuelle Verordnung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Einheitenschritte und Ergebnis unabhängig kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Welche Größenordnung nennt die geprüfte Fachinformation bei beatmeten Erwachsenen?\u003c/h3>\u003cp>Bei Erhaltung mit Propofol nennt die SmPC beispielsweise eine Ausgangsinfusion von 0,25 µg/kg/min und einen anpassbaren Bereich. Diese Angabe gilt für den beschriebenen Kombinationskontext, nicht für jede Sedierung, Altersgruppe oder Kreislaufsituation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Dosiskontext und Begleithypnotikum ausdrücklich berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Warum sind ältere und vulnerable Patienten gesondert zu beurteilen?\u003c/h3>\u003cp>Empfindlichkeit und Kreislaufreserve unterscheiden sich. Die Fachinformation enthält populationsbezogene Anpassungen. Eine berechnete Gewichtsrate allein ist daher keine sichere Dosisentscheidung. Titration erfolgt unter Beurteilung von Wirkung und Nebenwirkungen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ausgangszustand und klinische Reaktion im Verlauf mitteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Welche Atemwegsrisiken sind wichtig?\u003c/h3>\u003cp>Atemdepression bis Apnoe und gegebenenfalls Muskelrigidität können auftreten. Schnelle beziehungsweise hohe Gabe und Begleitmedikation beeinflussen das Risiko. Eine scheinbar ruhige Person kann bereits unzureichend ventilieren, obwohl SpO₂ unter Sauerstoff noch hoch ist.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ventilation und Bewusstsein direkt überwachen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Warum sind Bolusgaben besonders zu prüfen?\u003c/h3>\u003cp>Rasche Konzentrationsanstiege können ausgeprägte Atem- und Kreislaufwirkungen auslösen. Die zulässige Anwendung hängt von Indikation, Beatmung und Fachinformation ab. Für bestimmte spontan atmende postoperative Kontexte werden Bolusgaben nicht empfohlen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keine Bolusfunktion ohne klare Anordnung und passende Überwachung verwenden.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Welche hämodynamischen Nebenwirkungen sind relevant?\u003c/h3>\u003cp>Bradykardie und Hypotonie können auftreten und werden durch weitere Anästhetika oder geringe Reserve verstärkt. Die Behandlung richtet sich nach Ursache und Schwere. Eine Dosisanpassung muss mit ausreichender Analgesie und Hypnose abgestimmt sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitliche Nähe zu Ratenänderungen oder Bolusgaben dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Wie wirken Begleithypnotika mit Remifentanil zusammen?\u003c/h3>\u003cp>Opioid und Hypnotikum können sich hinsichtlich Anästhesiewirkung sowie Atem- und Kreislaufdepression verstärken. Der Bedarf einzelner Substanzen kann sinken. Daraus folgt keine automatische feste Kombination für alle Patienten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Gesamtwirkung statt isolierter Einzeldosis beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Was ist das Risiko von Leitungs-Totraum?\u003c/h3>\u003cp>Restmedikament kann nach Stoppen der Pumpe in Schlauchanteilen verbleiben. Eine spätere Spülung oder erhöhte Trägerflussrate kann unbeabsichtigt einen Bolus auslösen. Leitungsmanagement nach Ende der Infusion ist deshalb sicherheitsrelevant.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Restinhalt nach lokalem sicheren Verfahren berücksichtigen, nicht blind durchspülen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Was bedeutet TCI?\u003c/h3>\u003cp>Eine Target-Controlled Infusion nutzt ein pharmakokinetisches Modell zur Steuerung einer Zielkonzentration. Der Zielwert ist nicht dasselbe wie eine direkt gemessene Hirnkonzentration. Modell, Patientendaten und klinische Titration sind wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Korrekte Alters- und Körperdaten sowie verwendetes Modell prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Warum muss länger wirksame Analgesie rechtzeitig erfolgen?\u003c/h3>\u003cp>Nach Ende der Remifentanilzufuhr fällt die analgetische Wirkung rasch ab. Ein anderes Medikament braucht gegebenenfalls Zeit bis zum Wirkeintritt. Ohne geplanten Übergang können starke Schmerzen und Stressreaktionen entstehen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitpunkt der Anschlussanalgesie in der Ausleitungsplanung festlegen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was ist bei Nieren- und Leberfunktionsstörung zu beachten?\u003c/h3>\u003cp>Die Metabolisierung des Wirkstoffs unterscheidet sich von vielen anderen Opioiden, beseitigt aber nicht alle klinischen Risiken. Metaboliten, Begleitmedikation, Empfindlichkeit und Gesamtzustand müssen weiterhin bewertet werden. Eine Organstörung ist kein Freibrief für unveränderte Anwendung ohne Prüfung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Die konkrete Fachinformation und Population heranziehen.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Kurze Steuerbarkeit verlangt besonders zuverlässige kontinuierliche Zufuhr und einen geplanten Übergang. Konzentration, Einheiten, Leitung und Wirkung müssen stimmen. Remifentanil ersetzt weder Hypnose noch postoperative Schmerzplanung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Kurz wirksam heißt präzise führen und früh übergeben.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-remifentanil\">\u003ca href=\"https://www.medicines.org.uk/emc/product/14262/smpc\" target=\"_blank\" rel=\"noopener noreferrer\">Remifentanil 2 mg – Summary of Product Characteristics\u003c/a>\u003cp>Herstellerinformation über electronic medicines compendium · 2026 laut emc; Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Frei lesbar; Dosiskontext, Applikationsweg, Verdünnung und Leitungsrisiken geprüft. UK-Information; lokal gültiges Präparat maßgeblich.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/19-color.png","readingMinutes":9},{"id":"20","title":"Schwieriger Atemweg","category":"Atemweg","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Ein bewusstes Lagebild und frühzeitiger Methodenwechsel verhindern Fixierung. Eine konkrete Rettungsstrategie muss mit dem verbleibenden Oxygenierungsfenster zusammenpassen.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Ein schwieriger Atemweg kann Maskenbeatmung, Intubation, supraglottische Versorgung oder Extubation betreffen. Wiederholte erfolglose Instrumentierung kann Trauma und Ödem verstärken und damit die Versorgung weiter erschweren.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Anamnese und Untersuchung erfassen frühere Probleme und aktuelle Risiken. Kein einzelner Prädiktor erkennt jeden schwierigen Atemweg. Auch eine zunächst gute Sicht garantiert keine einfache Tubuspassage oder spätere sichere Extubation.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Vor Beginn Pläne und Hilfe festlegen. Präoxygenierung, geeignete Position und verfügbare Alternativen vorbereiten. Versuche begrenzen und nach erfolgloser Maßnahme die Strategie verändern. Bei fehlender Intubations- und Oxygenierungsmöglichkeit nach dem trainierten Notfallalgorithmus eskalieren.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Videolaryngoskop, supraglottische Atemwege, Absaugung und Notfallmaterial nach lokalem Standard prüfen. Zeit, Versuche und Sättigungsverlauf offen kommunizieren. Nach Versorgung Tubuslage mittels kontinuierlicher Kapnographie bestätigen lassen; die Extubation erhält einen eigenen Plan.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Oxygenierung hat Vorrang vor wiederholten Intubationsversuchen.\u003c/li>\u003cli>Alternativen, Hilfe und invasiven Rettungsweg vorab planen.\u003c/li>\u003cli>Tubuslage mit anhaltender CO₂-Kurve im klinischen Kontext bestätigen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Nach einem erfolglosen Intubationsversuch verschlechtert sich die Maskenbeatmung. Das Team muss die nächste Strategie festlegen.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Ein bewusstes Lagebild und frühzeitiger Methodenwechsel verhindern Fixierung. Eine konkrete Rettungsstrategie muss mit dem verbleibenden Oxygenierungsfenster zusammenpassen.\u003c/p>\u003cp>Schwierigkeiten können bei Maskenbeatmung, supraglottischem Atemweg, Intubation oder invasivem Zugang auftreten. Diese Probleme sind nicht identisch. Eine schwierige Intubation bei erhaltener Oxygenierung ist anders zu behandeln als ein Verlust aller Oxygenierungsmöglichkeiten.\u003c/p>\u003cp>Bedingungen, Techniken, Anzahl und Verlauf der Versuche, erfolgreiche Strategie und Komplikationen nachvollziehbar festhalten. Patienteninformation und gegebenenfalls ein Atemwegsdokument unterstützen spätere Versorgung. Die Angabe schwierig allein ist nicht ausreichend.\u003c/p>\u003cp>Sicheres Atemwegsmanagement ist eine vorbereitete Strategie mit Alternativen. Oxygenierung, frühzeitige Hilfe und bewusster Methodenwechsel schützen vor Fixierungsfehlern. Technischer Erfolg wird durch verlässliche Lagekontrolle bestätigt.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was bedeutet schwieriges Atemwegsmanagement?\u003c/h3>\u003cp>Schwierigkeiten können bei Maskenbeatmung, supraglottischem Atemweg, Intubation oder invasivem Zugang auftreten. Diese Probleme sind nicht identisch. Eine schwierige Intubation bei erhaltener Oxygenierung ist anders zu behandeln als ein Verlust aller Oxygenierungsmöglichkeiten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Die konkrete Schwierigkeit eindeutig benennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Warum hat Oxygenierung Vorrang?\u003c/h3>\u003cp>Eine erfolgreiche Tubusplatzierung ist nur ein Mittel zur Sicherung von Ventilation und Oxygenierung. Wiederholte erfolglose Versuche können Hypoxämie und Verletzungen verstärken. Der Algorithmus muss deshalb früh alternative Wege und Hilfe vorsehen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht auf eine Technik fixieren, während die Sättigung fällt.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Welche Informationen gehören zur präoperativen Beurteilung?\u003c/h3>\u003cp>Frühere Atemwegsprobleme, vorhandene Dokumente, Anatomie, Beweglichkeit und funktionelle Einschränkungen sind relevant. Kein einzelner Untersuchungstest sagt Schwierigkeiten sicher voraus oder schließt sie aus. Die Gesamtbeurteilung beeinflusst die Strategie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Einen vorhandenen schwierigen-Atemweg-Ausweis aktiv suchen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was ist ein erwarteter schwieriger Atemweg?\u003c/h3>\u003cp>Es bestehen vor dem Eingriff Hinweise auf relevante Probleme. Dadurch können Technik, personelle Unterstützung und gegebenenfalls ein waches Verfahren geplant werden. Die Entscheidung berücksichtigt auch Aspirationsrisiko und Apnoetoleranz.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Plan und Alternativen vor Beginn gemeinsam aussprechen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Was ist bei einem unerwarteten Problem entscheidend?\u003c/h3>\u003cp>Früh erkennen, Hilfe rufen und den vereinbarten Algorithmus anwenden. Unveränderte Wiederholung derselben erfolglosen Handlung erzeugt nicht automatisch bessere Bedingungen. Zwischen Versuchen werden Oxygenierung, Position und Ursachen geprüft.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Jeden weiteren Versuch mit einer sinnvollen Veränderung verbinden.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Wie hilft geeignete Lagerung?\u003c/h3>\u003cp>Kopf- und Oberkörperposition können Maskenbeatmung und Sicht verbessern. Bei Adipositas kann eine angepasste Rampenposition sinnvoll sein. Verletzungen, eingeschränkte Beweglichkeit und Operation setzen Grenzen. Eine Position ist nicht für jede Anatomie identisch.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Lagerung vor Medikamentengabe optimieren und Atemweg erreichbar halten.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was ist das Ziel der Präoxygenierung?\u003c/h3>\u003cp>Die Sauerstoffreserve wird erhöht, um Zeit während einer möglichen Apnoe zu gewinnen. Maskensitz, ausreichender Sauerstofffluss und Messung soweit verfügbar sind wichtig. Eine lange eingestellte Zeit allein beweist keine wirksame Präoxygenierung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Dichtigkeit und tatsächliche Wirksamkeit kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Grenzen hat die Pulsoxymetrie?\u003c/h3>\u003cp>Sie zeigt die Oxygenierung zeitverzögert und kann bei Sauerstoffgabe eine beginnende Hypoventilation verdecken. Ein hoher Wert beweist keine freie Atemwegspassage oder normale CO₂-Elimination. Auch Perfusions- und Bewegungsartefakte sind möglich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ventilation, Kapnographie und klinische Beobachtung ergänzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Wie wird Maskenbeatmung verbessert?\u003c/h3>\u003cp>Geeignete Kopfposition, Unterkiefermanöver, Hilfsmittel und gegebenenfalls Zweipersonentechnik können helfen. Leckage, Obstruktion und Beatmungsdruck müssen beurteilt werden. Material und personelle Unterstützung sollten sofort verfügbar sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht allein am Beatmungsbeutel stärker drücken.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Welche Rolle hat eine supraglottische Atemwegshilfe?\u003c/h3>\u003cp>Sie kann in passenden Situationen Oxygenierung ermöglichen und Teil einer Rettungsstrategie sein. Auswahl, Größe und korrekte Anwendung sind wichtig. Sie bietet nicht unter allen Umständen denselben Aspirationsschutz wie ein korrekt liegender Tubus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Gerät und weiteres Vorgehen im lokalen Algorithmus kennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Was kann Videolaryngoskopie leisten?\u003c/h3>\u003cp>Sie kann bei geeigneter Anwendung die Sicht und Erfolgswahrscheinlichkeit verbessern. Gute Sicht bedeutet jedoch nicht automatisch einfache Tubuspassage. Erfahrung, passender Spatel und geeignete Führung bleiben relevant.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Benötigtes Zubehör und Gerätestart vor dem Versuch prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum müssen Versuche begrenzt werden?\u003c/h3>\u003cp>Jeder Versuch kostet Zeit und kann Schwellung, Blutung und Trauma verursachen. Die genaue Strategie richtet sich nach lokalem Algorithmus und klinischer Lage. Bei Verschlechterung kann ein früher Wechsel wichtiger sein als das Ausschöpfen einer Zahl.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeit, Sättigung und Gewebetrauma im Team laut mitverfolgen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Wie wird die Tubuslage bestätigt?\u003c/h3>\u003cp>Eine anhaltende passende CO₂-Kurve ist ein zentraler Nachweis im geeigneten klinischen Kontext. Zusätzlich werden Atemmechanik und klinische Befunde beurteilt. Bei fehlendem Signal müssen Fehlintubation, fehlende Perfusion und technische Ursachen rasch eingeordnet werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keinen alleinigen Nachweis durch Beschlagen oder auskultatorischen Eindruck akzeptieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Was bedeutet CICO?\u003c/h3>\u003cp>Cannot Intubate, Cannot Oxygenate beschreibt eine lebensbedrohliche Situation ohne ausreichende Oxygenierung über verfügbare Atemwegswege. Sie erfordert sofortige klare Eskalation zum lokalen Notfallalgorithmus. Ein weiterer unveränderter Intubationsversuch darf notwendige Rettungsmaßnahmen nicht verzögern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Die Situation ausdrücklich benennen und invasive Rettung vorbereiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Warum muss ein invasiver Notfallzugang geübt werden?\u003c/h3>\u003cp>Seltene zeitkritische Verfahren verlangen bekannte Geräte, klare Zuständigkeit und praktische Übung. Eine theoretische Beschreibung ersetzt kein Training. Technikauswahl richtet sich nach lokalen Standards, Patientengruppe und Erfahrung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Set vollständig und am bekannten Ort verfügbar halten.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Wann wird ein waches Verfahren erwogen?\u003c/h3>\u003cp>Bei erwarteten erheblichen Schwierigkeiten oder ungünstiger Rettungssituation kann es Teil einer geplanten Strategie sein. Es verlangt Aufklärung, geeignete Lokalanästhesie, Kooperation und erfahrene Durchführung. Eine pauschale Entscheidung allein aus einem Untersuchungszeichen ist nicht angemessen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vorbereitung und Eskalationsplan auch für das wache Verfahren klären.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Warum ist Extubation ebenfalls ein Atemwegsereignis?\u003c/h3>\u003cp>Nach Entfernung des Tubus können Obstruktion, Restrelaxierung, Schwellung oder unzureichende Schutzreflexe relevant werden. Ein zuvor schwieriger Atemweg verlangt einen bewussten Extubations- und Reintubationsplan. Operationsende allein reicht als Kriterium nicht aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Material und Hilfe auch zur Ausleitung verfügbar halten.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was muss bei Kindern gesondert beachtet werden?\u003c/h3>\u003cp>Anatomie, Gerätewahl, Sauerstoffreserve und empfohlene Verfahren unterscheiden sich altersabhängig. Erwachsenenalgorithmen und Größen werden nicht unverändert übernommen. Kinder benötigen den passenden lokalen pädiatrischen Standard.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Altersgruppe und spezialisiertes Material vor Beginn berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Wie wird ein schwieriger Atemweg dokumentiert?\u003c/h3>\u003cp>Bedingungen, Techniken, Anzahl und Verlauf der Versuche, erfolgreiche Strategie und Komplikationen nachvollziehbar festhalten. Patienteninformation und gegebenenfalls ein Atemwegsdokument unterstützen spätere Versorgung. Die Angabe schwierig allein ist nicht ausreichend.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Erfolgreiche Technik mit konkretem Gerät und Besonderheiten nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Sicheres Atemwegsmanagement ist eine vorbereitete Strategie mit Alternativen. Oxygenierung, frühzeitige Hilfe und bewusster Methodenwechsel schützen vor Fixierungsfehlern. Technischer Erfolg wird durch verlässliche Lagekontrolle bestätigt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Oxygenierung sichern, Versuche bewusst steuern, rechtzeitig eskalieren.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-awmf-airway\">\u003ca href=\"https://www.ai-online.info/images/ai-ausgabe/2024/02-2024/AI_02-2024_Sonderbeitrag_Piepho.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">S1-Leitlinie Atemwegsmanagement 2023\u003c/a>\u003cp>Piepho et al.; DGAI; Anästhesiologie &amp; Intensivmedizin 2024;65:69–96 · Stand 2023-08-21; Publikation 2024\u003c/p>\u003cp class=\"muted\">Offizielle Publikation mit PDF zugänglich. S1-Expertenkonsens, keine pauschal hochgradige Studien-Evidenz.\u003c/p>\u003c/li>\u003cli id=\"source-swiss-aspiration\">\u003ca href=\"https://www.ssapm.ch/fileadmin/user_upload/ssapm/public/Qualitaet/Patientensicherheit/SPSA/Pulmonale_Aspiration/SPSA-Merkblatt_Pulmonale-Aspiration_engl.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Swiss recommendations for patients at risk for pulmonary aspiration\u003c/a>\u003cp>Swiss Society of Anaesthesiology and Perioperative Medicine · 2026-07\u003c/p>\u003cp class=\"muted\">Offizielle Empfehlungen frei lesbar; Vorbereitung, Ereignismanagement und Verzicht auf routinemäßige Antibiotika/Steroide geprüft.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/20-color.png","readingMinutes":9},{"id":"21","title":"TRALI nach Transfusion","category":"Transfusion","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Permeabilitätsödem und hydrostatische Überlastung haben unterschiedliche Mechanismen. Eine voreilige Zuordnung allein anhand des zeitlichen Zusammenhangs ist nicht ausreichend.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>TRALI ist eine transfusionsassoziierte akute Lungenschädigung mit erhöhter Gefäßdurchlässigkeit. Immunologische und weitere Mechanismen können beteiligt sein. TACO bezeichnet demgegenüber überwiegend eine transfusionsassoziierte Kreislaufüberlastung.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Typisch sind neue Hypoxämie und bilaterales Lungenödem während oder innerhalb von sechs Stunden nach Transfusion. Hypotonie und Fieber können auftreten. TRALI bleibt eine klinische Diagnose; andere Ursachen und ein möglicher Überlastungsanteil werden mitbewertet.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Transfusion sofort stoppen, Hilfe und Transfusionsdienst informieren. Oxygenierung, gegebenenfalls Beatmung und Kreislauf unterstützen. Nach lokalem Reaktionsalgorithmus Beutel, Schlauchsystem und notwendige Proben für die Abklärung sichern.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Produkt, Beginn, verabreichte Menge und Symptomzeit dokumentieren. Flüssigkeitsbilanz und Kreislaufbefunde verfügbar machen. Meldung und Hämovigilanz nach dem gültigen Verfahren organisieren; die abschließende Klassifikation nicht vorwegnehmen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Akute Hypoxämie während oder bis sechs Stunden nach Transfusion prüfen.\u003c/li>\u003cli>TRALI und TACO können schwer unterscheidbar sein.\u003c/li>\u003cli>Transfusion stoppen, stabilisieren und Blutbank informieren.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Während einer Transfusion treten neue Hypoxämie und beidseitige pulmonale Befunde auf. Die Ursache der Flüssigkeitsverschiebung ist zunächst unklar.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Permeabilitätsödem und hydrostatische Überlastung haben unterschiedliche Mechanismen. Eine voreilige Zuordnung allein anhand des zeitlichen Zusammenhangs ist nicht ausreichend.\u003c/p>\u003cp>Transfusion-Related Acute Lung Injury bezeichnet eine akute Lungenschädigung im zeitlichen Zusammenhang mit Transfusion. Charakteristisch sind Hypoxämie und pulmonales Ödem, bei dem eine hydrostatische Überlastung nicht die hauptsächliche Erklärung ist. Die Diagnose erfordert klinische Einordnung und Ausschluss anderer Ursachen.\u003c/p>\u003cp>Respiratorische und hämodynamische Überwachung, Verlauf der Bildgebung beziehungsweise Labore sowie vollständige Übergabe. Erneuter Transfusionsbedarf wird individuell mit Fachdisziplinen abgestimmt. Der Verdacht wird dokumentiert, ohne ungesicherte Ursache als bewiesen auszugeben.\u003c/p>\u003cp>Atemnot nach Transfusion ist ein dringlicher Befund mit mehreren Ursachen. Stoppen, stabilisieren und differenzieren kommen vor einer endgültigen Klassifikation. Nicht jedes Lungenödem ist Überwässerung und nicht jede zeitnahe Hypoxämie ist TRALI.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was bedeutet TRALI?\u003c/h3>\u003cp>Transfusion-Related Acute Lung Injury bezeichnet eine akute Lungenschädigung im zeitlichen Zusammenhang mit Transfusion. Charakteristisch sind Hypoxämie und pulmonales Ödem, bei dem eine hydrostatische Überlastung nicht die hauptsächliche Erklärung ist. Die Diagnose erfordert klinische Einordnung und Ausschluss anderer Ursachen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Neue Atemprobleme während oder nach Transfusion sofort kommunizieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Welches Zeitfenster gehört zur Definition?\u003c/h3>\u003cp>Die akute respiratorische Verschlechterung beginnt während oder innerhalb von sechs Stunden nach Transfusion. Weitere diagnostische Befunde können später erhoben werden. Ein bloßer zeitlicher Zusammenhang beweist aber noch keine TRALI.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitpunkt von Produktbeginn und Symptomen exakt festhalten.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Wie entsteht das Lungenödem?\u003c/h3>\u003cp>Entzündliche Aktivierung und Schädigung der pulmonalen Gefäßbarriere können zu vermehrter Durchlässigkeit führen. Flüssigkeit tritt in Interstitium und Alveolen über. Im Unterschied zur primär hydrostatischen Überlastung steht eine Permeabilitätsstörung im Vordergrund.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht jedes transfusionsnahe Lungenödem als Volumenüberschuss behandeln.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Welche Rolle spielen Antikörper?\u003c/h3>\u003cp>Bestimmte Antikörper im Spenderplasma können mit Leukozyten- beziehungsweise Empfängereigenschaften zusammenwirken. Nicht jede klinische TRALI lässt sich dadurch vollständig erklären. Fehlender Antikörpernachweis schließt die klinische Diagnose nicht automatisch aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Laborabklärung unterstützt, ersetzt aber nicht die Akutbeurteilung.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Was bedeutet das Zwei-Ereignis-Modell?\u003c/h3>\u003cp>Patientenseitige Entzündung beziehungsweise Vulnerabilität und ein transfusionsbezogener Auslöser können zusammenwirken. Es ist ein pathophysiologisches Modell, keine Bedingung, dass immer zwei klar sichtbare Ereignisse bewiesen werden müssen. Die Mechanismen sind komplex.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vorerkrankung und Transfusionsereignis gemeinsam einordnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Welche Blutprodukte können beteiligt sein?\u003c/h3>\u003cp>Plasmahaltige Komponenten können eine Rolle spielen. Auch Erythrozytenkonzentrate enthalten Restplasma; TRALI ist deshalb nicht ausschließlich auf Plasmatransfusion beschränkt. Eine Zuordnung zu einer konkreten Einheit erfordert Hämovigilanzabklärung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Alle zeitlich relevanten Produkte dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was unterscheidet TRALI und TACO?\u003c/h3>\u003cp>Bei TACO steht eine hydrostatische Kreislaufüberlastung im Vordergrund. Bei TRALI ist eine nicht primär hydrostatische Lungenschädigung maßgeblich. Beide können ähnlich aussehen und sich überlagern; eine sofort eindeutige Unterscheidung ist nicht immer möglich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Unklarheit benennen, statt vorschnell ein Etikett festzulegen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Befunde helfen bei der Differenzierung?\u003c/h3>\u003cp>Bilanz, Herzfunktion, Blutdruck, Bildgebung und gegebenenfalls Biomarker können beitragen. Kein einzelner BNP-Wert oder Blutdruckwert beweist allein die Ursache. Die Gesamtsituation einschließlich Verlauf vor der Transfusion ist entscheidend.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Klinik, Echobefund und Vorverlauf zusammenführen.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was bedeuten Typ I und Typ II in der Konsensdefinition?\u003c/h3>\u003cp>Typ I betrifft Patienten ohne entsprechende ARDS-Risikofaktoren. Typ II berücksichtigt bestimmte vorhandene Risikofaktoren beziehungsweise milde vorbestehende Lungenschädigung bei zuvor stabilem respiratorischem Verlauf. Die genaue Klassifikation erfolgt anhand der Definition, nicht nur nach Vorerkrankung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Die zwölf Stunden vor dem Ereignis in die Verlaufserhebung aufnehmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Welche Symptome sind möglich?\u003c/h3>\u003cp>Akute Dyspnoe, Hypoxämie und neue beidseitige pulmonale Befunde sind zentral. Fieber und Hypotonie können auftreten, sind aber nicht zwingend. Unter Anästhesie können vor allem steigender Sauerstoffbedarf und veränderte Beatmung auffallen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Auch unter kontrollierter Beatmung Transfusionsbezug prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Was ist die erste Maßnahme bei Verdacht auf schwere Transfusionsreaktion?\u003c/h3>\u003cp>Transfusion stoppen und sofort das verantwortliche Team informieren. Atemweg, Oxygenierung und Kreislauf beurteilen und stabilisieren. Zugang und weitere Versorgung nach lokalem Reaktionsalgorithmus organisieren; das Produkt nicht einfach unkontrolliert weiterlaufen lassen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Produkt und Leitung nach SOP für die Abklärung sichern.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum muss die Identität erneut geprüft werden?\u003c/h3>\u003cp>Eine akute hämolytische Reaktion oder Produktverwechslung kann lebensbedrohlich sein und gehört in die Differenzialdiagnose. Auch bei primär respiratorischen Zeichen müssen Patientenzuordnung und Produktdaten stimmen. TRALI darf nicht voreilig andere Transfusionsnotfälle verdrängen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Patient, Produkt und Dokumentation sofort abgleichen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Wie wird die respiratorische Störung behandelt?\u003c/h3>\u003cp>Sauerstoff und geeignete Atemunterstützung werden nach Schweregrad eingesetzt. Bei invasiver Beatmung ist ein lungenschonendes Konzept wichtig. Gleichzeitig wird die Kreislaufsituation beurteilt. Die Behandlung ist vor allem unterstützend und individuell.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ansteigende Unterstützung und BGA-Verlauf eng dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Sind Diuretika automatisch richtig?\u003c/h3>\u003cp>Nein. Bei einer Permeabilitätsstörung mit möglicher Hypotonie kann ungezielte Entwässerung problematisch sein. Bei tatsächlicher Überlastung beziehungsweise Mischbild kann eine andere Strategie nötig sein. Entscheidung und Volumenmanagement hängen von der klinischen Differenzierung ab.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> TRALI und TACO nicht mit demselben schematischen Medikamentenreflex behandeln.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Sind Kortikosteroide als spezifische TRALI-Therapie gesichert?\u003c/h3>\u003cp>Eine allgemeine nachgewiesene spezifische Steroidbehandlung ist nicht etabliert. Andere Erkrankungen können eigene Indikationen haben. Wesentlich sind sofortige Unterstützung, Differentialdiagnose und Hämovigilanz. Eine vermeintlich spezifische Gabe darf diese Maßnahmen nicht verzögern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Unklare Evidenz ausdrücklich von Standardmaßnahmen unterscheiden.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Welche Differenzialdiagnosen bestehen?\u003c/h3>\u003cp>TACO, Anaphylaxie, bakterielle Kontamination, hämolytische Reaktion, Aspiration und andere Ursachen akuter Lungenschädigung sind relevant. Die weitere Diagnostik wird vom klinischen Muster gesteuert. Mehrere Mechanismen können gleichzeitig vorliegen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kreislauf- und respiratorische Zeichen gemeinsam beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Warum ist die Blutbankkommunikation wichtig?\u003c/h3>\u003cp>Sie ermöglicht die koordinierte Produkt- und Spenderabklärung sowie gegebenenfalls Schutz weiterer Empfänger. Verdachtsfälle benötigen einen definierten Meldeweg. Die klinische Behandlung darf nicht auf den Abschluss der Laboruntersuchung warten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Beginn, Ende, Einheitennummern und Symptome zeitnah weitergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Welche Proben und Materialien werden gesichert?\u003c/h3>\u003cp>Lokale Transfusionsreaktionsprotokolle legen Blutproben, Restprodukt, Behälter und Dokumente fest. Auswahl richtet sich auch nach Differenzialdiagnose. Unkoordinierte Entsorgung kann die Ursachenabklärung erschweren.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Produktreste und Unterlagen nach SOP aufbewahren.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was gehört in die Weiterbehandlung?\u003c/h3>\u003cp>Respiratorische und hämodynamische Überwachung, Verlauf der Bildgebung beziehungsweise Labore sowie vollständige Übergabe. Erneuter Transfusionsbedarf wird individuell mit Fachdisziplinen abgestimmt. Der Verdacht wird dokumentiert, ohne ungesicherte Ursache als bewiesen auszugeben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Auch nach erster Stabilisierung Verlauf und Meldeprozess weiterverfolgen.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Atemnot nach Transfusion ist ein dringlicher Befund mit mehreren Ursachen. Stoppen, stabilisieren und differenzieren kommen vor einer endgültigen Klassifikation. Nicht jedes Lungenödem ist Überwässerung und nicht jede zeitnahe Hypoxämie ist TRALI.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Transfusion stoppen, Atmung sichern, Ursache gemeinsam klären.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-trali-consensus\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6850655/\" target=\"_blank\" rel=\"noopener noreferrer\">A consensus redefinition of transfusion-related acute lung injury\u003c/a>\u003cp>Vlaar et al.; Transfusion 2019 · 2019\u003c/p>\u003cp class=\"muted\">Originalkonsens frei zugänglich; Zeitfenster, Typen und Differenzialdiagnose geprüft.\u003c/p>\u003c/li>\u003cli id=\"source-trali-jpac\">\u003ca href=\"https://www.jpac.org.uk/transfusion-practice/consent/guidance-for-healthcare-practitioners/transfusion-related-acute-lung-injury/\" target=\"_blank\" rel=\"noopener noreferrer\">Non-TACO: Transfusion-Related Acute Lung Injury – Guidance for healthcare practitioners\u003c/a>\u003cp>JPAC – UK Blood Transfusion Services · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Offizielle Definition frei lesbar; ergänzende Einordnung.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/21-color.png","readingMinutes":9},{"id":"22","title":"TUR-Syndrom und Spülflüssigkeitsaufnahme","category":"Elektrolyte","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Die Lösung bestimmt, ob vor allem hypotone Verdünnung, Substanzwirkung oder Volumen-/Chloridbelastung relevant wird. Die Bilanz ist ein Hinweis, keine exakte Messung intravasaler Aufnahme.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Spülflüssigkeit kann über eröffnete Gefäße aufgenommen werden. Elektrolytfreie Lösungen können Verdünnungshyponatriämie und Hypoosmolalität verursachen. Auch Kochsalzaufnahme bei bipolarer Technik kann Volumenüberlastung und eine hyperchlorämische Azidose auslösen.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Übelkeit, Unruhe, Kopfschmerz und Sehstörungen können frühe Zeichen sein. Schwere Verläufe zeigen Bewusstseinsstörung, Krampfanfälle, Hypoxämie oder Kreislaufveränderungen. Unter Allgemeinanästhesie sind neurologische Frühzeichen schwerer erkennbar.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Verdacht sofort kommunizieren, Resektion und Spülung durch das operative Team stoppen lassen und nach ABCDE versorgen. Blutgase, Natrium und weitere Elektrolyte sowie Osmolalität und Bilanz beurteilen. Eine symptomatische Hyponatriämie erfordert kontrollierte Behandlung durch das zuständige Fachteam.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Art der Spülflüssigkeit, Eingriffsverfahren und zugeführte beziehungsweise aufgefangene Mengen erfassen. Bilanzungenauigkeiten mitteilen. Neurologischen Zustand, Oxygenierung und Laborverlauf überwachen. Eine erforderliche hypertonische Lösung als Hochrisikomedikament gegenprüfen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Systemische Spülresorption ist auch bei bipolarer Technik möglich.\u003c/li>\u003cli>Natrium, Chlorid, Osmolalität und Volumenstatus gemeinsam beurteilen.\u003c/li>\u003cli>Schwere symptomatische Hyponatriämie kontrolliert und spezialisiert behandeln.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Bei einem transurethralen Eingriff entstehen neue Verwirrtheit und Atemprobleme. Die dokumentierte Spüldifferenz steigt an.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Die Lösung bestimmt, ob vor allem hypotone Verdünnung, Substanzwirkung oder Volumen-/Chloridbelastung relevant wird. Die Bilanz ist ein Hinweis, keine exakte Messung intravasaler Aufnahme.\u003c/p>\u003cp>Bei transurethralen Eingriffen kann resorbierte Spülflüssigkeit zu akuten systemischen Störungen führen. Bei elektrolytfreien Lösungen stehen Verdünnungshyponatriämie und gegebenenfalls hypoosmolare Effekte im Vordergrund. Die konkrete Zusammensetzung und aufgenommene Menge bestimmen die Folgen.\u003c/p>\u003cp>Verfahren, Lösung, Dauer, Bilanzschätzung, Symptome, Natrium- und Säure-Basen-Verlauf sowie erhaltene Maßnahmen nennen. Offene Resorptionsrisiken und weitere Kontrollen müssen ausdrücklich zugeordnet werden. Eine scheinbare Besserung beendet die Überwachung nicht automatisch.\u003c/p>\u003cp>Spülflüssigkeit ist bei Resorption eine systemische Belastung. Technik und Lösung bestimmen, ob vor allem Natrium, Volumen, Chlorid oder weitere Stoffeffekte relevant werden. Eine korrekte Bilanz unterstützt die Diagnose, ersetzt aber nicht die klinische Beurteilung.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was ist das klassische TUR-Syndrom?\u003c/h3>\u003cp>Bei transurethralen Eingriffen kann resorbierte Spülflüssigkeit zu akuten systemischen Störungen führen. Bei elektrolytfreien Lösungen stehen Verdünnungshyponatriämie und gegebenenfalls hypoosmolare Effekte im Vordergrund. Die konkrete Zusammensetzung und aufgenommene Menge bestimmen die Folgen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Spülverfahren und verwendete Lösung zu Beginn kennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Wie gelangt Spülflüssigkeit in den Kreislauf?\u003c/h3>\u003cp>Eröffnete Gefäße können bei entsprechendem Druckgradienten Flüssigkeit aufnehmen. Auch Extravasation und spätere Resorption sind möglich. Operationsdauer und Gewebeverletzung beeinflussen das Risiko. Das tatsächlich intravasal aufgenommene Volumen lässt sich nicht immer exakt aus der Bilanz ableiten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Spülbilanz und chirurgische Ereignisse fortlaufend kommunizieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Was unterscheidet monopolare und bipolare Verfahren?\u003c/h3>\u003cp>Bei klassischen monopolaren Verfahren werden geeignete nicht leitende Spüllösungen verwendet. Bipolare Systeme ermöglichen je nach Gerät isotone Kochsalzlösung. Das reduziert das klassische hyponatriämische Risiko, beseitigt aber nicht jede Volumen- und Säure-Basen-Komplikation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Herstellerfreigabe und Lösung nicht unabhängig vom System wählen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Warum kann Natrium rasch abfallen?\u003c/h3>\u003cp>Aufnahme natriumarmer Flüssigkeit verdünnt die extrazelluläre Natriumkonzentration. Entscheidend sind Geschwindigkeit, Menge und Zusammensetzung. Ein akuter Abfall kann neurologische Symptome auslösen. Gleichzeitig können Hypervolämie und substanzspezifische Wirkungen auftreten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Präoperativen Ausgangswert und Verlauf berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Warum ist das Gehirn gefährdet?\u003c/h3>\u003cp>Sinkt die effektive extrazelluläre Tonizität rasch, kann Wasser in Hirnzellen eintreten. Der begrenzte Raum im Schädel macht ausgeprägte akute Veränderungen gefährlich. Die Schwere richtet sich nicht allein nach einer absoluten Natriumzahl.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bewusstseinsveränderung oder Krampfanfall als Notfall behandeln.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Welche neurologischen Warnzeichen sind möglich?\u003c/h3>\u003cp>Übelkeit, Kopfschmerzen, Sehstörungen, Unruhe und Verwirrtheit können auftreten. Schwere Fälle können Krampfanfälle und Bewusstlosigkeit verursachen. Unter Allgemeinanästhesie fehlen subjektive Symptome; Monitoring und Labor gewinnen dann besondere Bedeutung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Neue Beschwerden bei Regionalanästhesie nicht bagatellisieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Welche Kreislauf- und Atemzeichen sind relevant?\u003c/h3>\u003cp>Volumenaufnahme kann Kreislaufbelastung und Lungenödem verursachen. Blutdruck und Herzfrequenz können sich im Verlauf unterschiedlich verändern. Hypoxämie und zunehmende Atemarbeit sind Warnzeichen, aber nicht spezifisch für das Syndrom.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blutung, hoher Spinalblock und kardiale Ursachen parallel bedenken.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Warum schließen normale Natriumwerte eine Spülkomplikation nicht aus?\u003c/h3>\u003cp>Bei isotone Kochsalzlösung kann große Resorption zu Hypervolämie und hyperchlorämischer Azidose führen, ohne die typische Verdünnungshyponatriämie auszulösen. Das klinische Problem wird deshalb nicht allein über Natrium definiert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Chlorid, Säure-Basen-Lage und Volumenbelastung mitbeurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Welche Bedeutung hat Glycin?\u003c/h3>\u003cp>Glycinhaltige Spüllösungen können zusätzlich zu Volumen- und Osmolalitätsproblemen substanzbezogene neurologische Effekte verursachen. Die genaue Einordnung verlangt Kenntnis der verwendeten Lösung. Nicht jeder Fall ist allein ein Natriummangelproblem.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Produktname und Konzentration dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Was hat bei begründetem Verdacht Vorrang?\u003c/h3>\u003cp>Team informieren, weitere Resektion und Spülzufuhr in Abstimmung stoppen sowie ABCDE und unmittelbare Diagnostik durchführen. Oxygenierung und Kreislauf werden gesichert. Eine lebensbedrohliche Situation wird nicht bis zur vollständigen Bilanzrekonstruktion unbehandelt gelassen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Spüllösung und Beginn der Symptome sofort nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Welche Laborwerte helfen?\u003c/h3>\u003cp>BGA und Elektrolyte mit Natrium und Chlorid, Glukose, Nierenfunktion und bei entsprechender Frage gemessene Osmolalität unterstützen die Beurteilung. Messmethode und Zeitverlauf sind wichtig. Weitere Untersuchungen richten sich nach klinischer Lage.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Proben zeitnah gewinnen und Werte im Verlauf statt isoliert beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum sind Osmolalität und Tonizität nicht identisch?\u003c/h3>\u003cp>Osmolalität zählt gelöste Teilchen, Tonizität beschreibt deren wirksamen Einfluss auf Wasserverteilung über Zellmembranen. Nicht jede Substanz wirkt gleich effektiv. Bei ungewöhnlicher Spülflüssigkeit kann die Beziehung zwischen Natrium und gemessener Osmolalität deshalb komplex sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht jede Hyponatriämie automatisch als identische hypotone Störung behandeln.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Wie wird schwere symptomatische hypotone Hyponatriämie eingeordnet?\u003c/h3>\u003cp>Sie ist ein Notfall mit Bedarf an erfahrener ärztlicher Steuerung und engmaschiger Kontrolle. Hypertones Natriumchlorid kann in definierten Situationen erforderlich sein. Auswahl, Bolusgröße und Korrekturlimits folgen einem überprüften lokalen beziehungsweise spezialisierten Protokoll.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keinen selbst errechneten vollständigen Natriumausgleich als rasche Zielgabe verwenden.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Warum soll Natrium nicht einfach auf normal angehoben werden?\u003c/h3>\u003cp>Zu rasche Korrektur kann besonders bei chronischer oder zeitlich unklarer Hyponatriämie neurologische Schäden verursachen. Initiale Symptombesserung und spätere Korrekturkontrolle sind unterschiedliche Ziele. Risiko, Dauer und Begleitfaktoren beeinflussen die zulässige Strategie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ausgangswert, Zeitverlauf und kumulative Änderung lückenlos dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Was ist osmotische Demyelinisierung?\u003c/h3>\u003cp>Eine schwere neurologische Schädigung kann nach zu schneller Korrektur bestimmter Hyponatriämien auftreten. Das Risiko hängt von Dauer, Tiefe und weiteren Faktoren ab. Akute Symptomtherapie muss deshalb mit einem Plan zur Vermeidung überschießender Korrektur verbunden sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Auch spontane Wasserdiurese kann den Natriumanstieg beschleunigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Warum braucht es wiederholte Natriumkontrollen?\u003c/h3>\u003cp>Resorption, Therapie und renale Ausscheidung können sich rasch verändern. Eine anfänglich passende Maßnahme kann später zu einem unerwarteten Anstieg führen. Die Kontrollfrequenz richtet sich nach Schwere und Behandlung, nicht nach einer starren Routineblutabnahme.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nächste Messung vor Übergabe verbindlich festlegen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Was sagt eine Spüldifferenz aus?\u003c/h3>\u003cp>Bei fiktiven 15 l Zulauf und 13 l Rücklauf beträgt das dokumentierte Defizit 2 l. Dies beweist nicht, dass 2 l intravasal aufgenommen wurden. Bodenverluste, Tücher, Extravasation und Messfehler beeinflussen die Rechnung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bilanz als Schätzung mit Unsicherheiten kennzeichnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Warum sind Diuretika nicht automatisch richtig?\u003c/h3>\u003cp>Sie können bei passender Volumenüberlastung erwogen werden, sind aber keine allgemeine Lösung jedes TUR-Syndroms. Kreislauf, Natriumverlauf und Ursache müssen berücksichtigt werden. Eine veränderte Ausscheidung kann die Elektrolytkorrektur zusätzlich beeinflussen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Therapieziel und Folgekontrollen vor Gabe klären.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was gehört in die postoperative Übergabe?\u003c/h3>\u003cp>Verfahren, Lösung, Dauer, Bilanzschätzung, Symptome, Natrium- und Säure-Basen-Verlauf sowie erhaltene Maßnahmen nennen. Offene Resorptionsrisiken und weitere Kontrollen müssen ausdrücklich zugeordnet werden. Eine scheinbare Besserung beendet die Überwachung nicht automatisch.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Präoperativen und aktuellsten Natriumwert mit Uhrzeit nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Spülflüssigkeit ist bei Resorption eine systemische Belastung. Technik und Lösung bestimmen, ob vor allem Natrium, Volumen, Chlorid oder weitere Stoffeffekte relevant werden. Eine korrekte Bilanz unterstützt die Diagnose, ersetzt aber nicht die klinische Beurteilung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Spüllösung kennen, Resorption erkennen, Elektrolyte kontrolliert behandeln.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-baus-tur\">\u003ca href=\"https://www.baus.org.uk/trainees/tur_syndrome.aspx\" target=\"_blank\" rel=\"noopener noreferrer\">TUR syndrome – professional educational guide\u003c/a>\u003cp>British Association of Urological Surgeons · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Fachgesellschaftsseite lesbar; Entstehung und Symptome geprüft. Detaillierte Natriumkorrektur-Schemata dieser Seite wurden nicht übernommen; hierfür spezialisierter Nephrologiekonsens.\u003c/p>\u003c/li>\u003cli id=\"source-hyponatremia\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10904443/\" target=\"_blank\" rel=\"noopener noreferrer\">Konsensusempfehlungen zur Diagnose und Therapie der Hyponatriämie der Österreichischen Gesellschaft für Nephrologie 2024\u003c/a>\u003cp>Schwarz et al.; Wiener Klinische Wochenschrift 2024;136 Suppl 1:1–33 · 2024-02-29\u003c/p>\u003cp class=\"muted\">Originalkonsens frei zugänglich; Tonizität, Symptome und Überkorrekturrisiko geprüft. Kein selbst erfundener Korrekturalgorithmus.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/22-color.png","readingMinutes":9}]</script><script>const topics=JSON.parse(document.getElementById('topic-data').textContent);const published=['01'];const el=id=>document.getElementById(id);const latest=topics.find(t=>t.id===published.at(-1));el('morning-label').textContent='DEIN MORGENIMPULS · THEMA '+latest.id;el('morning-title').textContent=latest.title;let activeId=null,activeMode=null;function switchView(){show(activeMode==='guide'?'lesson':'guide',activeId)}function saveGuide(){const svg=el('content').querySelector('svg');if(!svg){const t=topics.find(x=>x.id===activeId);if(t?.guideImage){const a=document.createElement('a');a.href=t.guideImage;a.download='Pocketguide-'+activeId+'.png';a.click()}return;}const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1080;c.height=1920;c.getContext('2d').drawImage(img,0,0,1080,1920);URL.revokeObjectURL(url);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Pocketguide-'+activeId+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},'image/png')};img.src=url}function home(){document.body.classList.remove('guide-mode');activeId=null;activeMode=null;el('detail').hidden=true;el('home').hidden=false;window.scrollTo(0,0)}function show(mode,id){if(!published.includes(id))return;const t=topics.find(x=>x.id===id);activeId=id;activeMode=mode;document.body.classList.toggle('guide-mode',mode==='guide');el('download-guide').hidden=mode!=='guide';el('switch-view').textContent=mode==='guide'?'Fortbildung':'Pocketguide';el('home').hidden=true;el('detail').hidden=false;el('content').innerHTML='<h1>'+t.id+' · '+t.title+'</h1>'+(mode==='lesson'?'<p>'+t.readingMinutes+' Min. Lesezeit</p>'+t.lessonHtml:(t.guideSvg?'<section class="guide-display">'+t.guideSvg+'<div class="actions"><button onclick="saveGuide()">Pocketguide als PNG speichern</button><button onclick="show(\'lesson\',activeId)">Zur Fortbildung</button></div></section>':'<section class="guide-display"><img class="guide-image" src="'+t.guideImage+'" alt="Pocketguide '+t.title+'"><p><a class="btn" href="'+t.guideImage+'" download>Pocketguide speichern</a></p></section>'));window.scrollTo(0,0)}el('archive').innerHTML=published.slice().reverse().map(id=>{const t=topics.find(x=>x.id===id);return '<div class="topic"><p class="eyebrow">THEMA '+id+' · '+t.category+'</p><h3>'+t.title+'</h3><div class="actions"><button onclick="show(\'lesson\',\''+id+'\')">Fortbildung</button><button onclick="show(\'guide\',\''+id+'\')">Pocketguide</button></div></div>'}).join('');</script></body></html>
