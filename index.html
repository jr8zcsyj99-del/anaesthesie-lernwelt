apter-34\">\u003ch3>34. Welche Dokumentation ist sinnvoll?\u003c/h3>\u003cp>Relaxans mit Dosis/Zeit, Messgerät und Messort, Verlauf von TOF/PTC, Antagonist mit Dosis/Zeit sowie finale quantitative TOF-Ratio und klinische Extubationskriterien.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Strukturierte Übergabe an AWR.\u003c/p>\u003c/section>\u003csection id=\"chapter-35\">\u003ch3>35. Warum sollte bei Gesichtsmessung Vorsicht gelten?\u003c/h3>\u003cp>M. corrugator supercilii und M. orbicularis oculi reagieren anders als Adductor pollicis; sie können eine frühere Erholung suggerieren. Für finale Extubationsbeurteilung Daumen bevorzugen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach intraoperativer Gesichtsmessung rechtzeitig umplatzieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-36\">\u003ch3>36. Welche Rolle hat die Anästhesiepflege beim Monitoring?\u003c/h3>\u003cp>Elektroden korrekt anlegen, freie Bewegung/Signalqualität prüfen, Trends und Grenzwerte kommunizieren, Medikamentengaben dokumentieren und vor Extubation den quantitativen Erholungswert aktiv ansprechen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Team-Check: „TOF-Ratio am Daumen ≥0,9 bestätigt?“\u003c/p>\u003c/section>\u003csection id=\"chapter-37\">\u003ch3>37. Wie geht man mit einer unerwartet hohen TOF-Ratio &gt;1,0 um?\u003c/h3>\u003cp>Bei Akzeleromyographie können Ausgangswerte über 1,0 auftreten. Gerätespezifische Normalisierung und Kalibrierung beachten, Artefakte ausschließen; nicht allein auf eine unplausible Zahl vertrauen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Baseline und Gerätehandbuch berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-38\">\u003ch3>38. Warum ist Relaxometrie auch bei kurzen Eingriffen wichtig?\u003c/h3>\u003cp>Auch kurze Operationen und einzelne Relaxansboli können bei individueller Variabilität eine Restblockade hinterlassen. Zeit seit Gabe ist kein zuverlässiger Ersatz für Messung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ambulante Narkose: gleiche quantitative Sicherheitsprüfung.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-asa-nmb\">\u003ca href=\"https://doi.org/10.1097/ALN.0000000000004379\" target=\"_blank\" rel=\"noopener noreferrer\">2023 ASA Practice Guidelines for Monitoring and Antagonism of Neuromuscular Blockade\u003c/a>\u003cp>Thilen et al.; Anesthesiology 2023;138:13–41 · 2023\u003c/p>\u003cp class=\"muted\">Zugängliche Empfehlungen und Auszüge geprüft; kompletter Volltextzugang nicht bestätigt.\u003c/p>\u003c/li>\u003cli id=\"source-esaic-nmb\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/36377554/\" target=\"_blank\" rel=\"noopener noreferrer\">Peri-operative management of neuromuscular blockade – ESAIC guideline\u003c/a>\u003cp>Fuchs-Buder et al.; European Journal of Anaesthesiology 2023;40:82–94 · 2023\u003c/p>\u003cp class=\"muted\">Abstract und offizielle Leitlinienübersicht geprüft; kein vollständiger Volltext-Review.\u003c/p>\u003c/li>\u003cli id=\"source-bridion\">\u003ca href=\"https://www.medicines.org.uk/emc/product/6409/smpc\" target=\"_blank\" rel=\"noopener noreferrer\">Bridion 100 mg/ml – Summary of Product Characteristics\u003c/a>\u003cp>Herstellerinformation über electronic medicines compendium · 2025-05-19 laut emc\u003c/p>\u003cp class=\"muted\">Fachinformation frei lesbar; T2-, PTC- und Sofortaufhebungsszenario geprüft. UK-Fachinformation; lokal gültige deutsche Fachinformation hat Vorrang.\u003c/p>\u003c/li>\u003cli id=\"source-cisatracurium\">\u003ca href=\"https://www.medicines.org.uk/emc/product/1380/smpc\" target=\"_blank\" rel=\"noopener noreferrer\">Cisatracurium 2 mg/ml – Summary of Product Characteristics\u003c/a>\u003cp>Herstellerinformation über electronic medicines compendium · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Frei lesbar; Metabolisierung und Organabhängigkeit geprüft. UK-Information, kein Ersatz der lokal gültigen Fachinformation.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/13-color.png","readingMinutes":12},{"id":"14","title":"PEEP verständlich einsetzen","category":"Beatmung","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Eine Änderung wirkt auf Lungenvolumen, regionale Belastung und venösen Rückstrom. Erfolg darf nicht nur an einem einzelnen Sauerstoffwert bewertet werden.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>PEEP hält am Ende der Ausatmung einen positiven Atemwegsdruck aufrecht. Er kann den Kollaps rekrutierbarer Lungenbereiche verringern. Bereits offene Bereiche können bei zu hohem Druck überdehnt werden. Gleichzeitig kann erhöhter intrathorakaler Druck den venösen Rückstrom beeinträchtigen.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Nach einer Veränderung sind Oxygenierung, Compliance, Atemwegsdrücke und Hämodynamik gemeinsam zu beurteilen. Eine bessere SpO₂ allein beweist noch keinen Gesamtnutzen. Ein steigender Spitzenatemwegsdruck kann auch durch erhöhten Atemwegswiderstand entstehen.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>PEEP wird an Lungenzustand, Lagerung und Kreislauf angepasst. Rekrutierungsmanöver sind gezielte Interventionen und erfordern eine klare Indikation sowie die Beobachtung möglicher Nebenwirkungen. Bei Verschlechterung zuerst Ursachen prüfen und die Strategie neu bewerten.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Vorher-Nachher-Werte mit Zeitbezug dokumentieren. Hypotonie nach Druckänderung unmittelbar melden. Bei Umlagerung und Pneumoperitoneum erneute Beurteilung unterstützen. Beatmungsparameter nie isoliert aus einer einzigen Zahl ableiten.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>PEEP kann Areale stabilisieren und zugleich Kreislauf belasten.\u003c/li>\u003cli>Driving Pressure = Plateaudruck minus Gesamt-PEEP bei geeigneter Messung.\u003c/li>\u003cli>Eine bessere Oxygenierung ist nicht automatisch belegter klinischer Nutzen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Nach PEEP-Erhöhung verbessert sich die SpO₂, gleichzeitig fällt der Blutdruck.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Eine Änderung wirkt auf Lungenvolumen, regionale Belastung und venösen Rückstrom. Erfolg darf nicht nur an einem einzelnen Sauerstoffwert bewertet werden.\u003c/p>\u003cp>Positive End-Expiratory Pressure ist ein positiver Druck am Ende der Ausatmung. Er kann das endexspiratorische Lungenvolumen erhöhen und kleine Atemwege beziehungsweise Alveolen offen halten. Der eingestellte Atemwegsdruck entspricht nicht automatisch dem Druck über der Lunge allein.\u003c/p>\u003cp>Ein mathematisches Modell kann Beziehungen wie Druckhub und Compliance zeigen. Es berücksichtigt aber nicht alle regionalen Lungen- und Kreislaufeffekte. Daraus darf keine automatische individuelle PEEP-Empfehlung entstehen.\u003c/p>\u003cp>PEEP verändert gleichzeitig Lungenvolumen, Belastung und Kreislauf. Die Einstellung wird deshalb anhand mehrerer Ziele und der individuellen Reaktion beurteilt. Mehr Druck ist nicht automatisch mehr Sicherheit oder mehr klinischer Nutzen.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was bedeutet PEEP?\u003c/h3>\u003cp>Positive End-Expiratory Pressure ist ein positiver Druck am Ende der Ausatmung. Er kann das endexspiratorische Lungenvolumen erhöhen und kleine Atemwege beziehungsweise Alveolen offen halten. Der eingestellte Atemwegsdruck entspricht nicht automatisch dem Druck über der Lunge allein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Thoraxwand und Abdomen bei der Interpretation mitdenken.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Was unterscheidet PEEP und CPAP?\u003c/h3>\u003cp>PEEP bezeichnet den endexspiratorischen Druck innerhalb einer Beatmungsstrategie. CPAP beschreibt einen kontinuierlichen positiven Atemwegsdruck bei vorhandener Spontanatmung. Technische Systeme und Patientenarbeit unterscheiden sich, obwohl beide ein positives Druckniveau nutzen können.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Modus und Ziel nicht anhand einer ähnlichen Zahl gleichsetzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Warum kann PEEP die Oxygenierung verbessern?\u003c/h3>\u003cp>Das Offenhalten kollabierbarer Lungenbereiche kann den Shunt reduzieren und die Gasaustauschfläche erhöhen. Voraussetzung ist eine passende mechanische Reaktion. Eine Verbesserung der Oxygenierung kann auch durch andere Kreislauf- und Verteilungseffekte beeinflusst werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht jede SpO₂-Verbesserung als sichere Rekrutierung ausgeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was ist Rekrutierbarkeit?\u003c/h3>\u003cp>Sie beschreibt das Potenzial zuvor schlecht belüfteter Bereiche, durch geeignete Druckänderung wieder am Gasaustausch teilzunehmen. Sie ist individuell und verändert sich mit Krankheit, Lagerung und Zeit. Hoher PEEP hat ohne ausreichende Rekrutierbarkeit eher Überdehnungsrisiken.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wirkung und Nebenwirkung nach jeder Änderung neu prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Was ist Überdehnung?\u003c/h3>\u003cp>Bereits gut belüftete Areale werden übermäßig gedehnt, während andere Bereiche geschlossen bleiben können. Dadurch kann die mechanische Belastung steigen. Ein besserer globaler Sauerstoffwert allein schließt regional ungünstige Belastung nicht aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Druck, Compliance und Kreislauf zusätzlich zur Oxygenierung betrachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Warum kann PEEP den Blutdruck senken?\u003c/h3>\u003cp>Ein höherer intrathorakaler Druck kann den venösen Rückstrom und die rechtsventrikuläre Füllung vermindern. Veränderungen des pulmonalen Gefäßwiderstands können hinzukommen. Der Effekt hängt von Volumenstatus, Herzfunktion und Lungenmechanik ab.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Hypotonie nach Anpassung zeitlichen Zusammenhang sofort melden.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was unterscheidet eingestellten und Gesamt-PEEP?\u003c/h3>\u003cp>Neben dem extern eingestellten Druck kann am Ende der Ausatmung eingeschlossene Luft einen intrinsischen PEEP verursachen. Gesamt-PEEP muss unter geeigneten Bedingungen gemessen werden. Die Geräteeinstellung allein zeigt eine solche Luftfalle nicht immer an.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Exspirationsfluss und ausreichende Ausatemzeit prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Wie entsteht Auto-PEEP?\u003c/h3>\u003cp>Wenn die Ausatmung vor dem nächsten Atemzug nicht abgeschlossen ist, kann Gas eingeschlossen bleiben. Obstruktion, hohe Frequenz und ungünstiges Zeitverhältnis können beitragen. Dynamische Überblähung kann Beatmung und Kreislauf belasten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Exspiratorischen Flussverlauf bis zum nächsten Atemzug betrachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was bedeutet Driving Pressure?\u003c/h3>\u003cp>Unter geeigneten passiven statischen Messbedingungen ist sie Plateaudruck minus Gesamt-PEEP. Sie beschreibt den elastischen Druckhub des Atemsystems, nicht allein der Lunge. Spontanatmung, Messfehler und Thoraxwandmechanik begrenzen die Interpretation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Spitzendruck nicht als Plateaudruck einsetzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Wie lautet eine Lernrechnung zur Driving Pressure?\u003c/h3>\u003cp>Bei 25 cmH₂O Plateaudruck und 10 cmH₂O Gesamt-PEEP beträgt der Druckhub 15 cmH₂O. Dies ist ein Rechenbeispiel, keine allgemeine therapeutische Zielvorgabe. Die Qualität der statischen Messung ist Voraussetzung für sinnvolle Interpretation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Gesamt-PEEP und Messbedingungen zusammen dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Warum ist Compliance kein isoliertes Optimierungsziel?\u003c/h3>\u003cp>Sie kann Hinweise auf Rekrutierung oder Überdehnung liefern, hängt aber auch von Thoraxwand und Messbedingungen ab. Eine möglichst hohe Zahl garantiert weder optimale Oxygenierung noch einen klinischen Nutzen. Verschiedene physiologische Ziele müssen gegeneinander abgewogen werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Atemmechanik mit Perfusion und Patientensicherheit verbinden.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Was untersuchte PROBESE?\u003c/h3>\u003cp>Die randomisierte Studie verglich bei adipösen Erwachsenen zwei intraoperative Beatmungsstrategien: höherer PEEP mit Recruitment gegenüber niedrigerem PEEP ohne entsprechende Manöver. Sie untersuchte postoperative Lungenkomplikationen, nicht nur einen intraoperativen Sauerstoffwert. Die Strategie ist nicht allein ein PEEP-Test ohne weitere Unterschiede.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Population, Vergleichsgruppe und kombinierte Intervention beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Was ist die wichtige Evidenzgrenze aus PROBESE?\u003c/h3>\u003cp>Die höhere PEEP-Strategie zeigte keinen gesicherten Rückgang des primären Endpunkts postoperativer Lungenkomplikationen. Daraus folgt weder, dass jeder PEEP nutzlos ist, noch dass jede individuelle höhere Einstellung falsch wäre. Ein Studienprotokoll ersetzt keine individuelle Beatmungsentscheidung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Physiologische Verbesserung von belegtem Patientennutzen unterscheiden.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Warum ist ein Recruitment-Manöver nicht gleich PEEP?\u003c/h3>\u003cp>Recruitment versucht zeitweise kollabierte Areale zu eröffnen. PEEP soll unter anderem deren erneuten Verschluss beeinflussen. Ein Manöver kann ohne nachfolgende geeignete Stabilisierung kurz wirken; PEEP allein eröffnet nicht jedes geschlossene Areal.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eröffnung und Offenhalten als unterschiedliche Schritte verstehen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Wann ist besondere Kreislaufvorsicht nötig?\u003c/h3>\u003cp>Bei Hypovolämie, Rechtsherzbelastung und eingeschränkter hämodynamischer Reserve können Drucksteigerungen problematisch sein. Die Reaktion hängt vom konkreten Zustand ab. Ein standardisierter hoher Druck ohne Beurteilung kann instabile Patienten weiter gefährden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vor Änderung eine gemeinsame Einschätzung der Reserve einholen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Wie beeinflusst Lagerung den PEEP-Bedarf?\u003c/h3>\u003cp>Körperlage, pneumoperitonealer Druck und Thoraxwandbelastung verändern Atemmechanik und endexspiratorisches Volumen. Eine zuvor passende Einstellung kann nach Umlagerung anders wirken. Atemwegslage und Kreislauf verändern sich möglicherweise gleichzeitig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach großen Lagerungsänderungen alle relevanten Parameter erneut prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Warum ist PEEP kein Ersatz für Atemwegskontrolle?\u003c/h3>\u003cp>Ein geknickter Tubus, Sekret oder eine Fehlposition werden durch höheren PEEP nicht ursächlich behoben. Bei plötzlicher Verschlechterung müssen mechanische Ursachen rasch geprüft werden. Eine ungezielte Druckerhöhung kann das Problem verschärfen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Erst Sicherheitscheck, dann gezielte Beatmungsanpassung.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was wird bei einer PEEP-Anpassung dokumentiert?\u003c/h3>\u003cp>Ausgangswert, neuer Wert, Beatmungsmodus, Volumina, relevante Drücke, Oxygenierung und Blutdruckreaktion festhalten. So wird die physiologische Wirkung nachvollziehbar. Eine isolierte Einstellungsänderung ohne Wirkungskontrolle ist unvollständig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vorher-nachher-Vergleich im Verlauf sichern.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Wie werden Lernmodell und klinische Steuerung getrennt?\u003c/h3>\u003cp>Ein mathematisches Modell kann Beziehungen wie Druckhub und Compliance zeigen. Es berücksichtigt aber nicht alle regionalen Lungen- und Kreislaufeffekte. Daraus darf keine automatische individuelle PEEP-Empfehlung entstehen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Simulation ausdrücklich als vereinfachte Veranschaulichung kennzeichnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>PEEP verändert gleichzeitig Lungenvolumen, Belastung und Kreislauf. Die Einstellung wird deshalb anhand mehrerer Ziele und der individuellen Reaktion beurteilt. Mehr Druck ist nicht automatisch mehr Sicherheit oder mehr klinischer Nutzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Offenhalten unterstützen, Überdehnung und Kreislaufwirkung mitprüfen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-probese\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6582260/\" target=\"_blank\" rel=\"noopener noreferrer\">Effect of Intraoperative High PEEP With Recruitment Maneuvers vs Low PEEP … A Randomized Clinical Trial\u003c/a>\u003cp>PROBESE Collaborative Group; JAMA 2019;321:2292–2305 · 2019\u003c/p>\u003cp class=\"muted\">Frei zugängliche Originalstudie; Population, Vergleichsstrategie und Ergebnis geprüft. Keine individuelle PEEP-Verordnung.\u003c/p>\u003c/li>\u003cli id=\"source-oa-respiratory\">\u003ca href=\"https://www.openanesthesia.org/keywords/effects-of-anesthesia-on-the-respiratory-system/?search_term=anesthesia+brea\" target=\"_blank\" rel=\"noopener noreferrer\">Effects of Anesthesia on the Respiratory System\u003c/a>\u003cp>OpenAnesthesia / International Anesthesia Research Society · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Frei lesbarer Lehrartikel; eigenständige Zusammenfassung der Physiologie, keine Übernahme von Abbildungen oder geschützten Lehrbuchtexten.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/14-color.png","readingMinutes":9},{"id":"15","title":"Postoperative Übelkeit und Erbrechen","category":"Aufwachraum","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Die Vorbehandlung ist für eine sinnvolle Rescue-Auswahl entscheidend. Eine Dopplung ohne Prüfung ist keine automatisch wirksame Strategie.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Übelkeit und Erbrechen werden über mehrere zentrale und periphere Signalwege vermittelt. Daher kann eine Kombination unterschiedlicher Maßnahmen wirksamer sein als die Wiederholung eines einzigen Wirkprinzips.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Beim vereinfachten Apfel-Score für Erwachsene zählen weibliches Geschlecht, Nichtrauchen, frühere PONV beziehungsweise Reisekrankheit und geplanter postoperativer Opioideinsatz. Ein Score beschreibt ein Risiko, keine sichere Vorhersage für eine einzelne Person.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Anästhesieverfahren, Opioidbedarf und multimodale Antiemese werden vorausschauend geplant. Bei Beschwerden zuerst bereits verabreichte Mittel und Zeiten prüfen. Für Rescue wird bevorzugt eine bisher nicht verwendete Wirkstoffklasse berücksichtigt.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Übelkeit aktiv erfragen, Erbrechen und Wirkung der Therapie dokumentieren. Atemweg, Vigilanz, Kreislauf und Flüssigkeitshaushalt mitbeurteilen. Medikamentennebenwirkungen und Kontraindikationen, etwa QT-Probleme bei einzelnen Wirkstoffen, im Team abgleichen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Individuelles Risiko vorab erfassen und Prävention planen.\u003c/li>\u003cli>Rescue berücksichtigt bereits verwendete Wirkstoffklassen und Nebenwirkungen.\u003c/li>\u003cli>Übelkeit und Erbrechen getrennt dokumentieren; andere Ursachen prüfen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Im Aufwachraum tritt starke Übelkeit auf. Im Protokoll sind bereits mehrere prophylaktische Antiemetika eingetragen.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Die Vorbehandlung ist für eine sinnvolle Rescue-Auswahl entscheidend. Eine Dopplung ohne Prüfung ist keine automatisch wirksame Strategie.\u003c/p>\u003cp>Postoperative Nausea and Vomiting umfasst Übelkeit und Erbrechen nach einer Operation beziehungsweise Anästhesie. Beschwerden können Erholung, orale Aufnahme und Entlassung verzögern. Schwere Fälle erhöhen unter anderem das Risiko von Dehydratation und aspirationsrelevanten Situationen.\u003c/p>\u003cp>Bei einer Injektionslösung von 2 mg/ml entsprechen 4 mg rechnerisch 2 ml. Diese Rechnung ersetzt keine Verordnung und keine Prüfung der richtigen Ampulle. Eine andere Konzentration würde ein anderes Volumen erfordern.\u003c/p>\u003cp>PONV-Prävention beginnt mit Risikoeinschätzung und Basismaßnahmen. Bei Beschwerden zählen Ursachenprüfung, bekannte Vorbehandlung und passende Rescue-Strategie. Gute Dokumentation verhindert Doppelgaben und unterstützt die Weiterbehandlung.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was bedeutet PONV?\u003c/h3>\u003cp>Postoperative Nausea and Vomiting umfasst Übelkeit und Erbrechen nach einer Operation beziehungsweise Anästhesie. Beschwerden können Erholung, orale Aufnahme und Entlassung verzögern. Schwere Fälle erhöhen unter anderem das Risiko von Dehydratation und aspirationsrelevanten Situationen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Übelkeit systematisch erfragen, nicht nur sichtbares Erbrechen dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Welche Mechanismen sind beteiligt?\u003c/h3>\u003cp>Brechreiz entsteht durch vernetzte zentrale und periphere Signale. Verschiedene Rezeptorsysteme sind beteiligt, darunter serotonerge, dopaminerge und Neurokinin-vermittelte Wege. Deshalb können Medikamente unterschiedlicher Klassen ergänzend wirken, ohne dass eine einzelne Substanz jede Ursache abdeckt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Prophylaxe und Rescue nach Wirkstoffklasse dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Welche klassischen Erwachsenen-Risikofaktoren nennt der vereinfachte Apfel-Ansatz?\u003c/h3>\u003cp>Weibliches Geschlecht, Nichtraucherstatus, frühere PONV beziehungsweise Reisekrankheit und erwarteter postoperativer Opioidbedarf sind die vier klassischen Faktoren. Der Score ist eine populationsbezogene Einschätzung und kein individueller Vorhersagebeweis. Weitere klinische Faktoren bleiben relevant.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Risikofaktoren vor Anästhesiebeginn erfragen und weitergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Warum ist eine frühere PONV-Anamnese wichtig?\u003c/h3>\u003cp>Sie weist auf eine individuelle Anfälligkeit hin und kann die Präventionsplanung beeinflussen. Auch Reisekrankheit ist relevant. Fehlende frühere Beschwerden schließen PONV nicht aus, besonders wenn Verfahren und Medikamentenexposition diesmal anders sind.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Frühere erfolgreiche und erfolglose Antiemetika erfragen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Welche Bedeutung haben volatile Anästhetika und Opioide?\u003c/h3>\u003cp>Sie können das PONV-Risiko erhöhen. Ein opioidreduzierendes multimodales Analgesiekonzept und die Wahl des Anästhesieverfahrens können die Basisrisiken beeinflussen. Dies muss mit ausreichender Schmerztherapie und anderen klinischen Zielen vereinbar sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Schmerzbehandlung nicht aus Angst vor Übelkeit unzureichend durchführen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Was bedeutet multimodale Prophylaxe?\u003c/h3>\u003cp>Es werden mehrere geeignete Ansätze mit unterschiedlichen Mechanismen kombiniert. Dazu gehören Basisrisikoreduktion und medikamentöse Klassen. Anzahl und Auswahl richten sich nach Risiko, Kontraindikationen und lokalem Standard, nicht nach einer unüberprüften Universalliste.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bereits gegebene Substanzen und Zeitpunkte für den Aufwachraum sichtbar machen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Welche Quellenlage ist hier aktuell zu unterscheiden?\u003c/h3>\u003cp>Die vierte Konsensusleitlinie erschien 2020; eine fünfte Executive Summary wurde 2025 online und 2026 im Heft veröffentlicht. Die Existenz und Bibliografie der neueren Arbeit sind überprüfbar. Ohne vollständige Prüfung werden keine Details als neue Empfehlung dieser Ausgabe behauptet.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ältere und neuere Leitlinien nicht stillschweigend gleichsetzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Wie wirkt Ondansetron?\u003c/h3>\u003cp>Es antagonisiert 5-HT₃-Rezeptoren und wirkt antiemetisch. Wirkung, Zeitpunkt und Nebenwirkungen müssen im klinischen Kontext beurteilt werden. Es ersetzt keine Abklärung anderer Ursachen postoperativen Erbrechens wie Ileus, Hypotonie oder akute neurologische Probleme.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei unerwartet schwerem Verlauf nicht nur weitere Antiemetika nachgeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Welche Erwachsenendosis nennt die geprüfte Injektions-Fachinformation?\u003c/h3>\u003cp>Die überprüfte SmPC nennt 4 mg Ondansetron als einzelne intramuskuläre oder langsame intravenöse Gabe für PONV. Prophylaxe- und Therapiekontext sind beschrieben. Dies ist keine Übertragung auf Kinder oder ein Freibrief für wiederholte Gaben ohne Prüfung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Präparat, Applikationsweg, Vorbehandlung und Tagesgesamtdosis kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Warum ist QT-Verlängerung relevant?\u003c/h3>\u003cp>Ondansetron und andere Antiemetika können bei entsprechender Konstellation kardiale Risiken verstärken. Elektrolytstörungen, weitere QT-verlängernde Medikamente und angeborene Risiken müssen berücksichtigt werden. Die Auswahl richtet sich deshalb auch nach EKG und Vorerkrankungen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bekannte Rhythmusrisiken und Kalium-/Magnesiumstörungen weitergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Warum sind unterschiedliche Applikationswege nicht automatisch dosisgleich?\u003c/h3>\u003cp>Orale und intravenöse Anwendung unterscheiden sich in Resorption und Fachinformationsschema. Eine Dosis aus der Chemotherapietherapie ist keine PONV-Dosis. Ebenso sind Tablettenangaben nicht ohne Weiteres auf die Injektionslösung übertragbar.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Indikation und Darreichungsform vor Dosisvergleich prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Welche Rolle hat Dexamethason?\u003c/h3>\u003cp>Es wird im perioperativen Kontext zur PONV-Prävention eingesetzt. Bei der Beurteilung sind insbesondere Blutzuckerwirkung, Zeitpunkt und präparatspezifischer Zulassungsstatus wichtig. Eine allgemeine Lernkarte ersetzt keine lokale Dosis- und Indikationsvorgabe.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Diabetes und bereits erfolgte Steroidgabe im Team nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Was bedeutet Rescue-Therapie?\u003c/h3>\u003cp>Sie behandelt trotz Prophylaxe aufgetretene Beschwerden. Häufig wird eine geeignete andere Wirkstoffklasse als die bereits eingesetzte gewählt. Auswahl und Zeitpunkt berücksichtigen bisherige Gaben, Kontraindikationen und vermutete Ursachen. Eine Doppelgabe derselben Klasse ist nicht automatisch sinnvoll.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Anästhesieprotokoll vor Rescue-Gabe prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Welche Ursachen außer PONV sind bei Übelkeit wichtig?\u003c/h3>\u003cp>Hypotonie, starke Schmerzen, Hypoxämie, Medikamentennebenwirkungen und chirurgische Komplikationen können beitragen. Schwindel oder Bewusstseinsveränderung können zusätzliche Warnzeichen sein. Eine symptomatische Therapie darf die Ursachenabklärung nicht ersetzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vitalparameter und klinischen Kontext vor jeder weiteren Gabe erfassen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Was sind sinnvolle nichtmedikamentöse Pflegebeiträge?\u003c/h3>\u003cp>Ruhige Umgebung, geeignete Lagerung, Vermeidung unnötiger Bewegung und abgestimmter Kostaufbau können unterstützen. Der Patient sollte sich mitteilen können und eine sichere Möglichkeit zum Erbrechen haben. Maßnahmen ersetzen bei starkem Verlauf keine notwendige Therapie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Absaugung und Aspirationsschutz bei eingeschränkten Schutzreflexen mitdenken.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Warum ist Flüssigkeit individualisiert zu beurteilen?\u003c/h3>\u003cp>Dehydratation kann Beschwerden verstärken, aber Übelkeit beweist keinen Volumenmangel. Zu viel Flüssigkeit verursacht eigene Risiken. Kreislauf, orale Aufnahme, Verluste und Vorerkrankungen bestimmen die sinnvolle Strategie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keine automatische Infusion nur aufgrund des Symptoms ohne Beurteilung.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Wie wird die Schwere dokumentiert?\u003c/h3>\u003cp>Subjektive Übelkeit, Erbrechen, zeitlicher Verlauf, orale Verträglichkeit und Wirkung der Maßnahmen getrennt erfassen. Eine Person kann ohne Erbrechen stark belastet sein. Ein wiederholtes Ereignis nach anfänglicher Besserung muss weitergegeben werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Patientenperspektive und objektive Ereignisse kombinieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was ist vor ambulanter Entlassung wichtig?\u003c/h3>\u003cp>Beschwerdekontrolle, Flüssigkeitsaufnahme soweit vorgesehen und ein verständlicher Nachsorgeplan müssen zur Situation passen. Spätere Übelkeit und Erbrechen zu Hause sind möglich. Warnzeichen und erreichbare Ansprechstellen werden nach lokalem Verfahren erläutert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht nur einen kurzfristig ruhigen Moment als dauerhafte Beschwerdefreiheit dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was zeigt eine einfache Volumenrechnung?\u003c/h3>\u003cp>Bei einer Injektionslösung von 2 mg/ml entsprechen 4 mg rechnerisch 2 ml. Diese Rechnung ersetzt keine Verordnung und keine Prüfung der richtigen Ampulle. Eine andere Konzentration würde ein anderes Volumen erfordern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wirkstoffdosis in mg und Spritzenvolumen in ml getrennt abgleichen.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>PONV-Prävention beginnt mit Risikoeinschätzung und Basismaßnahmen. Bei Beschwerden zählen Ursachenprüfung, bekannte Vorbehandlung und passende Rescue-Strategie. Gute Dokumentation verhindert Doppelgaben und unterstützt die Weiterbehandlung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Risiko erkennen, vorbeugen, Wirkstoffklassen und Verlauf kennen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-ponv-fourth\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/32467512/\" target=\"_blank\" rel=\"noopener noreferrer\">Fourth Consensus Guidelines for the Management of Postoperative Nausea and Vomiting\u003c/a>\u003cp>Gan et al.; Anesthesia &amp; Analgesia 2020;131:411–448 · 2020\u003c/p>\u003cp class=\"muted\">Abstract und zugängliche Angaben geprüft. Historische Konsensusgrundlage; neuere fünfte Executive Summary separat gekennzeichnet.\u003c/p>\u003c/li>\u003cli id=\"source-ondansetron\">\u003ca href=\"https://www.medicines.org.uk/emc/product/13193/smpc\" target=\"_blank\" rel=\"noopener noreferrer\">Ondansetron 2 mg/ml solution for injection/infusion – SmPC\u003c/a>\u003cp>Herstellerinformation über electronic medicines compendium · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">PONV-Dosis und Darreichungsform im frei lesbaren Text geprüft. UK-Fachinformation; deutsche Präparatinformation und lokale SOP beachten.\u003c/p>\u003c/li>\u003cli id=\"source-ponv-fifth\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/41237407/\" target=\"_blank\" rel=\"noopener noreferrer\">Fifth Consensus Guidelines … Executive Summary\u003c/a>\u003cp>Gan et al.; Anesthesia &amp; Analgesia 2026;143:497–513 · Online 2025-11-14; Heft 2026-09-01\u003c/p>\u003cp class=\"muted\">Nur bibliografischer Eintrag geprüft; PubMed enthält kein Abstract. Keine neuen Detail-Empfehlungen aus dieser Arbeit abgeleitet.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/15-color.png","readingMinutes":9},{"id":"16","title":"Postoperativer Harnverhalt","category":"Aufwachraum","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Motorische Erholung und Blasenfunktion kehren nicht zwingend gleichzeitig zurück. Zeitlicher Verlauf und individueller Entleerungsplan verhindern unbemerkte Überdehnung.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Nach einer Operation können Anästhesie, neuraxiale Blockade und Medikamente die Blasenwahrnehmung und Entleerung beeinträchtigen. Eine sich füllende Blase verursacht deshalb nicht immer deutlichen Harndrang oder Schmerzen.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Zeitpunkt der letzten Miktion, Beschwerden, Eingriff und Risikofaktoren erfragen. Ein Bladderscan ergänzt die klinische Beurteilung. Fehlende Urinausscheidung kann auch durch geringe Urinproduktion oder bei liegendem Katheter durch Abflussprobleme entstehen.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Privatsphäre, geeignete Position und Mobilisation nach Freigabe unterstützen. Bei fehlender Entleerung nach lokalem Scan- und Eskalationsalgorithmus vorgehen. Katheterisierung ist bei entsprechender Indikation eine Entlastung, braucht aber keine pauschale Volumengrenze für alle.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Scanzeit, gemessenes Volumen, Symptome und Maßnahmen dokumentieren. Nach Katheterisierung Menge und Verlauf festhalten. Aseptische Durchführung, geschlossenes System und tägliche Prüfung der fortbestehenden Indikation reduzieren Katheterrisiken.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Eine volle Blase und geringe renale Urinproduktion sind verschiedene Probleme.\u003c/li>\u003cli>Bladderscan, Symptome und Füllungsverlauf gemeinsam beurteilen.\u003c/li>\u003cli>Keine universelle Kathetergrenze aus einer einzelnen Studie ableiten.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Nach Spinalanästhesie fehlt Harndrang. Ein Bladderscan zeigt zunehmende Füllung, obwohl die Beine wieder beweglich sind.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Motorische Erholung und Blasenfunktion kehren nicht zwingend gleichzeitig zurück. Zeitlicher Verlauf und individueller Entleerungsplan verhindern unbemerkte Überdehnung.\u003c/p>\u003cp>Die Blase kann nach einer Operation nicht ausreichend entleert werden, obwohl sie sich füllt. Ursache kann eine vorübergehende Störung von Wahrnehmung, Detrusorfunktion oder Abfluss sein. Eine große gefüllte Blase und fehlende Urinproduktion durch die Niere sind unterschiedliche Probleme.\u003c/p>\u003cp>Letzte spontane Miktion, Scanwerte mit Uhrzeit, Symptome, erhaltene Maßnahmen und entleerte Menge nennen. Nächste Kontrolle und Eskalationskriterien müssen klar sein. Bei ambulanten Patienten ist die lokale Entlassungsregel zu berücksichtigen.\u003c/p>\u003cp>Fehlende Ausscheidung kann eine volle oder eine leere Blase bedeuten. Objektive Beurteilung, zeitlicher Verlauf und individualisierte Maßnahmen verhindern sowohl Überdehnung als auch unnötige Katheterisierung. Die richtige Frage lautet zuerst, wo das Problem liegt.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was bedeutet postoperativer Harnverhalt?\u003c/h3>\u003cp>Die Blase kann nach einer Operation nicht ausreichend entleert werden, obwohl sie sich füllt. Ursache kann eine vorübergehende Störung von Wahrnehmung, Detrusorfunktion oder Abfluss sein. Eine große gefüllte Blase und fehlende Urinproduktion durch die Niere sind unterschiedliche Probleme.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blasenfüllung prüfen, bevor geringe Ausscheidung als Nierenproblem gewertet wird.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Wie funktioniert normale Miktion?\u003c/h3>\u003cp>Das autonome Nervensystem koordiniert Detrusorkontraktion und Entspannung des Auslasses. Bewusste Wahrnehmung und geeignete Umgebungsbedingungen unterstützen die Entleerung. Anästhesie, Schmerzen und Medikamente können verschiedene Teile dieses Zusammenspiels vorübergehend beeinflussen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht allein auf die Aussage kein Harndrang vertrauen.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Warum kann Spinalanästhesie Harnverhalt begünstigen?\u003c/h3>\u003cp>Die Blockade sakraler Nervenbahnen beeinflusst Blasenwahrnehmung und parasympathische Entleerungsfunktion. Motorische Erholung der Beine bedeutet nicht zwingend vollständige Erholung der Blasenfunktion. Der zeitliche Verlauf hängt von Verfahren und Wirkstoff ab.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blasenfunktion nach neuraxialem Verfahren gezielt weiter beobachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Welche Bedeutung haben Opioide?\u003c/h3>\u003cp>Sie können Wahrnehmung und neurale Steuerung der Miktion beeinträchtigen. Auch neuraxiale Opioide können relevant sein. Gleichzeitig kann unzureichend behandelter Schmerz die Entleerung erschweren. Die Gesamtstrategie muss deshalb ausgewogen sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Medikamentenart und Applikationsweg bei der Risikobeurteilung nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Welche weiteren Faktoren erhöhen das Risiko?\u003c/h3>\u003cp>Vorbekannte Entleerungsstörung, bestimmte Operationen, längere Dauer, hohe Flüssigkeitszufuhr und individuelles Blasenvolumen können beitragen. Alter und Begleitmedikation spielen ebenfalls eine Rolle. Eine einzelne Risikoeigenschaft ist kein sicherer Nachweis eines Harnverhalts.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Präoperative Miktionsanamnese und letzte Entleerung erfassen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Warum ist fehlender Schmerz kein Ausschluss?\u003c/h3>\u003cp>Anästhesie und Analgesie können Füllungsgefühl und Beschwerden abschwächen. Eine übervolle Blase kann deshalb zunächst unbemerkt bleiben. Bei Risikokonstellationen ist eine geplante objektive Kontrolle sinnvoller als das Warten auf starke Schmerzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Symptome und objektiven Füllungsbefund gemeinsam beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Welche Aufgabe hat der Bladderscan?\u003c/h3>\u003cp>Er schätzt das Blasenvolumen nichtinvasiv und unterstützt die Entscheidung über weitere Maßnahmen. Anwendung, Position, Anatomie und technische Grenzen beeinflussen den Wert. Ein unplausibler Befund wird geprüft und gegebenenfalls anderweitig bestätigt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Geräteanleitung und korrekte Positionierung beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Warum gibt es keine universelle Kathetergrenze?\u003c/h3>\u003cp>Individuelle Blasenkapazität, Symptome, Füllungsgeschwindigkeit und klinischer Kontext unterscheiden sich. Studien untersuchten verschiedene Strategien in definierten Gruppen. Ein einzelner Schwellenwert aus einer Studie darf nicht als allgemeine Sicherheitsgrenze für alle Patienten gelten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Lokalen Algorithmus mit individuellem Risiko verbinden.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was untersuchte die Studie zur individuellen Blasenkapazität?\u003c/h3>\u003cp>Die randomisierte Untersuchung verglich eine kapazitätsbezogene Strategie mit einer festen Grenze bei Erwachsenen ohne Dauerkatheter. Sie zeigte eine Reduktion von Katheterisierungen im untersuchten Setting. Daraus folgt keine unbegrenzte sichere Wartezeit bei symptomatisch großer Blase.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Studienpopulation und Messprotokoll vor Übertragung beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Warum ist die Dauer der Überdehnung wichtig?\u003c/h3>\u003cp>Nicht nur die aktuelle Volumenschätzung, sondern auch Dauer und Verlauf der Füllung können das Risiko beeinflussen. Längeres unbemerktes Überdehnen kann die Funktion gefährden. Ein einmaliger Messwert ohne Zeitbezug ist unvollständig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Geplanten Kontrollzeitpunkt und letzte Miktion dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Wie unterscheiden sich Harnverhalt und Oligurie?\u003c/h3>\u003cp>Beim Harnverhalt sammelt sich Urin in einer nicht ausreichend entleerten Blase. Bei geringer renaler Produktion kann die Blase leer bleiben. Zusätzlich können Katheterobstruktion oder Messfehler vorliegen. Die Ursachen verlangen unterschiedliche Maßnahmen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blasenbefund, Katheter und Kreislauf gemeinsam prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Welche einfachen Maßnahmen können unterstützen?\u003c/h3>\u003cp>Privatsphäre, geeignete Position, Mobilisation im sicheren Rahmen und angemessene Schmerztherapie können helfen. Sie dürfen bei erheblicher Überfüllung oder klinischer Verschlechterung eine notwendige Entlastung nicht verzögern. Vorgehen und Beobachtungszeit sind festzulegen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach einem Versuch Erfolg und Restvolumen kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Wann wird ärztlich eskaliert?\u003c/h3>\u003cp>Bei ausgeprägter Füllung, Beschwerden, erfolgloser Entleerung oder ungünstigem Verlauf entsprechend lokalem Algorithmus. Neurologische Auffälligkeiten, Hämaturie oder schwierige Katheterisierung sind zusätzliche Gründe. Unklare Situationen brauchen gezielte Beurteilung statt beliebiger Wiederholungsversuche.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Aktuellen Scanwert, Verlauf und Symptome konkret mitteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Was ist bei intermittierender Katheterisierung wichtig?\u003c/h3>\u003cp>Indikation, aseptisches Vorgehen, geeignete Größe und atraumatische Technik beachten. Widerstand oder starke Schmerzen sind kein Anlass für gewaltsames Vorschieben. Entleerte Menge und weitere Überwachung werden dokumentiert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Problemen rechtzeitig stoppen und erfahrene Unterstützung anfordern.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Warum ist ein Dauerkatheter nicht automatisch die beste Lösung?\u003c/h3>\u003cp>Er erleichtert bestimmte Überwachungsaufgaben, verursacht aber eigene Risiken wie Infektion, Trauma und eingeschränkte Mobilität. Die Indikation muss bestehen und regelmäßig überprüft werden. Vermeidung unnötiger Katheter ist Teil guter Versorgung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Entfernungskriterium und geplanten Zeitpunkt festlegen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Was wird nach Entlastung beobachtet?\u003c/h3>\u003cp>Beschwerden, Urinmenge, erneute Entleerungsfähigkeit und klinischer Zustand weiter beurteilen. Bei besonderer Konstellation können engmaschige Bilanz- und Elektrolytkontrollen nötig sein. Eine einmalig erfolgreiche Entlastung garantiert keine sofortige vollständige Normalisierung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Plan für erneuten Scan oder Miktionsversuch weitergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Welche Medikamente außer Opioiden können beitragen?\u003c/h3>\u003cp>Anticholinerge Wirkungen und weitere pharmakologische Einflüsse können die Blasenentleerung stören. Die konkrete Bedeutung hängt von Substanz, Dosis und Patient ab. Medikamentenänderungen erfolgen nach ärztlicher Bewertung; keine eigenständige pauschale Absetzung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vollständige perioperative Medikamentenliste berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Wie wird ein Restvolumen eingeordnet?\u003c/h3>\u003cp>Es wird nach einem Miktionsversuch im Zusammenhang mit Ausgangsfüllung, entleerter Menge und Symptomen bewertet. Eine Zahl allein beweist nicht jede Form von Abflussstörung. Messzeitpunkt und Methode müssen stimmen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Vor und nach Entleerung klar unterscheiden.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was gehört in die Übergabe?\u003c/h3>\u003cp>Letzte spontane Miktion, Scanwerte mit Uhrzeit, Symptome, erhaltene Maßnahmen und entleerte Menge nennen. Nächste Kontrolle und Eskalationskriterien müssen klar sein. Bei ambulanten Patienten ist die lokale Entlassungsregel zu berücksichtigen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine fehlende Miktionsangabe nicht stillschweigend als unauffällig werten.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Fehlende Ausscheidung kann eine volle oder eine leere Blase bedeuten. Objektive Beurteilung, zeitlicher Verlauf und individualisierte Maßnahmen verhindern sowohl Überdehnung als auch unnötige Katheterisierung. Die richtige Frage lautet zuerst, wo das Problem liegt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Füllung messen, Verlauf beachten, Entleerung sicher unterstützen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-bladder-rct\">\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/25371036/\" target=\"_blank\" rel=\"noopener noreferrer\">Postoperative bladder catheterization based on individual bladder capacity: a randomized trial\u003c/a>\u003cp>Brouwer et al.; Anesthesiology 2015;122:46–54 · 2015\u003c/p>\u003cp class=\"muted\">Abstract über Suchabruf lesbar; Population und Vergleich geprüft, kein vollständiger Volltextzugang behauptet.\u003c/p>\u003c/li>\u003cli id=\"source-bladder-observation\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7784306/\" target=\"_blank\" rel=\"noopener noreferrer\">Postoperative urinary retention: risk factors, bladder filling rate and time to catheterization\u003c/a>\u003cp>Originaluntersuchung als Teil einer randomisierten Studie; Perioperative Medicine · 2021\u003c/p>\u003cp class=\"muted\">Frei zugängliche Originaluntersuchung; zusätzliche Risikoeinordnung. Kein allgemeiner Katheterschwellenwert aus dem Ergebnis abgeleitet.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/16-color.png","readingMinutes":9},{"id":"17","title":"Postoperatives Delir","category":"Aufwachraum","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Hypoaktivität darf nicht automatisch als normale Müdigkeit eingeordnet werden. Ausgangszustand und reversible Ursachen sind zentrale Informationen.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Ein Delir ist eine akut einsetzende, oft schwankende Störung von Aufmerksamkeit und Kognition. Es kann hyperaktiv mit Unruhe oder hypoaktiv mit Rückzug und verminderter Reaktion auftreten. Eine bestehende Demenz schließt ein zusätzliches Delir nicht aus.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Ausgangszustand und Verlauf mit Patient und Bezugspersonen vergleichen. Neue Desorientierung, Konzentrationsprobleme, veränderter Schlaf und ungewöhnliche Passivität sind Hinweise. Schmerz, Hypoxämie, Infektion, Medikamente und Harnverhalt können behandelbare Mitursachen sein.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Bei Verdacht Ursachen suchen und ein geeignetes Screening anwenden. NICE nennt den 4AT außerhalb spezieller Bereiche; im Aufwachraum beziehungsweise auf Intensivstation werden CAM-ICU oder ICDSC berücksichtigt. Ein positiver Befund verlangt klinische Abklärung.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Ruhig orientieren, Brille und Hörhilfe verfügbar machen, Schlaf unterstützen und sichere Mobilisation fördern. Schmerzen behandeln lassen, Flüssigkeits- und Ernährungsbedarf beachten. Auffälligkeiten und Verlauf strukturiert übergeben.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Akute Aufmerksamkeitsstörung und Fluktuation erkennen.\u003c/li>\u003cli>Auch ein stiller Patient kann delirant sein.\u003c/li>\u003cli>Ursachen behandeln, Orientierung unterstützen und wiederholt screenen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Eine zuvor selbstständig orientierte Person ist nach der Operation auffällig still und kann einem Gespräch nicht folgen.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Hypoaktivität darf nicht automatisch als normale Müdigkeit eingeordnet werden. Ausgangszustand und reversible Ursachen sind zentrale Informationen.\u003c/p>\u003cp>Ein akut auftretendes und häufig schwankendes Syndrom mit Störung von Aufmerksamkeit und weiteren kognitiven Funktionen. Es entwickelt sich im Zusammenhang mit Operation und vulnerabler Ausgangslage. Es ist nicht gleichbedeutend mit Demenz und wird nicht allein durch Unruhe definiert.\u003c/p>\u003cp>Ausgangszustand, Risikofaktoren, Screeningergebnisse, Fluktuation, vermutete Ursachen und Maßnahmen dokumentieren. Auch Schlaf, Schmerz, Sinneshilfen und auffällige Medikamentenwirkungen nennen. Ein Etikett wie verwirrt allein ist zu unspezifisch.\u003c/p>\u003cp>Delir ist ein akutes Warnsignal des Gehirns und oft multifaktoriell. Aufmerksamkeit, Verlauf und Ausgangszustand sind wichtiger als die bloße Lautstärke des Verhaltens. Prävention, Ursachenbehandlung und pflegerische Orientierung gehören zusammen.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was ist ein postoperatives Delir?\u003c/h3>\u003cp>Ein akut auftretendes und häufig schwankendes Syndrom mit Störung von Aufmerksamkeit und weiteren kognitiven Funktionen. Es entwickelt sich im Zusammenhang mit Operation und vulnerabler Ausgangslage. Es ist nicht gleichbedeutend mit Demenz und wird nicht allein durch Unruhe definiert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Veränderungen gegenüber dem persönlichen Ausgangszustand erfragen.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Was bedeutet fluktuierender Verlauf?\u003c/h3>\u003cp>Ausprägung und Symptome können über Stunden wechseln. Eine Person kann bei einer Untersuchung orientiert wirken und später deutlich auffällig sein. Eine einzelne unauffällige Begegnung schließt ein Delir deshalb nicht sicher aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wiederholtes Screening und Verlaufsmeldungen sind wichtig.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Was ist ein hypoaktives Delir?\u003c/h3>\u003cp>Der Patient wirkt still, verlangsamt oder schläfrig statt unruhig. Diese Form kann leicht übersehen werden. Verminderte Interaktion ist nicht automatisch normale Erschöpfung. Aufmerksamkeit und Akutveränderung müssen gezielt geprüft werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Auch ruhige Patienten aktiv beobachten und screenen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Wie unterscheidet sich Delir von Demenz?\u003c/h3>\u003cp>Demenz beschreibt typischerweise einen längerfristigen kognitiven Verlauf; Delir tritt akut und fluktuierend auf. Beides kann zusammen bestehen. Eine vorbestehende kognitive Einschränkung erhöht die Vulnerabilität und erschwert die Erkennung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Angehörige oder Vorbefunde zum Ausgangszustand nutzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Welche prädisponierenden Faktoren sind relevant?\u003c/h3>\u003cp>Höheres Alter, kognitive Einschränkung, Frailty und weitere Erkrankungen können die Reserve vermindern. Diese Faktoren sind nicht alle veränderbar, helfen aber bei der Präventionsplanung. Risiko bedeutet nicht, dass ein Delir unvermeidlich wäre.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Risikoinformation im gesamten perioperativen Team teilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Welche auslösenden Faktoren sind behandelbar?\u003c/h3>\u003cp>Schmerz, Hypoxämie, Infektion, Kreislaufprobleme, Medikamente, Schlafstörung und Sinnesdeprivation können beitragen. Häufig wirken mehrere Faktoren zusammen. Die Behandlung benötigt deshalb eine strukturierte Ursachensuche statt ausschließlich symptomdämpfender Medikation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> ABCDE und reversible Ursachen früh prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was empfiehlt die ESAIC grundsätzlich zur Prävention?\u003c/h3>\u003cp>Risikoeinschätzung und nichtmedikamentöse Multikomponentenmaßnahmen haben hohen Stellenwert. Dazu gehören ein abgestimmter perioperativer Plan und die Optimierung behandelbarer Faktoren. Einzelmaßnahmen sind in einen Gesamtablauf einzubetten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Prävention bereits vor der Operation beginnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Rolle haben Brille und Hörgerät?\u003c/h3>\u003cp>Sie verbessern Orientierung und Kommunikation, wenn sie sicher verwendet werden können. Fehlende Sinneshilfen können Verunsicherung verstärken. Ihre Bereitstellung ist ein konkreter pflegerischer Beitrag, ersetzt aber keine Ursachenbehandlung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Aufbewahrung und Rückgabe der persönlichen Hilfsmittel organisieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Warum sind Tagesstruktur und Schlaf wichtig?\u003c/h3>\u003cp>Orientierungsreize am Tag und eine möglichst störungsarme Nacht unterstützen den Rhythmus. Lärm, unnötige nächtliche Unterbrechungen und fehlendes Tageslicht können belasten. Erforderliche Überwachung bleibt trotzdem gesichert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Pflegehandlungen bündeln, soweit klinisch vertretbar.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Wie hängen Schmerz und Delir zusammen?\u003c/h3>\u003cp>Unzureichend behandelter Schmerz kann Stress und Verwirrtheit fördern. Gleichzeitig können übermäßige sedierende Medikamentenwirkungen Probleme verstärken. Eine angemessene multimodale Analgesie mit wiederholter Wirkungskontrolle ist deshalb wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Schmerz auch bei eingeschränkter Kommunikation strukturiert beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Was ist der Zweck eines validierten Screenings?\u003c/h3>\u003cp>Es unterstützt ein wiederholbares Erkennen auffälliger Aufmerksamkeit und Kognition. Das Instrument muss zur Patientensituation passen und korrekt angewendet werden. Ein Screening ist keine vollständige Ursachenabklärung und ersetzt keine klinische Diagnose.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Lokales Instrument und Schulungsvorgaben nutzen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum ist tiefe Sedierung bei der Beurteilung wichtig?\u003c/h3>\u003cp>Sedierungsgrad beeinflusst die Durchführbarkeit und Aussagekraft eines Delirscreenings. Eine nicht weckbare Person kann nicht wie eine aufmerksam kommunizierende Person getestet werden. Sedierung und Delir werden deshalb getrennt erfasst.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Voraussetzungen des jeweiligen Screeningverfahrens beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Welche Bedeutung hat EEG-Monitoring?\u003c/h3>\u003cp>Die ESAIC diskutiert EEG-basierte Überwachung im Zusammenhang mit Anästhesietiefe und Delirprävention. Ein Index allein bildet die komplexe Hirnfunktion nicht vollständig ab. Artefakte, Rohsignal und Hinweise auf ausgeprägte Suppression gehören in die fachliche Interpretation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht aus einem einzelnen Index eine Delirdiagnose ableiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Sind Benzodiazepine eine allgemeine Delirtherapie?\u003c/h3>\u003cp>Nein. Für das gewöhnliche postoperative Delir werden sie nicht routinemäßig empfohlen. Besondere Situationen wie Alkohol- oder Benzodiazepinentzug verlangen eine andere Beurteilung. Ein pauschales Verbot für jede Ursache von Unruhe wäre ebenso falsch.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Entzugskontext und bisherige Dauertherapie ausdrücklich nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Wann kommen antipsychotische Medikamente infrage?\u003c/h3>\u003cp>Bei ausgeprägter Belastung oder Gefährdung kann nach Ursachenbehandlung und nichtmedikamentösen Maßnahmen eine ärztliche symptomorientierte Entscheidung erforderlich sein. QT-Risiko, neurologische Vorerkrankungen und Zulassungsstatus sind wichtig. Die Medikation behandelt nicht automatisch die zugrunde liegende Ursache.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keine routinemäßige prophylaktische Gabe aus einer Lernkarte ableiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Warum ist Dexmedetomidin kein pauschaler Delirschutz?\u003c/h3>\u003cp>Nutzen und Risiken hängen von Population, Anwendung und Dosis ab. Bradykardie und Hypotonie sind relevante Risiken. Die ESAIC betont die Nutzen-Risiko-Abwägung; widersprüchliche Daten dürfen nicht als sichere allgemeine Empfehlung dargestellt werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Individuelle Entscheidung und kontinuierliche Kreislaufbeobachtung beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Wie wird eine akut unruhige Person sicher begleitet?\u003c/h3>\u003cp>Ruhig sprechen, Orientierung anbieten und behandelbare Beschwerden prüfen. Umgebung und personelle Unterstützung anpassen. Freiheitsbeschränkende Maßnahmen haben Risiken und unterliegen strengen lokalen sowie rechtlichen Voraussetzungen; sie sind keine Standardantwort auf Verwirrtheit.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Deeskalation und Hilfe früh organisieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Welche Bedeutung haben Angehörige?\u003c/h3>\u003cp>Sie können Ausgangszustand, Gewohnheiten und Veränderungen beschreiben und Orientierung unterstützen. Einbeziehung erfolgt passend zur Situation und zum Wunsch des Patienten. Angehörige ersetzen keine professionelle Überwachung, können aber wichtige Informationen liefern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Konkret fragen, was im Vergleich zum Alltag neu ist.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Was gehört in die Übergabe?\u003c/h3>\u003cp>Ausgangszustand, Risikofaktoren, Screeningergebnisse, Fluktuation, vermutete Ursachen und Maßnahmen dokumentieren. Auch Schlaf, Schmerz, Sinneshilfen und auffällige Medikamentenwirkungen nennen. Ein Etikett wie verwirrt allein ist zu unspezifisch.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nächsten Screeningzeitpunkt und offene Diagnostik klar zuordnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Delir ist ein akutes Warnsignal des Gehirns und oft multifaktoriell. Aufmerksamkeit, Verlauf und Ausgangszustand sind wichtiger als die bloße Lautstärke des Verhaltens. Prävention, Ursachenbehandlung und pflegerische Orientierung gehören zusammen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Auch der stille Patient kann ein Delir haben.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-delirium\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10763721/\" target=\"_blank\" rel=\"noopener noreferrer\">Update of the ESAIC evidence-based and consensus-based guideline on postoperative delirium in adult patients\u003c/a>\u003cp>Aldecoa et al.; European Journal of Anaesthesiology 2024;41:81–108 · Online 2023; Heft 2024\u003c/p>\u003cp class=\"muted\">Originalleitlinie frei lesbar; relevante Präventions- und Therapieabschnitte geprüft.\u003c/p>\u003c/li>\u003cli id=\"source-delirium-german\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11164714/\" target=\"_blank\" rel=\"noopener noreferrer\">Aktualisierte ESAIC-Leitlinie zum postoperativen Delir beim Erwachsenen\u003c/a>\u003cp>Söhle und Coburn; Die Anaesthesiologie 2024;73:376–378 · 2024\u003c/p>\u003cp class=\"muted\">Deutsche fachliche Einordnung frei zugänglich; ergänzend, keine neue eigenständige Leitlinie.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/17-color.png","readingMinutes":9},{"id":"18","title":"Pulmonale Aspiration","category":"Atemweg","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Partikelobstruktion, chemische Reizung und spätere Infektion sind unterschiedliche Probleme. Der Verlauf bestimmt die weitere Diagnostik und Unterstützung.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Regurgitation beschreibt den Rückfluss von Mageninhalt; Aspiration den Eintritt von Material in die Atemwege. Säure kann eine chemische Lungenschädigung verursachen, Partikel können verlegen. Eine bakterielle Pneumonie ist davon zu unterscheiden.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Sichtbares Material im Rachen, Husten, Hypoxämie, Bronchospasmus oder erhöhte Beatmungsdrücke können Hinweise sein. Unter Narkose kann das Ereignis zunächst unbemerkt bleiben. Eine anfangs unauffällige Oxygenierung schließt einen späteren Verlauf nicht aus.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Hilfe rufen, Absaugung ermöglichen und Atemweg durch das qualifizierte Team sichern. Oxygenierung und Beatmung haben Vorrang. Bei klinisch relevanter Aspiration wird die Indikation zur Bronchoskopie beurteilt. Weiteres Vorgehen und Überwachung richten sich nach dem Gasaustausch und Verlauf.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Funktionierende großlumige Absaugung vor Risikoeinleitung bereithalten. Material, Zeitpunkt, Beatmungswerte und Maßnahmen dokumentieren. Nach dem Ereignis Änderungen von Oxygenierung und Atemarbeit gezielt überwachen und übergeben.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Regurgitation und Eintritt in den Atemweg unterscheiden.\u003c/li>\u003cli>Absaugung, Oxygenierung und Atemwegsstrategie früh vorbereiten.\u003c/li>\u003cli>Nicht jedes Aspirationsereignis erfordert routinemäßig Antibiotika.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Bei Einleitung wird Mageninhalt im Rachen sichtbar. Anschließend verschlechtern sich Oxygenierung und Atemmechanik.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Partikelobstruktion, chemische Reizung und spätere Infektion sind unterschiedliche Probleme. Der Verlauf bestimmt die weitere Diagnostik und Unterstützung.\u003c/p>\u003cp>Material aus Mund, Rachen oder oberem Verdauungstrakt gelangt in die unteren Atemwege. Folgen hängen von Menge, Zusammensetzung, Partikeln und Patientensituation ab. Das Ereignis kann mechanische Obstruktion, chemische Entzündung und später gegebenenfalls eine Infektion verursachen.\u003c/p>\u003cp>Zeitpunkt, Material, beobachtete Regurgitation beziehungsweise Aspiration, Maßnahmen, Bronchoskopie, Gasaustausch und weitere Überwachung nennen. Verdacht und gesicherte Beobachtung getrennt dokumentieren. Auch noch ausstehende Befunde und Eskalationskriterien festlegen.\u003c/p>\u003cp>Aspiration ist ein Ereignis mit verschiedenen möglichen Folgen. Sichere Vorbereitung, sofortige Atemwegs- und Oxygenierungsmaßnahmen sowie Verlaufsbeobachtung sind entscheidend. Eine Infektion ist nicht automatisch bereits im Moment des Ereignisses vorhanden.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was ist pulmonale Aspiration?\u003c/h3>\u003cp>Material aus Mund, Rachen oder oberem Verdauungstrakt gelangt in die unteren Atemwege. Folgen hängen von Menge, Zusammensetzung, Partikeln und Patientensituation ab. Das Ereignis kann mechanische Obstruktion, chemische Entzündung und später gegebenenfalls eine Infektion verursachen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Regurgitation und tatsächlichen Eintritt in den Atemweg unterscheiden.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Was unterscheidet Pneumonitis von Aspirationspneumonie?\u003c/h3>\u003cp>Pneumonitis bezeichnet eine primär chemisch bedingte Entzündungsreaktion, etwa durch Magensaft. Eine Aspirationspneumonie ist eine infektiöse Erkrankung. Klinisch können sich Zeichen überschneiden; die zeitliche Entwicklung und Befunde sind wichtig. Nicht jedes Ereignis ist sofort eine bakterielle Pneumonie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den Verdacht und den Verlauf präzise dokumentieren.\u003c/p>\u00
