<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123B46"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/clinical-180.png"><link rel="icon" href="icons/clinical-192.png"><title>Anästhesie Lernwelt</title><link rel="stylesheet" href="styles.css?v=1.1.1"><style>.hero{background:#fff;border-left:5px solid #438d79}.topic{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0}.btn{display:inline-block;padding:10px 16px;border:1px solid #a9c4c4;border-radius:12px}footer{text-align:center;padding:24px;color:var(--muted)}img{max-width:100%;height:auto;display:block;margin:auto;border-radius:18px}article{padding:0;border:0;background:transparent}article>h1{font-size:clamp(1.8rem,6vw,3rem)}#detail>.backbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;justify-content:space-between;background:#f0f5f5;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #d7e5e4}.guide-mode main.wrap{max-width:none;padding:0;margin:0}.guide-mode header,.guide-mode footer,.guide-mode #content>h1{display:none}.guide-mode #content{margin:0;padding:0;width:100%}.guide-mode .guide-display{width:100%;max-width:100%;margin:0;padding:0;border:0;border-radius:0;background:white}.guide-mode .guide-display>svg,.guide-mode .guide-display>img{display:block;width:100%;height:auto;max-width:none;border-radius:0;box-shadow:none}.guide-mode .guide-display>.actions{padding:12px;margin:0;justify-content:center}.guide-mode .guide-display>p{padding:12px}.detail-bottom{display:flex;justify-content:center;padding:16px 12px calc(20px + env(safe-area-inset-bottom))}@media(min-width:650px){.guide-mode .guide-display>svg,.guide-mode .guide-display>img{max-width:540px;margin:auto}} </style></head><body><header><div class="wrap"><p class="eyebrow">MORNING EDITION · CLINICAL MEDICAL ACADEMY</p><h1>Anästhesie<br>Lernwelt.</h1><p>Wissen verstehen. Im Team sicher handeln.</p></div></header><main class="wrap"><div id="home"><section class="hero"><p class="eyebrow" id="morning-label"></p><h2 id="morning-title"></h2><p>Deine Fortbildung für den Morgen – mit klinischem Praxisbezug und kompaktem Pocketguide.</p><div class="actions"><button class="primary" onclick="show('lesson',published.at(-1))">Fortbildung lesen</button><button onclick="show('guide',published.at(-1))">Pocketguide</button></div></section><h2>Themenarchiv</h2><div id="archive"></div></div><div id="detail" hidden><div class="backbar"><button onclick="home()">← Startseite</button><button id="download-guide" hidden onclick="saveGuide()">↓ PNG speichern</button><button id="switch-view" onclick="switchView()"></button></div><article class="lesson-body" id="content"></article><div class="detail-bottom"><button onclick="home()">← Zurück zur Startseite</button></div></div></main><footer>Fortbildungswissen · Keine klinisch freigegebene SOP.</footer><script id="topic-data" type="application/json">[{"id":"01","title":"Perioperative Anaphylaxie","category":"Notfälle","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Die zeitliche Nähe zu einer Exposition ist ein Hinweis, kein Allergiebeweis. Kardiorespiratorisches Muster, Differenzialdiagnosen und unmittelbare Reaktion müssen gemeinsam beurteilt werden.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection>\u003ch2>Anatomie und normale Physiologie\u003c/h2>\u003cp>Mastzellen liegen unter anderem im Bindegewebe nahe Gefäßen und Schleimhäuten. Basophile zirkulieren im Blut. Das Endothel kleidet die Gefäße aus und reguliert den Flüssigkeitsaustausch. Arteriolen bestimmen wesentlich den systemischen Gefäßwiderstand, Venen dienen als Volumenreservoir. In der Lunge reguliert die glatte Bronchialmuskulatur den Atemwegswiderstand.\u003c/p>\u003cp>Der arterielle Mitteldruck hängt näherungsweise vom Herzzeitvolumen und systemischen Gefäßwiderstand ab. Das Herzzeitvolumen ist das Produkt aus Herzfrequenz und Schlagvolumen. Sinkt der venöse Rückstrom, kann das Schlagvolumen abnehmen. Die Sauerstoffversorgung hängt zusätzlich von der Oxygenierung und dem Hämoglobingehalt ab.\u003c/p>\u003csvg viewBox=\"0 0 340 290\" role=\"img\" aria-label=\"Anaphylaxie: Gefäße und Atemwege\" style=\"width:100%;height:auto\">\u003crect width=\"340\" height=\"290\" rx=\"16\" fill=\"#eef5f5\"/>\u003cg font-family=\"system-ui\" font-size=\"12\" fill=\"#123b46\">\u003ctext x=\"18\" y=\"25\" font-weight=\"bold\">Gefäß und Kapillarleck\u003c/text>\u003crect x=\"18\" y=\"44\" width=\"140\" height=\"45\" rx=\"20\" fill=\"#e6aaa8\" stroke=\"#a44949\" stroke-width=\"3\"/>\u003cellipse cx=\"48\" cy=\"65\" rx=\"12\" ry=\"6\" fill=\"#b64b50\"/>\u003cellipse cx=\"92\" cy=\"67\" rx=\"12\" ry=\"6\" fill=\"#b64b50\"/>\u003cpath d=\"M55 91v29m45-29v29m40-29v29\" stroke=\"#5480b4\" stroke-width=\"3\"/>\u003cg fill=\"#5480b4\">\u003cpath d=\"M49 114l6 9 6-9M94 114l6 9 6-9M134 114l6 9 6-9\"/>\u003c/g>\u003ctext x=\"18\" y=\"144\">Flüssigkeit ins Gewebe\u003c/text>\u003ctext x=\"180\" y=\"25\" font-weight=\"bold\">Bronchus im Querschnitt\u003c/text>\u003ccircle cx=\"254\" cy=\"82\" r=\"42\" fill=\"#d49c72\"/>\u003ccircle cx=\"254\" cy=\"82\" r=\"24\" fill=\"#fff\"/>\u003ccircle cx=\"254\" cy=\"183\" r=\"42\" fill=\"#c97875\"/>\u003ccircle cx=\"254\" cy=\"183\" r=\"10\" fill=\"#fff\"/>\u003ctext x=\"215\" y=\"139\">Normal\u003c/text>\u003ctext x=\"196\" y=\"239\">Bronchospasmus\u003c/text>\u003ctext x=\"18\" y=\"180\">Vasodilatation +\u003c/text>\u003ctext x=\"18\" y=\"198\">Volumenverlust\u003c/text>\u003ctext x=\"18\" y=\"229\" font-weight=\"bold\">↓ venöser Rückstrom\u003c/text>\u003ctext x=\"18\" y=\"248\" font-weight=\"bold\">↓ Blutdruck\u003c/text>\u003c/g>\u003c/svg>\u003cp class=\"muted\">Schematische Darstellung, nicht maßstabsgetreu.\u003c/p>\u003c/section>\u003csection>\u003ch2>Immunologische Pathophysiologie\u003c/h2>\u003cp>Bei einer IgE-vermittelten Reaktion vernetzt ein Allergen IgE auf Mastzellen und Basophilen. Die Aktivierung führt zur Freisetzung von Mediatoren wie Histamin und Tryptase sowie zur Bildung weiterer Entzündungsmediatoren. Auch nicht IgE-vermittelte Aktivierungswege können ein ähnliches klinisches Bild auslösen. Histamin trägt zu Vasodilatation, erhöhter Gefäßpermeabilität und Bronchokonstriktion bei. Das Kapillarleck vermindert das effektive zirkulierende Volumen; gleichzeitig sinkt der Gefäßwiderstand. Die Atemwegsobstruktion kann die Ventilation und Oxygenierung verschlechtern.\u003c/p>\u003cdiv class=\"case\">Exposition → Mastzellaktivierung → Mediatorfreisetzung → Gefäßreaktion und Atemwegsreaktion → mögliche Kreislauf- und Ateminsuffizienz.\u003c/div>\u003c/section>\u003csection>\u003ch2>Pharmakologie: Adrenalin\u003c/h2>\u003cp>Adrenalin stimuliert α₁-Rezeptoren (Vasokonstriktion), β₁-Rezeptoren (Steigerung der Herzleistung) und β₂-Rezeptoren (Bronchodilatation). Damit adressiert es mehrere lebensbedrohliche Mechanismen gleichzeitig. Risiken umfassen Tachyarrhythmien, ausgeprägte Blutdruckanstiege und myokardiale Ischämie, insbesondere bei Dosierungsfehlern. Die nachfolgenden Dosisabschnitte beziehen sich ausdrücklich auf den perioperativen RCUK-Fachalgorithmus für überwachte Patienten; keine Übertragung auf unüberwachte IV-Anwendung. Konzentration und Applikationsweg unabhängig kontrollieren.\u003c/p>\u003cp>Kristalloide ergänzen die Kreislauftherapie bei Vasodilatation und Kapillarleck. Antihistaminika und Kortikosteroide sind kein Ersatz für Adrenalin in der Akutphase.\u003c/p>\u003cp>\u003ca href=\"#source-rcuk-periop\">Fachalgorithmus und Dosierungsquelle\u003c/a>\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Die Freisetzung von Entzündungsmediatoren kann Gefäße erweitern, ihre Durchlässigkeit erhöhen und Bronchien verengen. Dadurch treffen relativer Volumenmangel und ein beeinträchtigter Gasaustausch zusammen. Antibiotika, Muskelrelaxanzien, Chlorhexidin und Latex gehören zu den perioperativ relevanten Auslösern.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Ungeklärte Hypotonie, Bronchospasmus oder ein unerwarteter Kreislaufstillstand können die ersten Zeichen sein. Hautsymptome können bei schweren Reaktionen fehlen. Ein hoher Beatmungsdruck muss zugleich auf Tubusprobleme und andere technische Ursachen geprüft werden.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Sofort Hilfe rufen, mögliche Auslöser stoppen und nach ABCDE vorgehen. Oxygenierung und Atemweg sichern. Adrenalin ist das zentrale Notfallmedikament; im überwachten perioperativen Setting erfolgt die intravenöse Anwendung durch erfahrene Behandelnde. Volumentherapie und gegebenenfalls Reanimation werden parallel organisiert.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Notfallwagen und eindeutig beschriftete Medikamente bereitstellen. Konzentrationen, Einheiten, Applikationsweg und Zeiten im Team rückbestätigen. Nach Stabilisierung Blutentnahmen für Tryptase nach Algorithmus veranlassen, die gesamte Expositionsfolge dokumentieren und allergologische Abklärung vorbereiten.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Auch ohne Hautzeichen möglich: Kreislauf und Atmung beurteilen.\u003c/li>\u003cli>Adrenalin und Kristalloide sind zentrale Akutmaßnahmen im Fachalgorithmus.\u003c/li>\u003cli>Dosis, Konzentration, Applikationsweg und Verlauf getrennt kontrollieren.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Kurz nach einem Antibiotikum treten Hypotonie und erschwerte Beatmung auf. Hautzeichen sind nicht erkennbar.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Die zeitliche Nähe zu einer Exposition ist ein Hinweis, kein Allergiebeweis. Kardiorespiratorisches Muster, Differenzialdiagnosen und unmittelbare Reaktion müssen gemeinsam beurteilt werden.\u003c/p>\u003cp>Eine akute systemische Überempfindlichkeitsreaktion kann Atemwege und Kreislauf lebensbedrohlich beeinträchtigen. Im OP können Hypotonie und Bronchospasmus im Vordergrund stehen, während Hautzeichen unter Abdeckung fehlen oder bei schweren Reaktionen ganz ausbleiben.\u003c/p>\u003cp>Kreislaufstillstand erfordert sofortige Reanimation nach geltendem Algorithmus. Der perioperative RCUK-Algorithmus benennt außerdem einen systolischen Blutdruck unter 50 mmHg als kritische Schwelle für Thoraxkompressionen im entsprechenden Kontext. Klinische Beurteilung und lokaler Notfallalgorithmus sind maßgeblich.\u003c/p>\u003cp>Die Anaphylaxie ist ein Teamnotfall mit parallelen Aufgaben: Triggerkontakt begrenzen, Oxygenierung unterstützen, Adrenalin und Volumen sicher bereitstellen sowie Verlauf dokumentieren. Das Wiedererkennen des Musters und klare Kommunikation verkürzen vermeidbare Verzögerungen.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was kennzeichnet eine perioperative Anaphylaxie?\u003c/h3>\u003cp>Eine akute systemische Überempfindlichkeitsreaktion kann Atemwege und Kreislauf lebensbedrohlich beeinträchtigen. Im OP können Hypotonie und Bronchospasmus im Vordergrund stehen, während Hautzeichen unter Abdeckung fehlen oder bei schweren Reaktionen ganz ausbleiben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Unerwartete Kreislauf- oder Atemprobleme nach Exposition sofort kommunizieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Welche Auslöser müssen im OP mitgedacht werden?\u003c/h3>\u003cp>Zu den möglichen Auslösern gehören Antibiotika, Muskelrelaxanzien, Chlorhexidin, Latex und weitere perioperativ eingesetzte Stoffe. Auch Beschichtungen, Gleitmittel und Farbstoffe können relevant sein. Die zeitliche Nähe begründet einen Verdacht, beweist aber keine Allergie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine vollständige Expositionsliste mit Uhrzeiten sichern.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Was geschieht an den Gefäßen?\u003c/h3>\u003cp>Mediatorfreisetzung erweitert Gefäße und erhöht ihre Durchlässigkeit. Flüssigkeit verlagert sich aus dem Gefäßraum ins Interstitium; der venöse Rückstrom und das wirksame zirkulierende Volumen sinken. Gleichzeitig können Herzfunktion und Gefäßtonus beeinträchtigt sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Hypotonie kann trotz äußerlich fehlendem Blutverlust dramatisch werden.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Wie entstehen Atemwegsprobleme?\u003c/h3>\u003cp>Bronchokonstriktion erhöht den Atemwegswiderstand, Schleimhautödeme können den Atemweg einengen. Bei schwerer Obstruktion ist ein Giemen nicht zwingend hörbar, weil kaum Luft bewegt wird. Atemwegsdruck, Exspirationsfluss und Ventilation gemeinsam beurteilen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ein stiller Thorax bei schwerer Ventilationsstörung ist kein Entwarnungszeichen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Schließen fehlende Hautzeichen die Diagnose aus?\u003c/h3>\u003cp>Nein. Hautrötung, Urtikaria oder Angioödem können die Diagnose unterstützen, sind aber für eine schwere perioperative Anaphylaxie nicht erforderlich. Die Reaktion kann primär kardiorespiratorisch auffallen. Die Behandlung eines begründeten Verdachts darf nicht auf einen Hautbefund warten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Abdeckung und Kreislaufzentralisation erschweren die Hautbeurteilung zusätzlich.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Welche Differenzialdiagnosen sind wichtig?\u003c/h3>\u003cp>Blutung, übermäßige Anästhetikawirkung, mechanische Atemwegsprobleme, Spannungspneumothorax und andere Schockursachen können ähnlich aussehen. Der zeitliche Verlauf nach Medikamenten oder Materialkontakt hilft bei der Einordnung. Mehrere Ursachen können gleichzeitig bestehen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Patient, Atemweg, Kreislauf und Technik parallel prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was hat unmittelbar Priorität?\u003c/h3>\u003cp>Hilfe rufen, Verdacht benennen, mögliche Auslöser nach Möglichkeit stoppen und Oxygenierung sowie Kreislauf behandeln. Nicht notwendige chirurgische Schritte unterbrechen lassen. Zuständigkeiten für Medikamente, Zugänge, Dokumentation und Kommunikation klar verteilen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Die Reaktion ausdrücklich als Anaphylaxieverdacht ansagen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Warum ist Adrenalin das zentrale Medikament?\u003c/h3>\u003cp>Adrenalin unterstützt über adrenerge Rezeptoren Gefäßtonus, Herzleistung und Bronchodilatation. Es adressiert damit lebensbedrohliche Kreislauf- und Atemwegsprobleme. Antihistaminika oder Kortikosteroide ersetzen diese Wirkung in der Akutphase nicht.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Priorität auf Adrenalin und Kreislaufstabilisierung nach ärztlicher Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Welche IV-Anfangsdosis nennt der perioperative RCUK-Algorithmus?\u003c/h3>\u003cp>Für Erwachsene und Jugendliche über zwölf Jahren nennt der Algorithmus einen initialen Adrenalinbolus von 50 µg intravenös im überwachten anästhesiologischen Umfeld. Weiteres Vorgehen wird titriert. Diese Empfehlung ist keine allgemeine Anweisung für unüberwachte intravenöse Anwendung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Spezifischer Fachalgorithmus für Anästhesie und Intensivmedizin, lokale SOP beachten.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Warum ist die Konzentration entscheidend?\u003c/h3>\u003cp>50 µg entsprechen bei 100 µg/ml einem Volumen von 0,5 ml. Eine Ampulle mit 1 mg/ml enthält dagegen 1000 µg/ml. Gleiches Volumen kann also eine zehnfach unterschiedliche Wirkstoffmenge enthalten. Konzentration, Dosis und Volumen getrennt prüfen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Spritzen eindeutig in µg/ml beschriften und unabhängig kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Wie unterscheidet sich die IM-Anwendung?\u003c/h3>\u003cp>Ohne intravenösen Zugang nennt der perioperative RCUK-Algorithmus 10 µg/kg intramuskulär, maximal 500 µg, aus einer Lösung mit 1 mg/ml. Applikationswege sind nicht austauschbar. Parallel wird ein geeigneter Gefäßzugang organisiert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine IV-Verdünnung niemals ungeprüft als IM-Standard übernehmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum werden Kristalloide benötigt?\u003c/h3>\u003cp>Vasodilatation und Kapillarleck reduzieren das effektive Blutvolumen. Adrenalin und Flüssigkeit wirken deshalb komplementär. Der perioperative RCUK-Algorithmus nennt bei Erwachsenen initial 500–1000 ml zügig, mit wiederholter klinischer Beurteilung und gegebenenfalls weiteren Gaben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Volumenwirkung und Zeichen einer Überlastung wiederholt beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Was ist bei therapierefraktärem Verlauf relevant?\u003c/h3>\u003cp>Bei unzureichender Antwort auf Bolusgaben kann eine Adrenalininfusion erforderlich sein. Dies verlangt kontinuierliche Überwachung, sichere Verdünnung und erfahrene ärztliche Steuerung. Intensivmedizinische Unterstützung frühzeitig hinzuziehen; zusätzliche Vasopressoren sind situationsabhängige Entscheidungen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Perfusor, Leitung und lokale Zubereitungsvorgabe vorbereitet halten.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Warum helfen Antihistaminika nicht als erste Schocktherapie?\u003c/h3>\u003cp>Sie können bestimmte histaminvermittelte Beschwerden beeinflussen, beheben aber eine lebensbedrohliche Hypotonie oder schwere Atemwegsstörung nicht zuverlässig. Auch Kortikosteroide wirken nicht schnell genug als Ersatz für Adrenalin. Nachrangige Medikamente dürfen zentrale Maßnahmen nicht verzögern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht zuerst nach dem Antihistaminikum suchen, während der Kreislauf kollabiert.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Welche Überwachung ist erforderlich?\u003c/h3>\u003cp>EKG, Blutdruck, SpO₂, Ventilation und Kapnographie soweit verfügbar kontinuierlich beurteilen. Bei Instabilität können invasive Blutdruckmessung und Blutgasanalysen erforderlich sein. Verlauf und Reaktion auf jede Intervention sind aussagekräftiger als ein isolierter Messwert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Medikamentengabe und Kreislaufantwort zeitlich gemeinsam dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Wann wird Tryptase abgenommen?\u003c/h3>\u003cp>Die Akutbehandlung hat Vorrang. Der perioperative RCUK-Algorithmus empfiehlt eine Probe nach Stabilisierung, weitere Proben ein bis vier Stunden nach Symptombeginn und eine Baseline frühestens 24 Stunden später. Lokales Laborprotokoll und genaue Uhrzeiten beachten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Röhrchen und Zeitplan früh organisieren, Reanimation dafür nie unterbrechen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Beweist eine normale Tryptase, dass keine Anaphylaxie vorlag?\u003c/h3>\u003cp>Nein. Tryptase ist ein diagnostischer Baustein und wird im zeitlichen Verlauf sowie im Verhältnis zur Baseline interpretiert. Ein unauffälliger Wert allein kann eine klinisch plausible Reaktion nicht ausschließen. Die spätere allergologische Abklärung bleibt wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den Fall nicht allein aufgrund eines einzelnen Laborwerts als harmlos einordnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was gehört in die Nachdokumentation?\u003c/h3>\u003cp>Symptombeginn, sämtliche Medikamente und Materialien, Chargen soweit relevant, Dosen, Uhrzeiten, Kreislaufverlauf, Maßnahmen und Probenzeiten nachvollziehbar sichern. Verdächtige Stoffe werden als Verdacht gekennzeichnet, nicht ohne Abklärung als bewiesene Allergie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ein vorläufiger Warnhinweis und die organisierte allergologische Weiterleitung verhindern erneute Exposition.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Wann muss an Reanimation gedacht werden?\u003c/h3>\u003cp>Kreislaufstillstand erfordert sofortige Reanimation nach geltendem Algorithmus. Der perioperative RCUK-Algorithmus benennt außerdem einen systolischen Blutdruck unter 50 mmHg als kritische Schwelle für Thoraxkompressionen im entsprechenden Kontext. Klinische Beurteilung und lokaler Notfallalgorithmus sind maßgeblich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Reanimationsteam früh rufen; nicht auf Pulsoxymetrie als Kreislaufbeweis vertrauen.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die wichtigste pflegerische Lernbrücke?\u003c/h3>\u003cp>Die Anaphylaxie ist ein Teamnotfall mit parallelen Aufgaben: Triggerkontakt begrenzen, Oxygenierung unterstützen, Adrenalin und Volumen sicher bereitstellen sowie Verlauf dokumentieren. Das Wiedererkennen des Musters und klare Kommunikation verkürzen vermeidbare Verzögerungen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Atemweg und Kreislauf erkennen, Adrenalin priorisieren, Verlauf sichern.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-rcuk-periop\">\u003ca href=\"https://www.resus.org.uk/sites/default/files/2024-01/2526%20AAP%20RCUK%20periop%20anaphylaxis-8C.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Peri-operative anaphylaxis – Algorithm for anaesthetists/intensivists\u003c/a>\u003cp>Resuscitation Council UK · 2024\u003c/p>\u003cp class=\"muted\">Frei zugänglicher Originalalgorithmus; Akutmaßnahmen, Dosen und Probenzeiten geprüft.\u003c/p>\u003c/li>\u003cli id=\"source-rcuk-guidance\">\u003ca href=\"https://www.resus.org.uk/library/additional-guidance/guidance-anaphylaxis\" target=\"_blank\" rel=\"noopener noreferrer\">Guidance: Anaphylaxis\u003c/a>\u003cp>Resuscitation Council UK · laufend gepflegte Fachseite; Einzelstand nicht ausgewiesen\u003c/p>\u003cp class=\"muted\">Frei zugängliche Fachgesellschaftsseite. Perioperativen und allgemeinen Algorithmus unterscheiden.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/01-color.png","readingMinutes":13,"guideSvg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 1280\" role=\"img\" aria-label=\"Pocketguide perioperative Anaphylaxie\">\u003cdefs>\u003clinearGradient id=\"pghead\">\u003cstop stop-color=\"#123b46\"/>\u003cstop offset=\"1\" stop-color=\"#087e88\"/>\u003c/linearGradient>\u003clinearGradient id=\"pgblood\">\u003cstop stop-color=\"#f9cdca\"/>\u003cstop offset=\"1\" stop-color=\"#c45d66\"/>\u003c/linearGradient>\u003c/defs>\u003crect width=\"720\" height=\"1280\" rx=\"20\" fill=\"#eff6f7\"/>\u003cg font-family=\"system-ui, sans-serif\">\u003crect width=\"720\" height=\"76\" fill=\"url(#pghead)\"/>\u003ctext x=\"24\" y=\"32\" font-size=\"24\" fill=\"white\" font-weig fill=\"#18343f\">Bronchospasmus · hoher Atemdruck\u003c/text>\u003ccircle cx=\"19\" cy=\"113\" r=\"4\" fill=\"#b65b13\"/>\u003ctext x=\"32\" y=\"120\" font-size=\"21\" fill=\"#18343f\">Hautzeichen können fehlen\u003c/text>\u003c/g>\u003cg transform=\"translate(18 642)\">\u003crect width=\"684\" height=\"132\" rx=\"16\" fill=\"white\" stroke=\"#b12d54\" stroke-opacity=\".45\"/>\u003cpath d=\"M16 0H668Q684 0 684 16V37H0V16Q0 0 16 0\" fill=\"#b12d54\"/>\u003ctext x=\"16\" y=\"26\" font-size=\"24\" font-weight=\"750\" fill=\"white\">Akutversorgung\u003c/text>\u003cg transform=\"translate(592 49)\" color=\"#b12d54\">\u003ccircle cx=\"34\" cy=\"34\" r=\"29\" fill=\"#ffe2e6\"/>\u003cpath d=\"M25 13h18v13h13v18H43v13H25V44H12V26h13z\" fill=\"currentColor\"/>\u003c/g>\u003ccircle cx=\"19\" cy=\"59\" r=\"4\" fill=\"#b12d54\"/>\u003ctext x=\"32\" y=\"66\" font-size=\"21\" fill=\"#18343f\">Hilfe rufen · Auslöser stoppen\u003c/text>\u003ccircle cx=\"19\" cy=\"86\" r=\"4\" fill=\"#b12d54\"/>\u003ctext x=\"32\" y=\"93\" font-size=\"21\" fill=\"#18343f\">ABCDE · 100 % O₂ · Atemweg sichern\u003c/text>\u003ccircle cx=\"19\" cy=\"113\" r=\"4\" fill=\"#b12d54\"/>\u003ctext x=\"32\" y=\"120\" font-size=\"21\" fill=\"#18343f\">Adrenalin und Volumen nach SOP\u003c/text>\u003c/g>\u003cg transform=\"translate(18 785)\">\u003crect width=\"684\" height=\"132\" rx=\"16\" fill=\"white\" stroke=\"#8050a0\" stroke-opacity=\".45\"/>\u003cpath d=\"M16 0H668Q684 0 684 16V37H0V16Q0 0 16 0\" fill=\"#8050a0\"/>\u003ctext x=\"16\" y=\"26\" font-size=\"24\" font-weight=\"750\" fill=\"white\">Adrenalin\u003c/text>\u003cg transform=\"translate(592 49)\" color=\"#8050a0\">\u003cg transform=\"rotate(-42 34 34)\" stroke=\"currentColor\" stroke-width=\"3\" fill=\"none\">\u003crect x=\"24\" y=\"14\" width=\"20\" height=\"34\" rx=\"3\" fill=\"#e3ddf7\"/>\u003cpath d=\"M34 48v17M34 14V4M23 4h22M19 14h30M29 24h10M29 32h10M29 40h10\"/>\u003c/g>\u003c/g>\u003ccircle cx=\"19\" cy=\"59\" r=\"4\" fill=\"#8050a0\"/>\u003ctext x=\"32\" y=\"66\" font-size=\"21\" fill=\"#18343f\">α₁: Vasokonstriktion\u003c/text>\u003ccircle cx=\"19\" cy=\"86\" r=\"4\" fill=\"#8050a0\"/>\u003ctext x=\"32\" y=\"93\" font-size=\"21\" fill=\"#18343f\">β₁: Herzleistung · β₂: Bronchodilatation\u003c/text>\u003ccircle cx=\"19\" cy=\"113\" r=\"4\" fill=\"#8050a0\"/>\u003ctext x=\"32\" y=\"120\" font-size=\"21\" fill=\"#18343f\">IV nur im überwachten Fachsetting\u003c/text>\u003c/g>\u003cg transform=\"translate(18 928)\">\u003crect width=\"684\" height=\"132\" rx=\"16\" fill=\"white\" stroke=\"#176ba1\" stroke-opacity=\".45\"/>\u003cpath d=\"M16 0H668Q684 0 684 16V37H0V16Q0 0 16 0\" fill=\"#176ba1\"/>\u003ctext x=\"16\" y=\"26\" font-size=\"24\" font-weight=\"750\" fill=\"white\">Überwachung\u003c/text>\u003cg transform=\"translate(592 49)\" color=\"#176ba1\">\u003crect x=\"3\" y=\"9\" width=\"62\" height=\"43\" rx=\"5\" fill=\"#123b46\"/>\u003cpath d=\"M9 32h12l5-12 8 23 7-13h18\" stroke=\"#81e6b0\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M34 52v9m-16 0h32\" stroke=\"currentColor\" stroke-width=\"3\"/>\u003c/g>\u003ccircle cx=\"19\" cy=\"59\" r=\"4\" fill=\"#176ba1\"/>\u003ctext x=\"32\" y=\"66\" font-size=\"21\" fill=\"#18343f\">EKG · Blutdruck · SpO₂ · etCO₂\u003c/text>\u003ccircle cx=\"19\" cy=\"86\" r=\"4\" fill=\"#176ba1\"/>\u003ctext x=\"32\" y=\"93\" font-size=\"21\" fill=\"#18343f\">Beatmungsdruck und Verlauf\u003c/text>\u003ccircle cx=\"19\" cy=\"113\" r=\"4\" fill=\"#176ba1\"/>\u003ctext x=\"32\" y=\"120\" font-size=\"21\" fill=\"#18343f\">Reaktion auf Interventionen\u003c/text>\u003c/g>\u003cg transform=\"translate(18 1071)\">\u003crect width=\"684\" height=\"132\" rx=\"16\" fill=\"white\" stroke=\"#347c47\" stroke-opacity=\".45\"/>\u003cpath d=\"M16 0H668Q684 0 684 16V37H0V16Q0 0 16 0\" fill=\"#347c47\"/>\u003ctext x=\"16\" y=\"26\" font-size=\"24\" font-weight=\"750\" fill=\"white\">Nachversorgung\u003c/text>\u003cg transform=\"translate(592 49)\" color=\"#347c47\">\u003crect x=\"12\" y=\"9\" width=\"44\" height=\"53\" rx=\"6\" fill=\"#e1f2e8\" stroke=\"currentColor\" stroke-width=\"3\"/>\u003crect x=\"23\" y=\"4\" width=\"22\" height=\"11\" rx=\"4\" fill=\"currentColor\"/>\u003cpath d=\"M21 27l4 4 7-8m-11 19 4 4 7-8m6-10h10m-10 15h10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/>\u003c/g>\u003ccircle cx=\"19\" cy=\"59\" r=\"4\" fill=\"#347c47\"/>\u003ctext x=\"32\" y=\"66\" font-size=\"21\" fill=\"#18343f\">Tryptase nach Stabilisierung\u003c/text>\u003ccircle cx=\"19\" cy=\"86\" r=\"4\" fill=\"#347c47\"/>\u003ctext x=\"32\" y=\"93\" font-size=\"21\" fill=\"#18343f\">Expositionen und Verlauf dokumentieren\u003c/text>\u003ccircle cx=\"19\" cy=\"113\" r=\"4\" fill=\"#347c47\"/>\u003ctext x=\"32\" y=\"120\" font-size=\"21\" fill=\"#18343f\">Allergologische Abklärung\u003c/text>\u003c/g>\u003ctext x=\"24\" y=\"1240\" font-size=\"15\" fill=\"#123b46\">RCUK · Peri-operative anaphylaxis (2024)\u003c/text>\u003ctext x=\"24\" y=\"1262\" font-size=\"15\" fill=\"#52666d\">Fachfortbildung · lokale SOP und ärztliche Anordnung beachten.\u003c/text>\u003c/g>\u003c/svg>"},{"id":"02","title":"Perioperative Atelektasen","category":"Beatmung","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Verminderte Belüftung und veränderte Perfusion sind getrennte Mechanismen. Rekrutierung ist nicht aus einer verbesserten SpO₂ allein bewiesen.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Atelektasen sind nicht oder unzureichend belüftete Lungenbereiche. Narkose, veränderte Zwerchfellposition und Atemwegsverschluss fördern den Kollaps. Bei fortbestehender Durchblutung fließt Blut an unbelüfteten Alveolen vorbei: Es entsteht ein intrapulmonaler Shunt.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Eine verschlechterte Oxygenierung und eine sinkende Compliance können Hinweise geben. Beide sind unspezifisch: Tubusverlagerung, Sekret, Bronchospasmus, Pneumothorax und Kreislaufprobleme müssen mitbedacht werden. Eine ausreichende SpO₂ unter viel Sauerstoff schließt Atelektasen nicht aus.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Zunächst Oxygenierung sichern und reversible Ursachen prüfen. Eine lungenprotektive Beatmung berücksichtigt das vorhergesagte Körpergewicht und die gemessenen Drücke. PEEP und gegebenenfalls Rekrutierung werden individuell gegen die Kreislaufwirkung abgewogen.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Beatmungswerte und Verlauf nach Lagerung oder Pneumoperitoneum vergleichen. Veränderungen von SpO₂, Blutdruck, Atemwegsdruck und Compliance gemeinsam melden. Postoperativ Analgesie, Mobilisation und verordnete Atemunterstützung koordinieren.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Kollabierte, weiter durchblutete Areale erzeugen Shunt.\u003c/li>\u003cli>PEEP kann stabilisieren, aber auch Überdehnung und Hypotonie begünstigen.\u003c/li>\u003cli>Präoxygenierung sicher durchführen; FiO₂ und Beatmung danach individualisieren.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Nach Einleitung und Lagerung steigt der Sauerstoffbedarf. Der Tubus ist durchgängig, die Atemmechanik hat sich verändert.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Verminderte Belüftung und veränderte Perfusion sind getrennte Mechanismen. Rekrutierung ist nicht aus einer verbesserten SpO₂ allein bewiesen.\u003c/p>\u003cp>Ein Lungenareal ist unzureichend belüftet oder kollabiert. Das betroffene Gewebe kann weiter durchblutet sein. Dadurch entsteht eine Störung des Ventilations-Perfusions-Verhältnisses bis zum intrapulmonalen Shunt. Eine Atelektase ist ein Befund mit unterschiedlichen möglichen Ursachen.\u003c/p>\u003cp>Rekrutierbarkeit, Thoraxwandmechanik und Kreislaufreserve unterscheiden sich. Ein gleicher PEEP kann bei einer Person derekrutierte Areale stabilisieren und bei einer anderen Überdehnung verursachen. Die Veränderung nach Anpassung ist oft aussagekräftiger als der Einzelwert.\u003c/p>\u003cp>Atelektasen verbinden mechanische Belüftung mit Gasaustausch. Eine Intervention muss deshalb sowohl die offen gehaltene Lunge als auch Blutfluss und Kreislauf berücksichtigen. Der beste SpO₂-Wert allein beschreibt noch keine optimale oder lungenschonende Beatmung.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was ist eine Atelektase?\u003c/h3>\u003cp>Ein Lungenareal ist unzureichend belüftet oder kollabiert. Das betroffene Gewebe kann weiter durchblutet sein. Dadurch entsteht eine Störung des Ventilations-Perfusions-Verhältnisses bis zum intrapulmonalen Shunt. Eine Atelektase ist ein Befund mit unterschiedlichen möglichen Ursachen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Hypoxämie nicht automatisch jede Kurvenänderung als Atelektase deuten.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Warum begünstigt Allgemeinanästhesie Atelektasen?\u003c/h3>\u003cp>Muskeltonus, Zwerchfelllage und Thoraxmechanik verändern sich. Die funktionelle Residualkapazität nimmt häufig ab, abhängige Lungenareale werden leichter verschlossen. Lagerung, Adipositas und Pneumoperitoneum können diese Mechanismen verstärken.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Schon nach Einleitung können relevante Belüftungsänderungen entstehen.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Was bedeutet funktionelle Residualkapazität?\u003c/h3>\u003cp>Die FRC ist das Gasvolumen am Ende einer normalen passiven Ausatmung. Sie dient als Sauerstoffreservoir zwischen den Atemzügen. Nähert sie sich dem Volumen, bei dem kleine Atemwege verschließen, steigt das Risiko regionaler Minderbelüftung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Kleine Sauerstoffreserve erklärt eine verkürzte Apnoetoleranz.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Was ist eine Resorptionsatelektase?\u003c/h3>\u003cp>Hinter einem verschlossenen oder schlecht belüfteten Atemweg wird Gas weiter ins Blut aufgenommen. Wird dieses Gas nicht ersetzt, schrumpft das Alveolarvolumen. Hohe Sauerstoffkonzentrationen können die schnelle Gasresorption begünstigen, beseitigen aber nicht die Notwendigkeit sicherer Präoxygenierung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Oxygenierungssicherheit und spätere FiO₂-Anpassung getrennt beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Warum ist das kein Argument gegen sichere Präoxygenierung?\u003c/h3>\u003cp>Vor Einleitung hat eine ausreichende Sauerstoffreserve einen unmittelbaren Sicherheitsnutzen. Das Risiko von Atelektasen wird in der Gesamtstrategie durch Lagerung, Atemwegsmanagement und geeignete Beatmung berücksichtigt. Eine unzureichende Präoxygenierung darf nicht als Atelektasenprophylaxe ausgegeben werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Patientensicherheit vor Einleitung bleibt vorrangig.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Wie unterscheiden sich Shunt und Totraum?\u003c/h3>\u003cp>Beim Shunt wird durchblutetes Gewebe nicht ausreichend ventiliert. Beim alveolären Totraum erreicht Ventilation schlecht durchblutete Bereiche. Atelektasen begünstigen vor allem Shunt; beide Störungen können bei komplexen Lungenerkrankungen gleichzeitig auftreten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ein verändertes etCO₂ allein unterscheidet diese Mechanismen nicht zuverlässig.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Warum kann Sauerstoff allein nicht ausreichen?\u003c/h3>\u003cp>Bei echtem Shunt umgeht ein Teil des Bluts ausreichend belüftete Alveolen. Mehr Sauerstoff in belüfteten Arealen korrigiert die venöse Beimischung deshalb nur begrenzt. Zugrunde liegende Atemwegs- und Belüftungsprobleme müssen mitbeurteilt werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei persistierender Hypoxämie die Ursache suchen und Hilfe früh einbeziehen.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Bedeutung hat PEEP?\u003c/h3>\u003cp>PEEP hält am Ende der Exspiration einen positiven Atemwegsdruck aufrecht und kann verschlossene Areale stabilisieren. Die Wirkung hängt davon ab, ob Gewebe rekrutierbar ist. Zu hoher PEEP kann andere Regionen überdehnen und den venösen Rückstrom vermindern.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Oxygenierung, Compliance und Hämodynamik zusammen beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was kann ein Recruitment-Manöver leisten?\u003c/h3>\u003cp>Ein vorübergehender Druckanstieg kann kollabierte Areale eröffnen. Ob dieser Nutzen anhält, hängt unter anderem von nachfolgender Stabilisierung und Ursache ab. Hohe Drücke können Hypotonie oder Überdehnung auslösen. Es gibt keinen universell sicheren Standarddruck für jede Situation.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nur bei passender Indikation und unter erfahrener Steuerung durchführen.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Warum ist ein niedriger Spitzenatemwegsdruck kein sicherer Ausschluss?\u003c/h3>\u003cp>Der Spitzendruck hängt auch von Atemwegswiderstand, Fluss und Beatmungsmodus ab. Eine regional kollabierte Lunge kann trotz unauffälligem Spitzendruck vorliegen. Umgekehrt kann hoher Spitzendruck durch Sekret oder Tubusprobleme entstehen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht nur einen Druckwert betrachten, sondern Kurven und klinischen Verlauf.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Was zeigt die statische Compliance?\u003c/h3>\u003cp>Unter geeigneten passiven Messbedingungen beschreibt sie das Verhältnis von Volumenänderung zur elastischen Druckänderung. Eine abnehmende Compliance kann bei Atelektasen auftreten, ist aber nicht spezifisch. Thoraxwand, Abdomen und andere Lungenprozesse beeinflussen den Wert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Plateaudruckmessung und Leckfreiheit vor Interpretation prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Wie wird Compliance im Lernbeispiel berechnet?\u003c/h3>\u003cp>Bei 420 ml Tidalvolumen, 24 cmH₂O Plateaudruck und 10 cmH₂O Gesamt-PEEP ergibt sich 420/(24−10)=30 ml/cmH₂O. Dies gilt nur bei geeigneter statischer Messung ohne wesentliche Atemaktivität oder Leckage.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Der Spitzendruck gehört nicht ungeprüft in die statische Complianceformel.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Welche technischen Ursachen einer Desaturation müssen zuerst geprüft werden?\u003c/h3>\u003cp>Sauerstoffzufuhr, Schlauchverbindungen, Tubuslage, Sekret, Beatmung und Messsignal kontrollieren. Eine versehentliche Einlungenventilation kann eine neue Hypoxämie erklären. Die Patientensituation hat Vorrang vor einer vorschnellen Geräteeinstellung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ein plötzlicher Beginn verlangt einen strukturierten Sicherheitscheck.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Welche Rolle hat Lagerung?\u003c/h3>\u003cp>Rückenlage und druckbelastete Lungenareale können Verschluss begünstigen. Eine angepasste Oberkörperposition und Mobilisation können je nach Situation Ventilation und Atemmechanik unterstützen. Lagerungswechsel müssen mit Kreislauf, Operation und Atemwegssicherheit abgestimmt sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nach Umlagerung Atemwegslage und Ventilation erneut kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Warum ist Adipositas ein besonderer Kontext?\u003c/h3>\u003cp>Eine erhöhte Last von Thoraxwand und Abdomen kann das endexspiratorische Lungenvolumen vermindern. Das tatsächliche Körpergewicht ist jedoch keine geeignete alleinige Grundlage für Tidalvolumen. Beatmung, Lagerung und PEEP müssen individualisiert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Tidalvolumenbezug und Atemmechanik ausdrücklich prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Welche Aussage erlaubt PROBESE?\u003c/h3>\u003cp>Die Studie untersuchte adipöse chirurgische Erwachsene und verglich zwei Beatmungsstrategien mit unterschiedlichen PEEP-Niveaus und Recruitment. Eine bessere intraoperative Oxygenierung ist nicht automatisch ein nachgewiesener Rückgang postoperativer Lungenkomplikationen. Ergebnisse gelten für die untersuchte Population und das konkrete Protokoll.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine Studiengruppe nicht als universelle Beatmungsvorgabe übernehmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Wie kann Ultraschall helfen?\u003c/h3>\u003cp>Ein qualifiziert durchgeführter Lungenultraschall kann regionale Belüftungsstörungen und differenzialdiagnostische Hinweise liefern. Befunde müssen zur Untersuchungstechnik und klinischen Situation passen. Kein einzelnes Ultraschallzeichen ersetzt die vollständige Beurteilung von Hypoxämie.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Untersuchung organisieren, statt eine Ursache allein aus der SpO₂ abzuleiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Was ist postoperativ besonders wichtig?\u003c/h3>\u003cp>Schmerztherapie, ausreichende Ventilation, angemessene Lagerung und frühe Mobilisation unterstützen die Atemfunktion. Restrelaxierung und Sedierungsüberhang können Husten und tiefe Atmung beeinträchtigen. Sauerstoffbedarf und Atemarbeit im Verlauf beurteilen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei Übergabe Atemmechanik, Interventionen und aktuelle Unterstützung nennen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Warum sind feste PEEP-Zahlen problematisch?\u003c/h3>\u003cp>Rekrutierbarkeit, Thoraxwandmechanik und Kreislaufreserve unterscheiden sich. Ein gleicher PEEP kann bei einer Person derekrutierte Areale stabilisieren und bei einer anderen Überdehnung verursachen. Die Veränderung nach Anpassung ist oft aussagekräftiger als der Einzelwert.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Druckänderungen mit Blutdruck und klinischer Wirkung dokumentieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die zentrale Lernbrücke?\u003c/h3>\u003cp>Atelektasen verbinden mechanische Belüftung mit Gasaustausch. Eine Intervention muss deshalb sowohl die offen gehaltene Lunge als auch Blutfluss und Kreislauf berücksichtigen. Der beste SpO₂-Wert allein beschreibt noch keine optimale oder lungenschonende Beatmung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Belüftung öffnen, Offenhalten prüfen, Kreislauf mitdenken.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-oa-respiratory\">\u003ca href=\"https://www.openanesthesia.org/keywords/effects-of-anesthesia-on-the-respiratory-system/?search_term=anesthesia+brea\" target=\"_blank\" rel=\"noopener noreferrer\">Effects of Anesthesia on the Respiratory System\u003c/a>\u003cp>OpenAnesthesia / International Anesthesia Research Society · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Frei lesbarer Lehrartikel; eigenständige Zusammenfassung der Physiologie, keine Übernahme von Abbildungen oder geschützten Lehrbuchtexten.\u003c/p>\u003c/li>\u003cli id=\"source-probese\">\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6582260/\" target=\"_blank\" rel=\"noopener noreferrer\">Effect of Intraoperative High PEEP With Recruitment Maneuvers vs Low PEEP … A Randomized Clinical Trial\u003c/a>\u003cp>PROBESE Collaborative Group; JAMA 2019;321:2292–2305 · 2019\u003c/p>\u003cp class=\"muted\">Frei zugängliche Originalstudie; Population, Vergleichsstrategie und Ergebnis geprüft. Keine individuelle PEEP-Verordnung.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/02-color.png","readingMinutes":9},{"id":"03","title":"Awareness unter Allgemeinanästhesie","category":"Narkose","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Pumpenanzeige, intravasaler Transport und tatsächliche Hirnwirkung sind unterschiedliche Ebenen. Eine technische Anzeige beweist keine zuverlässige Medikamentenzufuhr.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Hypnose, Analgesie und Muskelrelaxierung sind unterschiedliche Wirkungen. Ein Muskelrelaxans verhindert Bewegung, erzeugt aber keine verlässliche Bewusstlosigkeit. Deshalb kann fehlende Bewegung eine unzureichende Hypnose verdecken.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Vegetative Zeichen sind unspezifisch. Tachykardie oder Hypertonie können auch andere Ursachen haben; ihr Ausbleiben schließt Awareness nicht aus. Bei einem späteren Bericht über Wahrnehmungen sind Inhalt, Zeitpunkt und Belastung ernst zu nehmen.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Narkosemittelzufuhr von der Quelle bis zum Patienten sichern. Bei TIVA gehören Infusionsleitung und Zugang in den Blick; bei volatiler Narkose ist die endtidale Konzentration wichtig. Ein vermutetes intraoperatives Ereignis verlangt sofortige ärztliche Überprüfung und angemessene Vertiefung.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Spritzenwechsel, Transport und Übergaben als kritische Momente behandeln. Pumpeneinstellung, Füllstand, Leitungsanschlüsse und Alarme kontrollieren. Patientenberichte wörtlich und wertfrei dokumentieren; Nachgespräch und weitere Unterstützung organisieren.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Relaxierung bewirkt weder Schlaf noch Schmerzfreiheit.\u003c/li>\u003cli>Sichere kontinuierliche Zufuhr ist wichtiger als ein isolierter Monitorindex.\u003c/li>\u003cli>Berichtete Erinnerungen ernst nehmen und strukturiert nachbetreuen.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Während einer TIVA fällt ein ungewöhnlicher EEG-Verlauf auf. Die Pumpe läuft, der intravenöse Zugang ist aber nicht gut einsehbar.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Pumpenanzeige, intravasaler Transport und tatsächliche Hirnwirkung sind unterschiedliche Ebenen. Eine technische Anzeige beweist keine zuverlässige Medikamentenzufuhr.\u003c/p>\u003cp>Gemeint ist unbeabsichtigte intraoperative Wachheit mit späterer expliziter Erinnerung während einer beabsichtigten Allgemeinanästhesie. Das unterscheidet sich von erwarteter Wahrnehmung unter Sedierung. Erinnerungen werden ernst genommen und systematisch eingeordnet, auch wenn der genaue Zeitpunkt zunächst unklar bleibt.\u003c/p>\u003cp>Die Häufigkeit hängt stark von Erhebungsmethode, Population und Definition ab. Spontan gemeldete Ereignisse und strukturierte postoperative Interviews erfassen unterschiedliche Zahlen. Eine ohne Methode genannte Rate erzeugt Scheingenauigkeit.\u003c/p>\u003cp>Awarenessprävention beginnt mit verlässlicher kontinuierlicher Zufuhr und endet nicht bei einer Monitorzahl. Relaxierung, Übergaben und Zugangssicherheit verdienen besondere Aufmerksamkeit. Nach einem Verdacht braucht es eine empathische strukturierte Nachbetreuung.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was bedeutet Awareness unter Allgemeinanästhesie?\u003c/h3>\u003cp>Gemeint ist unbeabsichtigte intraoperative Wachheit mit späterer expliziter Erinnerung während einer beabsichtigten Allgemeinanästhesie. Das unterscheidet sich von erwarteter Wahrnehmung unter Sedierung. Erinnerungen werden ernst genommen und systematisch eingeordnet, auch wenn der genaue Zeitpunkt zunächst unklar bleibt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine berichtete Erinnerung nicht vorschnell als Traum abtun.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Warum sind Hypnose, Analgesie und Relaxierung getrennt zu betrachten?\u003c/h3>\u003cp>Diese Komponenten wirken auf unterschiedliche Funktionen. Muskelrelaxierung verhindert Bewegung, verursacht aber weder Bewusstlosigkeit noch sichere Analgesie. Fehlende Bewegung darf deshalb nicht als Beweis ausreichender Hypnose interpretiert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei relaxierten Patienten auf sichere Hypnotikazufuhr besonders achten.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Welche Bedeutung haben neuromuskuläre Blocker?\u003c/h3>\u003cp>Sie verhindern ein wichtiges sichtbares Warnsignal und können die Erfahrung einer Wachheit psychisch belastender machen. NAP5 betont den Zusammenhang mit Relaxanzieneinsatz. Das Medikament ist nicht automatisch die Ursache einer zu geringen Hypnotikawirkung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Relaxierungsbedarf und quantitative Überwachung im Team bewusst besprechen.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Welche Phasen sind besonders fehleranfällig?\u003c/h3>\u003cp>Einleitung, Übergaben, Transport und Ausleitung können Lücken in der kontinuierlichen Anästhetikazufuhr begünstigen. Auch während der Erhaltung sind Pumpen-, Zugangs- und Geräteprobleme möglich. Sicherheit entsteht durch durchgängige Überwachung des gesamten Zufuhrwegs.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Unterbrechungen und Übergänge gezielt in die Checkliste aufnehmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Was muss bei TIVA kontrolliert werden?\u003c/h3>\u003cp>Wirkstoff, Konzentration, Pumpenprogramm, Stromversorgung, Spritzensitz, Leitungsverlauf und intravenöser Zugang müssen stimmen. Eine laufende Pumpe beweist nicht, dass das Medikament intravasal ankommt. Diskonnektion oder Extravasation können eine Unterdosierung verursachen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den Zugang soweit möglich sichtbar und kontrollierbar halten.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Welche Gefahr birgt Leitungs-Totraum?\u003c/h3>\u003cp>Zwischen Pumpe und Patient kann sich Medikament in einem Volumen befinden, dessen Inhalt verzögert oder unvorhersehbar ankommt. Änderungen des Trägerflusses beeinflussen den Transport. Das betrifft sowohl eine verzögerte Zufuhr als auch spätere unerwartete Bolusgaben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Leitungsaufbau und Trägerfluss bei jeder Übergabe erklären.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was wird bei volatiler Anästhesie überwacht?\u003c/h3>\u003cp>Die inspiratorische und endtidale Anästhetikakonzentration helfen, Zufuhr und alveoläre Konzentration zu beurteilen. Altersbezogene MAC-Angaben geben Kontext, sind aber kein individueller Bewusstseinsbeweis. Vapor, Füllstand, Anschlüsse und Alarme bleiben wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Endtidale Konzentration und niedrige Grenzalarme aktiv kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Warum ist MAC keine Bewusstseinsgarantie?\u003c/h3>\u003cp>MAC ist ein populationsbezogener Endpunkt für Bewegung auf einen standardisierten Reiz. Erinnerung und Bewusstsein sind andere Endpunkte. Alter, Begleitmedikation, Kreislauf und individuelle Empfindlichkeit beeinflussen die Wirkung. Ein einzelner MAC-Wert kann Awareness nicht absolut ausschließen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> MAC als Kontextwert nutzen, nicht als Ja-nein-Test für Bewusstsein.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Können Puls und Blutdruck Awareness zuverlässig ausschließen?\u003c/h3>\u003cp>Nein. Kreislaufreaktionen sind unspezifisch und werden durch Betablocker, Opioide, Volumenstatus und zahlreiche andere Faktoren verändert. Ein ruhiger Kreislauf beweist keine ausreichende Hypnose. Umgekehrt kann Tachykardie andere Ursachen haben.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zufuhr, Anästhesieverfahren und Monitoring gemeinsam beurteilen.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Was kann prozessiertes EEG beitragen?\u003c/h3>\u003cp>Es kann Informationen über hypnotische Hirnwirkung liefern und insbesondere bei risikoreichen Konstellationen hilfreich sein. Artefakte und Medikamenteneinflüsse begrenzen den Index. Ein normal erscheinender Zahlenwert schließt Erinnerung nicht mit absoluter Sicherheit aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Signalqualität und Rohdaten beziehungsweise weitere EEG-Parameter berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Warum darf ein Index nicht isoliert gelesen werden?\u003c/h3>\u003cp>Ein verarbeiteter Wert verdichtet komplexe Hirnaktivität. Elektromyographie, elektrische Geräte und bestimmte Anästhetika können die Anzeige verändern. Klinischer Kontext und tatsächliche Medikamentenzufuhr bleiben entscheidend. Der Index ersetzt keine Funktionsprüfung des Infusionssystems.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei unplausiblem Verlauf erst Signal und Zufuhr kontrollieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Wie wird ein Verdacht während der Narkose behandelt?\u003c/h3>\u003cp>Das Team informiert sofort die verantwortliche Anästhesieperson, prüft den Zufuhrweg und unterstützt die umgehende klinische Anpassung von Hypnose und Analgesie. Ruhige verbale Rückversicherung kann sinnvoll sein. Notwendige Kreislaufstabilisierung erfolgt parallel.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Den Verdacht klar benennen, nicht auf spätere Erinnerung warten.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Wie ist mit einer später berichteten Erinnerung umzugehen?\u003c/h3>\u003cp>Zuhören, das Erlebte ernst nehmen und ohne suggestive Fragen dokumentieren. Ein strukturiertes ärztliches Gespräch und gegebenenfalls psychologische Unterstützung organisieren. Eine technische Untersuchung und zeitliche Rekonstruktion helfen, Ursache und Zeitpunkt einzugrenzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Keine Schuldzuweisung und keine vorschnelle definitive Erklärung geben.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Was unterscheidet Sedierung von Allgemeinanästhesie?\u003c/h3>\u003cp>Unter Sedierung kann Erinnerung je nach Tiefe und Verfahren erwartbar sein. Die vorab erläuterte Zielsetzung ist entscheidend. Eine Erinnerung darf dennoch nicht pauschal bagatellisiert werden, weil Belastung und unerwartete Erlebnisse auch dort relevant sind.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Aufklärung und dokumentiertes Verfahren bei der Einordnung berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Welche Bedeutung hat die Einleitung vor Relaxierung?\u003c/h3>\u003cp>NAP5 betont die Prüfung der Anästhetikawirkung vor neuromuskulärer Blockade und Instrumentierung. Eine verabreichte Spritze allein belegt noch keine ausreichende Wirkung. Eine Kreislaufinstabilität verlangt eine bewusste Strategie für sichere Hypnose und Stabilisierung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zeitpunkt und erkennbare Wirkung der Einleitung im Team abstimmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Was ist bei Notfällen besonders wichtig?\u003c/h3>\u003cp>Zeitdruck, veränderte Pharmakokinetik und geringe Kreislaufreserve können die Balance zwischen Hypnose und Hämodynamik erschweren. Notfallbedingungen rechtfertigen keine unbemerkte Unterbrechung der Anästhesiezufuhr. Risiken und Zuständigkeiten müssen explizit kommuniziert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei kritischer Hypotonie gleichzeitig Zufuhrstrategie und Kreislauftherapie klären.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Wie wird die Ausleitung sicher geplant?\u003c/h3>\u003cp>Operationsende, Erholung von Muskelrelaxierung und Rückkehr des Bewusstseins müssen zeitlich sinnvoll abgestimmt sein. Unzureichende neuromuskuläre Erholung bei wach werdendem Patienten kann starke Angst auslösen. Quantitative Relaxometrie und klare Teamkommunikation sind wichtig.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht allein wegen des letzten Hautstichs alle Komponenten gleichzeitig beenden.\u003c/p>\u003c/section>\u003csection id=\"chapter-18\">\u003ch3>18. Welche Dokumentation hilft der späteren Analyse?\u003c/h3>\u003cp>Zeitgestempelte Medikamentenraten, Konzentrationen, Pumpenereignisse, Zugangsprobleme, Alarme, EEG-Verlauf und Patientenaussagen sichern. Tatsachen und Interpretation getrennt dokumentieren. Nachträgliche Spekulationen dürfen Originaldaten nicht ersetzen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Geräteprotokolle und beteiligte Personen zeitnah berücksichtigen.\u003c/p>\u003c/section>\u003csection id=\"chapter-19\">\u003ch3>19. Warum werden keine festen Awareness-Inzidenzen als Einzelwahrheit angegeben?\u003c/h3>\u003cp>Die Häufigkeit hängt stark von Erhebungsmethode, Population und Definition ab. Spontan gemeldete Ereignisse und strukturierte postoperative Interviews erfassen unterschiedliche Zahlen. Eine ohne Methode genannte Rate erzeugt Scheingenauigkeit.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Bei jeder Studienzahl nachfragen, wie Erinnerung erhoben wurde.\u003c/p>\u003c/section>\u003csection id=\"chapter-20\">\u003ch3>20. Was ist die wichtigste Sicherheitsbrücke?\u003c/h3>\u003cp>Awarenessprävention beginnt mit verlässlicher kontinuierlicher Zufuhr und endet nicht bei einer Monitorzahl. Relaxierung, Übergaben und Zugangssicherheit verdienen besondere Aufmerksamkeit. Nach einem Verdacht braucht es eine empathische strukturierte Nachbetreuung.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Merksatz: Keine Bewegung ist kein Beweis für Schlaf.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evidenzgrenzen und sichere Anwendung\u003c/h2>\u003cp>Grundlagenwissen, Expertenkonsens, klinische Studien und Fachinformationen haben unterschiedliche Aussagekraft. Eine in einer bestimmten Population untersuchte Strategie ist keine automatische Empfehlung für alle Menschen. Zahlen aus Rechenbeispielen sind ausdrücklich Lernwerte; ein mathematisch korrektes Ergebnis ist noch keine medizinisch richtige Verordnung.\u003c/p>\u003cp>Dieses Modul fokussiert Erwachsene, soweit nicht ausdrücklich anders genannt. Kinder, Schwangerschaft, Organfunktionsstörungen und besondere Verfahren erfordern eigene Vorgaben. Wo kein hinreichend geprüfter präparat- oder situationsspezifischer Dosierplan vorliegt, wird keine Zahl ergänzt. Vollständigkeit der Fortbildung bedeutet nicht Vollständigkeit sämtlicher klinischer Handlungsoptionen.\u003c/p>\u003c/section>\u003csection>\u003ch2>Quellen, Zugang und Prüfstand\u003c/h2>\u003cp>Relevante zugängliche Angaben redaktionell abgeglichen am 22.11.2026. Zugriffsbeschränkungen und ältere Quellen sind unten ausgewiesen. Keine unabhängige fachärztliche Freigabe.\u003c/p>\u003col>\u003cli id=\"source-nap5\">\u003ca href=\"https://rcoa.ac.uk/nap5-handbook\" target=\"_blank\" rel=\"noopener noreferrer\">The NAP5 Handbook\u003c/a>\u003cp>Royal College of Anaesthetists / Association of Anaesthetists · Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Offizielle Empfehlungen und Zusammenfassung frei zugänglich; kein behaupteter Zugriff auf nicht gelesene Buchkapitel.\u003c/p>\u003c/li>\u003cli id=\"source-nap5-report\">\u003ca href=\"https://rcoa.ac.uk/nap5-report-publications\" target=\"_blank\" rel=\"noopener noreferrer\">NAP5 Report and publications\u003c/a>\u003cp>Royal College of Anaesthetists · NAP5-Projekt; Abruf 22.11.2026\u003c/p>\u003cp class=\"muted\">Offizielle Projekt- und Publikationsübersicht; als weiterführender Zugang verlinkt.\u003c/p>\u003c/li>\u003c/ol>\u003c/section>","guideImage":"guides/03-color.png","readingMinutes":9},{"id":"04","title":"Perioperatives Blutungsmanagement","category":"Blutung","lessonHtml":"\u003csection>\u003ch2>Einordnung und Lernziele\u003c/h2>\u003cp>Chirurgische Blutstillung und physiologische Gerinnungsbedingungen ergänzen sich. Keine einzelne Laborzahl bildet die gesamte Hämostase ab.\u003c/p>\u003cp>Diese Fortbildung verbindet klinische Grundlagen, physiologische Zusammenhänge und praktische Aufgaben der Anästhesiepflege. Nach der Bearbeitung kannst du typische Warnzeichen erklären, geeignete Informationen für die Teamentscheidung sammeln und die Grenzen einzelner Messwerte oder Maßnahmen benennen.\u003c/p>\u003cp>Der Text ist eine eigenständig formulierte, quellenbasierte Ergänzung vom 22.11.2026. Er ist keine offizielle Leitlinienübersetzung und keine ärztlich validierte Entscheidungshilfe. Medikamentenangaben beziehen sich auf den ausdrücklich genannten Kontext; aktuelle lokale Fachinformationen, ärztliche Anordnung und SOP sind maßgeblich.\u003c/p>\u003c/section>\u003csection class=\"foundation\">\u003ch2>Grundlagen im Zusammenhang\u003c/h2>\u003ch3>Was passiert im Körper?\u003c/h3>\u003cp>Blutverlust reduziert zirkulierendes Volumen und die verfügbare Erythrozytenmasse. Gerinnungsstörungen können die Blutung verstärken. Präoperative Anämie senkt die Reserve; deshalb beginnt Patient Blood Management vor der Operation.\u003c/p>\u003ch3>Erkennen und einordnen\u003c/h3>\u003cp>Sichtbarer Blutverlust, Saugervolumen und Tücher geben nur Teile des Bildes wieder. Spülflüssigkeit muss abgezogen werden. Kreislauf, Hämoglobinverlauf und Gerinnung werden im Verlauf zusammen beurteilt; ein Einzelwert beschreibt keine gesamte Blutung.\u003c/p>\u003ch3>Vorgehen im Team\u003c/h3>\u003cp>Chirurgische Blutstillung und hämostatische Versorgung parallel organisieren. Bei rascher Eskalation das lokale Massivblutungsprotokoll aktivieren. Produkte und Gerinnungstherapie richten sich nach Situation, Labor beziehungsweise viskoelastischer Diagnostik und lokaler SOP.\u003c/p>\u003ch3>Aufgaben der Anästhesiepflege\u003c/h3>\u003cp>Vor Hochrisikoeingriffen Zugänge, Wärmung, Blutverfügbarkeit und Kommunikationsweg zur Blutbank klären. Produktidentität und Patientenzuordnung konsequent prüfen. Gaben, Chargen, Mengen, Proben und Reaktionen zeitnah dokumentieren; eine Person hält die Übersicht.\u003c/p>\u003c/section>\u003csection>\u003ch2>Drei Kernaussagen\u003c/h2>\u003cul>\u003cli>Blutungsquelle und Koagulopathie parallel beurteilen.\u003c/li>\u003cli>Normothermie, ionisiertes Calcium und pH unterstützen die Hämostase.\u003c/li>\u003cli>Ein normaler früher Hb-Wert schließt akuten Blutverlust nicht aus.\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>Klinischer Transfer · fiktives Lernbeispiel\u003c/h2>\u003cp>Eine diffuse OP-Blutung nimmt zu. Temperatur und ionisiertes Calcium sind rückläufig; eine lokale Gefäßquelle wird gleichzeitig gesucht.\u003c/p>\u003cdetails>\u003csummary>Physiologie und pflegerische Einordnung\u003c/summary>\u003cp>Chirurgische Blutstillung und physiologische Gerinnungsbedingungen ergänzen sich. Keine einzelne Laborzahl bildet die gesamte Hämostase ab.\u003c/p>\u003cp>Es verbindet Blutungsprävention, frühe Erkennung, chirurgische Blutstillung und zielgerichtete Unterstützung von Kreislauf und Hämostase. Nicht jede Blutung ist eine Gerinnungsstörung. Mechanische Blutungsquelle und systemische Koagulopathie müssen parallel gesucht werden.\u003c/p>\u003cp>Operative Blutungsquelle, Bedarf an Blutprodukten, Laborlaufzeiten und Kreislauftherapie frühzeitig ansprechen. Bei dynamischer Verschlechterung den lokalen Massivblutungsplan aktivieren. Materiallogistik und Blutbankkommunikation gehören zur Therapieorganisation.\u003c/p>\u003cp>Blutungsursache, geschätzte Rate und Summe, Produkte und Faktoren, letzte Labore, Temperatur, Calcium und laufende Therapie nennen. Ungeklärte Differenzialdiagnosen und ausstehende Befunde ausdrücklich markieren. Eine scheinbar normale Zahl darf relevante Verlaufstrends nicht verdecken.\u003c/p>\u003c/details>\u003cp class=\"muted\">Diese Szene wurde zum Lernen konstruiert. Sie enthält keine echten Patientendaten und ist weder eine Studie noch der Bericht eines tatsächlich behandelten Falls.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fachliche Zusammenhänge und klinische Anwendung\u003c/h2>\u003cp>Die folgenden Abschnitte vertiefen die fachlichen Zusammenhänge. Die Praxisabschnitte ordnen das Wissen ein und ersetzen keine individuelle Anordnung.\u003c/p>\u003c/section>\u003csection id=\"chapter-1\">\u003ch3>1. Was umfasst perioperatives Blutungsmanagement?\u003c/h3>\u003cp>Es verbindet Blutungsprävention, frühe Erkennung, chirurgische Blutstillung und zielgerichtete Unterstützung von Kreislauf und Hämostase. Nicht jede Blutung ist eine Gerinnungsstörung. Mechanische Blutungsquelle und systemische Koagulopathie müssen parallel gesucht werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blutstillung nicht durch ausschließlich labororientierte Therapie verzögern.\u003c/p>\u003c/section>\u003csection id=\"chapter-2\">\u003ch3>2. Wie unterscheidet sich dieses Thema vom massiven Blutverlust?\u003c/h3>\u003cp>Blutungsmanagement beginnt bereits vor dem Eingriff mit Anamnese, Medikamentenprüfung und Risikoplanung. Massiver Blutverlust beschreibt die zeitkritische Eskalation bei großer dynamischer Blutung. Die Prinzipien überschneiden sich, der Schwerpunkt ist unterschiedlich.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Prävention und Vorbereitung als eigene Pflegeaufgaben ernst nehmen.\u003c/p>\u003c/section>\u003csection id=\"chapter-3\">\u003ch3>3. Warum ist die Blutungsanamnese wichtig?\u003c/h3>\u003cp>Frühere auffällige Blutungen, familiäre Belastung und Medikamente können ein Risiko anzeigen, das Routinegerinnungswerte nicht vollständig erfassen. Insbesondere Störungen der Thrombozytenfunktion oder von-Willebrand-Erkrankungen können übersehen werden. Eine strukturierte Anamnese ergänzt Laboruntersuchungen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Auffällige Nachblutungen nach Zahnbehandlung oder Operation gezielt weitergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-4\">\u003ch3>4. Welche Medikamente sind relevant?\u003c/h3>\u003cp>Antikoagulanzien, Thrombozytenhemmer und weitere gerinnungsbeeinflussende Mittel verändern das Risiko. Wirkstoff, letzte Einnahme, Nierenfunktion und Indikation sind entscheidend. Pausen- oder Antagonisierungsregeln hängen von Präparat und Eingriff ab und werden nicht pauschal übernommen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Nicht nur den Begriff Blutverdünner dokumentieren, sondern den exakten Wirkstoff.\u003c/p>\u003c/section>\u003csection id=\"chapter-5\">\u003ch3>5. Was bedeutet Patient Blood Management?\u003c/h3>\u003cp>PBM zielt darauf, Anämie und vermeidbaren Blutverlust zu reduzieren und den Umgang mit eingeschränkter Erythrozytenmasse zu optimieren. Dazu gehören präoperative Diagnostik, blutsparende Verfahren und individualisierte Transfusionsentscheidungen. PBM bedeutet keine Verweigerung notwendiger Blutprodukte.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Ein vorhandener Anämieplan ist Teil der perioperativen Vorbereitung.\u003c/p>\u003c/section>\u003csection id=\"chapter-6\">\u003ch3>6. Warum kann ein früher Hb-Wert täuschen?\u003c/h3>\u003cp>Bei akuter Blutung gehen zunächst Plasma und Erythrozyten gemeinsam verloren. Ohne Flüssigkeitsverschiebung oder Verdünnung kann die Konzentration anfangs relativ normal bleiben. Ein unauffälliger Einzelwert schließt erhebliche Blutverluste deshalb nicht aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Blutungsrate, Kreislauf und wiederholte Messungen einbeziehen.\u003c/p>\u003c/section>\u003csection id=\"chapter-7\">\u003ch3>7. Was unterscheidet Sauerstoffgehalt von Sättigung?\u003c/h3>\u003cp>Die Sättigung beschreibt den Anteil oxygenierter Hämoglobinbindungsstellen. Bei niedrigem Hb kann sie trotz vermindertem Sauerstoffgehalt normal sein. Das Sauerstoffangebot hängt zusätzlich vom Herzzeitvolumen ab. SpO₂ allein ist kein Transfusions- oder Perfusionsmonitor.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Normale SpO₂ bei Blutung nicht als ausreichendes Sauerstoffangebot interpretieren.\u003c/p>\u003c/section>\u003csection id=\"chapter-8\">\u003ch3>8. Welche Rolle spielt Fibrinogen?\u003c/h3>\u003cp>Fibrinogen ist das Ausgangssubstrat für Fibrin und unterstützt die Thrombusstabilität. Bei starker Blutung können Verbrauch und Verdünnung zu einem relevanten Mangel führen. Ein Ersatz wird anhand Blutung, Labor beziehungsweise viskoelastischer Diagnostik und lokalem Algorithmus beurteilt.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Fibrinogenbefund zeitnah beschaffen und im Verlauf vergleichen.\u003c/p>\u003c/section>\u003csection id=\"chapter-9\">\u003ch3>9. Was sagen Thrombozytenzahl und -funktion aus?\u003c/h3>\u003cp>Die Zahl beschreibt die Menge zirkulierender Plättchen, nicht zuverlässig deren Funktionsfähigkeit. Medikamente, Hypothermie und andere Faktoren können die Hämostase auch bei ausreichender Zahl beeinträchtigen. Umgekehrt muss ein niedriger Wert im klinischen Kontext interpretiert werden.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Zahl und bekannte Thrombozytenhemmung gemeinsam weitergeben.\u003c/p>\u003c/section>\u003csection id=\"chapter-10\">\u003ch3>10. Was leisten INR und aPTT?\u003c/h3>\u003cp>Sie untersuchen ausgewählte plasmatische Gerinnungswege unter Laborbedingungen. Sie bilden nicht die gesamte Hämostase ab und erkennen insbesondere manche Medikamenteneffekte oder Plättchenstörungen unzureichend. Normale Werte schließen eine relevante Blutungsneigung nicht absolut aus.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Laborergebnis und klinische Blutung nicht gegeneinander ausspielen.\u003c/p>\u003c/section>\u003csection id=\"chapter-11\">\u003ch3>11. Wie helfen viskoelastische Verfahren?\u003c/h3>\u003cp>Sie zeigen die Entwicklung und Festigkeit eines Gerinnsels unter definierten Messbedingungen. Je nach Test erlauben sie eine zielgerichtete Einordnung bestimmter Störungen. Ergebnisse hängen von Reagenz, Gerät und Kontext ab und sind keine vollständige Abbildung aller Blutungsursachen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Gerätespezifischen Algorithmus nutzen, keine Grenzwerte zwischen Systemen übertragen.\u003c/p>\u003c/section>\u003csection id=\"chapter-12\">\u003ch3>12. Warum ist Normothermie Teil der Blutstillung?\u003c/h3>\u003cp>Kälte beeinträchtigt Plättchenfunktion und enzymatische Prozesse. Gerinnungslabore werden häufig unter standardisierten Temperaturbedingungen gemessen und können den tatsächlichen Kälteeffekt unterschätzen. Wärmeerhalt unterstützt deshalb die Gesamthämostase.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Temperaturmessung und aktive Wärmung früh beginnen.\u003c/p>\u003c/section>\u003csection id=\"chapter-13\">\u003ch3>13. Welche Bedeutung hat ionisiertes Calcium?\u003c/h3>\u003cp>Calcium ist an Gerinnung und Herz-Kreislauf-Funktion beteiligt. Citrat aus Blutprodukten kann freies Calcium binden, besonders bei rascher Transfusion. Die ionisierte Konzentration aus einer geeigneten BGA ist klinisch aussagekräftiger als allein das Gesamtcalcium.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Wiederholte Messung und ärztlich angeordneten Ersatz vorbereiten.\u003c/p>\u003c/section>\u003csection id=\"chapter-14\">\u003ch3>14. Warum ist eine schwere Azidose ungünstig?\u003c/h3>\u003cp>Azidose kann Gerinnungsfunktion und Kreislaufantwort beeinträchtigen. Sie ist häufig zugleich Hinweis auf verminderte Gewebeperfusion. Die ursächliche Therapie umfasst vor allem Blutungskontrolle und Wiederherstellung ausreichender Perfusion; ein Puffer allein löst diese Probleme nicht.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> pH und Laktat als Verlauf, nicht als isolierte Zahlen behandeln.\u003c/p>\u003c/section>\u003csection id=\"chapter-15\">\u003ch3>15. Was ist die Funktion von Tranexamsäure?\u003c/h3>\u003cp>Sie hemmt die Aktivierung beziehungsweise Bindung von Plasminogen und vermindert fibrinolytischen Gerinnselabbau. Nutzen, Zeitpunkt und Dosierung sind indikationsabhängig. Ein Traumaalgorithmus wird nicht ungeprüft auf jeden elektiven Eingriff übertragen.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Indikation, Zeitfenster und lokale Dosisvorgabe ausdrücklich prüfen.\u003c/p>\u003c/section>\u003csection id=\"chapter-16\">\u003ch3>16. Wann sind Blutprodukte erforderlich?\u003c/h3>\u003cp>Die Entscheidung berücksichtigt Blutungsdynamik, Perfusion, Hb, Vorerkrankungen und Hämostase. Erythrozyten, Plasma, Plättchen und Gerinnungsfaktoren haben unterschiedliche Aufgaben. Kein einzelnes Produkt ersetzt eine chirurgische Blutstillung oder alle anderen Komponenten.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Produkt, therapeutisches Ziel und erwartete Wirkung gemeinsam klären.\u003c/p>\u003c/section>\u003csection id=\"chapter-17\">\u003ch3>17. Wie wird eine Transfusion sicher vorbereitet?\u003c/h3>\u003cp>Identität, Anordnung, Produktzuordnung, vorgeschriebene Verträglichkeitskontrollen und Dokumentation nach lokalem Verfahren sichern. Geeigneter Zugang und Überwachung müssen bereitstehen. Zeitdruck hebt Identitätssicherung nicht auf; Notfallwege müssen vordefiniert sein.\u003c/p>\u003cp class=\"case\">\u003cb>Klinischer Praxisbezug:\u003c/b> Eine Person benennt Produkt und Patient, eine andere kontrolliert nach SOP.\u003
